name: Dispatch MENA Cloud Latest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dispatch-mena-cloud-latest.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch MENA Cloud on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mena-epg.yml --repo "${GITHUB_REPOSITORY}" --ref main
