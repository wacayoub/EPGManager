name: EPG Daily Master Refresh

on:
  # Production MENA/Morocco workflows own the 06:00 Casablanca refresh.
  # The master schedule launches health/probe jobs only, so it never starts a
  # duplicate production scraper.
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dispatch-mena-cloud-latest.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: epg-daily-master-refresh
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Casablanca 06:00 gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour="$(TZ=Africa/Casablanca date +%H)"
          if [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled master: health checks only; production workflows use their own 06:00 schedule."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Skipping UTC duplicate slot; Casablanca hour=${hour}."
          fi

      - name: Dispatch production refresh
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.production == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          production=(
            "mena-epg.yml"
            "morocco-epg.yml"
          )

          failed=0
          for wf in "${production[@]}"; do
            echo "::group::Dispatch ${wf}"
            if gh workflow run "$wf" --repo "$repo" --ref main; then
              echo "DISPATCHED ${wf}"
            else
              echo "ERROR: could not dispatch ${wf}"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "Production dispatch failures=${failed}"
            exit 1
          fi
          echo "Production refresh dispatched successfully."

      - name: Dispatch source checks
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          checks=(
            "dmi-official-daily-probe.yml"
            "disney-mena-fast-probe.yml"
            "natgeo-ae-fast-probe.yml"
            "natgeo-arabic-cache-refresh.yml"
            "bein-event-source-audit.yml"
            "mbc-source-shadow.yml"
            "rotana-identity-shadow.yml"
            "premium-international-probe.yml"
            "alfa-epgshare-audit.yml"
            "official-provider-probe.yml"
            "official-secondary-health.yml"
            "source-integrity-audit.yml"
            "source-id-status-report.yml"
            "all-id-audit.yml"
          )

          failed=0
          for wf in "${checks[@]}"; do
            echo "::group::Dispatch ${wf}"
            if gh workflow run "$wf" --repo "$repo" --ref main; then
              echo "DISPATCHED ${wf}"
            else
              echo "WARNING: could not dispatch ${wf}"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          echo "Requested ${#checks[@]} source checks; optional dispatch failures=${failed}."
          exit 0
