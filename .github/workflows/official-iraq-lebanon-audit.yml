name: Official Iraq Lebanon EPG Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/official_iraq_lebanon_audit.py"
      - ".github/workflows/official-iraq-lebanon-audit.yml"

permissions:
  contents: write

concurrency:
  group: official-iraq-lebanon-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout EPGManager
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: current-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser
        run: pip install --disable-pip-version-check --quiet beautifulsoup4

      - name: Audit official schedules
        run: |
          set -euo pipefail
          mkdir -p output
          python -m py_compile tools/official_iraq_lebanon_audit.py
          python tools/official_iraq_lebanon_audit.py \
            --data-dir current-data \
            --json output/official-iraq-lebanon-audit.json \
            --text output/official-iraq-lebanon-audit.txt
          cat output/official-iraq-lebanon-audit.txt

      - name: Publish diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/official-iraq-lebanon-audit.json .
          cp ../output/official-iraq-lebanon-audit.txt .
          git config user.name "EPGManager Iraq Lebanon Audit"
          git config user.email "actions@users.noreply.github.com"
          git add official-iraq-lebanon-audit.json official-iraq-lebanon-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit official Iraq and Lebanon schedules"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
