name: Refresh one EPG source core

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      scheduled:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Morocco must not wait behind unrelated source downloads. Same-source runs
  # still serialize; publication uses source-scoped commits and bounded rebase.
  group: ${{ inputs.source == 'morocco' && 'epg-morocco-source-publish' || 'epg-source-publish' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Fixed GMT+0 06:00 gate
        id: gate
        shell: bash
        run: |
          if [ "${{ inputs.scheduled }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Etc/GMT date +%H)"
          if [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip duplicate GMT+0 slot; GMT hour=$hour"
          fi

      - name: Checkout scraper repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine source requirements
        if: steps.gate.outputs.run == 'true'
        id: req
        shell: bash
        run: |
          case "${{ inputs.source }}" in
            bein|osn|shahid|elcinema) echo "upstream=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "upstream=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Fix ElCinema midnight rollover and pin guide timezone
        if: steps.gate.outputs.run == 'true' && inputs.source == 'elcinema'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_elcinema_midnight_patch.py' -q
          python3 tools/elcinema_midnight_patch.py \
            --config vendor/iptv-org-epg/sites/elcinema.com/elcinema.com.config.js
          echo "ElCinema source day boundary verified; local time uses Africa/Casablanca"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Record Morocco schedule delay
        if: steps.gate.outputs.run == 'true' && inputs.source == 'morocco'
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python tools/morocco_run_timing.py --event "$TRIGGER_EVENT" --output reports/morocco-run-timing.json

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify legal Morocco GMT on Node and Python before ElCinema grab
        if: steps.gate.outputs.run == 'true' && inputs.source == 'elcinema'
        shell: bash
        run: |
          set -euo pipefail
          python tools/assert_elcinema_timezone.py \
            --adapter vendor/iptv-org-epg/sites/elcinema.com/elcinema.com.config.js

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Fix beIN AR EN guide adapter
        if: steps.gate.outputs.run == 'true' && inputs.source == 'bein'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("vendor/iptv-org-epg/sites/bein.com/bein.com.config.js")
          text=p.read_text(encoding="utf-8")
          old="    date = dayjs(date.valueOf()).subtract(1, 'day')"
          new="\n".join([
              "    const firstTimeMatch = items.length",
              "      ? (cheerio.load(items[0])('.time').text().match(/^(\\d{2}):/) || null)",
              "      : null",
              "    date = dayjs(date.valueOf())",
              "    // beIN sometimes starts a daily grid late on the previous evening",
              "    // (23:xx), but Kids grids often start exactly at 00:00. Subtracting one",
              "    // day unconditionally makes the whole Kids schedule 24h old.",
              "    if (firstTimeMatch && Number(firstTimeMatch[1]) >= 18) {",
              "      date = date.subtract(1, 'day')",
              "    }",
          ])
          if old not in text:
              raise SystemExit("beIN date-anchor patch target not found")
          text=text.replace(
              "https://www.bein.com/en/epg-ajax-template/?action=epg_fetch",
              "https://www.bein.com/${lang === 'ar' ? 'ar' : 'en'}/epg-ajax-template/?action=epg_fetch",
          )
          text=text.replace(
              "&language=${lang.toUpperCase()}&postid=25356&loadindex=0",
              "&language=${lang.toUpperCase()}&postid=${lang === 'ar' ? '25344' : '25356'}&loadindex=0",
          )
          p.write_text(text.replace(old,new,1),encoding="utf-8")
          print("beIN adapter patched: AR/EN discovery endpoints + midnight date anchoring")
          PY

      - name: Probe OSN frontend platform metadata
        if: steps.gate.outputs.run == 'true' && inputs.source == 'osn'
        shell: bash
        run: python tools/osn_frontend_probe.py || true

      - name: Refresh live OSN channel catalogue
        if: steps.gate.outputs.run == 'true' && inputs.source == 'osn'
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/output/source-build"
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"

          cfg="./sites/osn.com/osn.com.config.js"
          cp "$cfg" "$cfg.epgmanager.orig"

          best_alt_platform=""
          best_alt_rows=0

          for platform in Android Legacy; do
            cp "$cfg.epgmanager.orig" "$cfg"
            sed -i "s/platform=Android/platform=${platform}/g" "$cfg"
            sed -i "s/boxAndroid/box${platform}/g" "$cfg"

            slug="$(printf '%s' "$platform" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            ar_out="$GITHUB_WORKSPACE/output/source-build/osn_probe_${slug}_ar.channels.xml"
            en_out="$GITHUB_WORKSPACE/output/source-build/osn_probe_${slug}_en.channels.xml"
            rm -f "$ar_out" "$en_out"

            npm run channels:parse -- --config="$cfg" --output="$ar_out" --set="lang:ar" >/tmp/osn-ar.log 2>&1
            ar_rc=$?
            npm run channels:parse -- --config="$cfg" --output="$en_out" --set="lang:en" >/tmp/osn-en.log 2>&1
            en_rc=$?

            ar_rows="$(grep -c '<channel ' "$ar_out" 2>/dev/null || true)"
            en_rows="$(grep -c '<channel ' "$en_out" 2>/dev/null || true)"
            ar_rows="${ar_rows:-0}"
            en_rows="${en_rows:-0}"
            score="$ar_rows"
            [ "$en_rows" -lt "$score" ] && score="$en_rows"

            echo "OSN platform=${platform}: ar=${ar_rows} en=${en_rows} rc_ar=${ar_rc} rc_en=${en_rc}"
            grep -Ei '>(Alfa|Alpha|Cinema One|ANC|MYX|Kapatid|CineMo|Filipino|GMA|OSN.*Cinema|.*Musalsalat|.*Series).*<' "$ar_out" 2>/dev/null || true

            if [ "$platform" = "Android" ] && [ "$ar_rc" -eq 0 ] && [ "$en_rc" -eq 0 ] && [ "$score" -gt 0 ]; then
              cp "$ar_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_android_ar.channels.xml"
              cp "$en_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_android_en.channels.xml"
              cp "$ar_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_ar.channels.xml"
              cp "$en_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_en.channels.xml"
            fi

            if [ "$platform" != "Android" ] && [ "$ar_rc" -eq 0 ] && [ "$en_rc" -eq 0 ] && [ "$score" -gt "$best_alt_rows" ]; then
              best_alt_rows="$score"
              best_alt_platform="$platform"
              cp "$ar_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_other_ar.channels.xml"
              cp "$en_out" "$GITHUB_WORKSPACE/output/source-build/osn_live_other_en.channels.xml"
            fi
          done

          cp "$cfg.epgmanager.orig" "$cfg"
          if [ -n "$best_alt_platform" ]; then
            printf '%s\n' "$best_alt_platform" > "$GITHUB_WORKSPACE/output/source-build/osn_other_platform.txt"
            echo "OSN Other platform selected=${best_alt_platform} rows=${best_alt_rows}"
          else
            rm -f "$GITHUB_WORKSPACE/output/source-build/osn_other_platform.txt"
            echo "OSN Other platform unavailable; Android remains primary."
          fi
          exit 0

      - name: Refresh live beIN channel catalogue
        if: steps.gate.outputs.run == 'true' && inputs.source == 'bein'
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/output/source-build"
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          cfg="./sites/bein.com/bein.com.config.js"
          for lang in ar en; do
            out="$GITHUB_WORKSPACE/output/source-build/bein_live_${lang}.channels.xml"
            rm -f "$out"
            npm run channels:parse --               --config="$cfg"               --output="$out"               --set="lang:${lang}"
            rc=$?
            rows="$(grep -c '<channel ' "$out" 2>/dev/null || true)"
            echo "beIN live catalogue ${lang}: rows=${rows:-0} rc=$rc"
            grep -Ei '>(jeem|baraem|be.?junior|beinjunior).*<' "$out" 2>/dev/null || true
            if [ "$rc" -ne 0 ] || [ "${rows:-0}" -eq 0 ]; then
              echo "beIN live catalogue ${lang} unavailable; static catalogue remains fallback."
              rm -f "$out"
            fi
          done
          exit 0

      - name: Build provider catalogues
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        run: |
          python tools/build_catalogues.py
          if [ "${{ inputs.source }}" = "osn" ]; then
            python tools/osn_complete_catalogue.py
          fi
          if [ "${{ inputs.source }}" = "bein" ]; then
            echo "Verified beIN Kids catalogue rows:"
            grep -Ei 'xmltv_id="(JeemTV\.qa@SD|Baraem\.qa@SD|BeJunior\.qa@SD)"' output/source-build/bein.channels.xml || true
            echo "Verified beIN Kids English rows:"
            grep -Ei 'xmltv_id="(JeemTV\.qa@SD|Baraem\.qa@SD|BeJunior\.qa@SD)"' output/source-build/bein_en.channels.xml || true
          fi

      - name: Verify refresh scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bash -n tools/refresh_one_source.sh
          python -m py_compile tools/build_catalogues.py tools/publish_lkg.py tools/source_feed_pack.py tools/validate_48h.py tools/morocco_epg.py tools/aljazeera_source.py tools/starzplay_source.py tools/starzplay_api_source.py tools/stctv_source.py tools/stctv_per_id_readiness.py tools/audit_source_quality.py tools/dubaiplus_api_source.py tools/dubaiplus_verified_osn_gap.py tools/alkass_source.py tools/tunisiatv_source.py tools/tabie_source.py tools/rotana_source.py tools/rotana_verified_stc_fallback.py tools/sport24_source.py tools/sport24_verified_donors.py tools/elcinema_zero_epg_fallback.py tools/osn_complete_catalogue.py tools/osn_frontend_probe.py tools/osn_zero_epg_fallback.py

      - name: Refresh ${{ inputs.source }} for 48h
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash tools/refresh_one_source.sh "${{ inputs.source }}" 48

      - name: Commit only this source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          SOURCE="${{ inputs.source }}"
          git config user.name "EPG Source Bot"
          git config user.email "actions@users.noreply.github.com"

          git add "feeds/$SOURCE.xml.gz" "feeds/$SOURCE.txt" "feeds/$SOURCE.json" 2>/dev/null || true
          git add "reports/$SOURCE"*.json 2>/dev/null || true
          git add "reports/$SOURCE"*.md 2>/dev/null || true

          case "$SOURCE" in
            bein)
              git add reports/bein-translation.json reports/bein-ai-refine.json reports/bein-hybrid.json 2>/dev/null || true
              git add data/bein_translation_cache.json data/bein_ai_cache.json data/bein_hybrid_translation_cache.json 2>/dev/null || true
              ;;
            osn)
              git add reports/osn-hybrid.json 2>/dev/null || true
              ;;
            elcinema)
              git add reports/elcinema-hybrid.json reports/elcinema-zero-epg-fallback.json data/elcinema_translation_cache.json 2>/dev/null || true
              ;;
            starzplay)
              git add reports/starzplay-*.json 2>/dev/null || true
              ;;
            morocco)
              git add data/arryadia-history.json 2>/dev/null || true
              ;;
          esac

          if git diff --cached --quiet; then
            echo "No changes for $SOURCE"
            exit 0
          fi

          git commit -m "EPG $SOURCE 48h refresh $(TZ=Africa/Casablanca date +%F)"

          for n in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git -c rebase.autoStash=true rebase origin/main
            sleep $((n * 2))
          done
          echo "Could not publish $SOURCE after retries" >&2
          exit 1
