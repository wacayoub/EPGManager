name: MENA Recovery Source Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recovery-source-audit.yml"
      - "tools/recovery_source_audit.py"
      - "tools/no_epg_triage.py"
      - "tools/canonical_repair_audit.py"
      - "tools/all_id_audit.py"
      - "tools/bein_id_audit.py"
      - "tools/mena_integrity_guard.py"
      - "tools/mena_cloud_merge.py"
      - "tools/mena_cloud_merge_safe.py"

permissions:
  contents: write

concurrency:
  group: recovery-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load current published MENA data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mena-data
          git worktree add current-data origin/mena-data

      - name: Rebuild exhaustive current all-ID verdicts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/all_id_audit.py tools/bein_id_audit.py
          python tools/all_id_audit.py \
            --dir current-data \
            --manifest current-data/shards.json \
            --json /tmp/recovery-all-id.json \
            --text /tmp/recovery-all-id.txt \
            --csv /tmp/recovery-all-id.csv

      - name: Audit recovery candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/recovery_source_audit.py tools/no_epg_triage.py tools/canonical_repair_audit.py tools/mena_integrity_guard.py tools/mena_cloud_merge.py tools/mena_cloud_merge_safe.py
          mkdir -p output
          python tools/recovery_source_audit.py \
            --all-id-csv /tmp/recovery-all-id.csv \
            --output-json output/recovery-source-audit.json \
            --output-text output/recovery-source-audit.txt \
            --window-hours 48
          python tools/no_epg_triage.py \
            --csv /tmp/recovery-all-id.csv \
            --merge-report current-data/merge-report.json \
            --json output/no-epg-triage.json \
            --text output/no-epg-triage.txt
          python tools/canonical_repair_audit.py \
            --csv /tmp/recovery-all-id.csv \
            --json output/canonical-repair-audit.json \
            --text output/canonical-repair-audit.txt

      - name: Publish diagnostics to mena-data
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/recovery-source-audit.json .
          cp ../output/recovery-source-audit.txt .
          cp ../output/no-epg-triage.json .
          cp ../output/no-epg-triage.txt .
          cp ../output/canonical-repair-audit.json .
          cp ../output/canonical-repair-audit.txt .
          cp /tmp/recovery-all-id.json all-id-audit.json
          cp /tmp/recovery-all-id.csv all-id-audit.csv
          git config user.name "EPGManager Recovery Audit"
          git config user.email "actions@users.noreply.github.com"
          git add recovery-source-audit.json recovery-source-audit.txt no-epg-triage.json no-epg-triage.txt canonical-repair-audit.json canonical-repair-audit.txt all-id-audit.json all-id-audit.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Audit candidate MENA recovery sources"
          git push origin HEAD:mena-data
