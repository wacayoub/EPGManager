name: Sport24 Fast Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sport24_probe.py"
      - ".github/workflows/sport24-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/sport24_probe.py
      - name: Publish probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Source Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          git worktree add publish-probe origin/mena-data
          cd publish-probe
          git checkout -B mena-data origin/mena-data
          cp ../sport24-probe.json ./sport24-probe.json
          git add sport24-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Sport24 probe"
          git pull --rebase origin mena-data
          git push origin HEAD:mena-data
