name: Promote Exact Placeholder Prune

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/promote-placeholder-prune.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply validated one-line production change
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/mena_cloud_finalize_safe.py')
          s=p.read_text(encoding='utf-8')
          old='if _PLACEHOLDER_RE.match(title) and duration > 60 * 60:'
          new='if _PLACEHOLDER_RE.match(title):'
          assert s.count(old) == 1, 'expected exactly one old placeholder condition'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile tools/mena_cloud_finalize_safe.py tools/mena_cloud_finalize_strict.py
          git diff --check
          git diff -- tools/mena_cloud_finalize_safe.py
      - name: Commit production policy
        run: |
          set -euo pipefail
          git config user.name "EPGManager Quality Gate"
          git config user.email "actions@users.noreply.github.com"
          git add tools/mena_cloud_finalize_safe.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prune all exact placeholder programme rows"
          git push origin HEAD:main
