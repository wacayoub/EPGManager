name: MENA Alias Bridge Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alias-bridge-audit.yml"
      - "tools/external_alias_bridge_audit.py"
      - "tools/all_id_audit.py"
      - "tools/bein_id_audit.py"

permissions:
  contents: write

concurrency:
  group: mena-alias-bridge-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load published MENA data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mena-data
          git worktree add current-data origin/mena-data

      - name: Rebuild current exhaustive verdicts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/all_id_audit.py tools/bein_id_audit.py tools/external_alias_bridge_audit.py
          python tools/all_id_audit.py \
            --dir current-data \
            --manifest current-data/shards.json \
            --json /tmp/alias-all-id.json \
            --text /tmp/alias-all-id.txt \
            --csv /tmp/alias-all-id.csv

      - name: Test external aliases against existing live canonicals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python tools/external_alias_bridge_audit.py \
            --csv /tmp/alias-all-id.csv \
            --json output/alias-bridge-audit.json \
            --text output/alias-bridge-audit.txt

      - name: Publish diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/alias-bridge-audit.json .
          cp ../output/alias-bridge-audit.txt .
          git config user.name "EPGManager Alias Audit"
          git config user.email "actions@users.noreply.github.com"
          git add alias-bridge-audit.json alias-bridge-audit.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Audit external aliases against live canonicals"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
