name: Verify exact EPG source publication attempt
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      expected_run_id:
        required: false
        type: string
        default: ''
      expected_run_attempt:
        required: false
        type: string
        default: '1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify producer commit and current published source
        shell: bash
        env:
          SOURCE_NAME: ${{ inputs.source }}
          PRODUCER_RUN_ID: ${{ inputs.expected_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.expected_run_attempt }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.verify_source_attempt import verify
          source=os.environ['SOURCE_NAME']
          run=os.environ['PRODUCER_RUN_ID']
          attempt=os.environ['PRODUCER_ATTEMPT']
          if not run:
              latest=json.loads(Path('reports',source+'-publish-lkg.json').read_text(encoding='utf-8'))
              run=str(latest.get('github_run_id',''))
              attempt=str(latest.get('github_run_attempt','1'))
          print(json.dumps(verify('.',source,run,attempt),ensure_ascii=False,indent=2))
          PY
