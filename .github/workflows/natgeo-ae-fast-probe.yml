name: NatGeo AE Fast Arabic Probe

on:
  push:
    paths:
      - ".github/workflows/natgeo-ae-fast-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fast parallel official schedule probe
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, re, urllib.request
          from datetime import date,timedelta
          start=date(2026,9,14)
          urls=[]
          for i in range(4):
              d=start+timedelta(days=i); t=d.strftime('%d%m%y')
              urls += [
                f'https://www.natgeotv.com/ae/listings/ngc/{t}',
                f'https://www.natgeotv.com/me/listings/ngc/{t}',
              ]
          # weekly endpoints seen in NatGeo MENA site structure
          for i in range(4):
              d=start+timedelta(days=i); t=d.strftime('%d%m%y')
              urls += [
                f'https://www.natgeotv.com/ae/listings/weekly/ngc/{t}/1',
                f'https://www.natgeotv.com/me/listings/weekly/ngc/{t}/1',
              ]
          def one(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ar,en;q=0.7'})
                  with urllib.request.urlopen(req,timeout=7) as r:
                      b=r.read().decode('utf-8','replace'); final=r.geturl(); status=r.status
                  ar=len(re.findall(r'[\u0600-\u06ff]',b))
                  # schedule signals + a few Arabic title-ish text snippets
                  txt=re.sub(r'<script.*?</script>|<style.*?</style>',' ',b,flags=re.I|re.S)
                  txt=re.sub(r'<[^>]+>',' ',txt)
                  txt=re.sub(r'\s+',' ',txt)
                  times=len(re.findall(r'\b(?:[0-1]?\d|2[0-3])[:.]\d\d\s*(?:am|pm)?\b',txt,re.I))
                  snippets=[]
                  for m in re.finditer(r'[\u0600-\u06ff][\u0600-\u06ff\s،:؛؟\-0-9]{8,120}',txt):
                      s=' '.join(m.group(0).split())
                      if s not in snippets: snippets.append(s)
                  return url,status,final,len(b),ar,times,snippets[:8]
              except Exception as e:
                  return url,'ERR',repr(e),0,0,0,[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              rows=list(ex.map(one,urls))
          good=[]
          for row in rows:
              print('\nURL=',row[0]); print('STATUS=',row[1],'FINAL=',row[2]); print('bytes=%s arabic=%s times=%s'%(row[3],row[4],row[5]))
              for s in row[6]: print('AR',s)
              if row[1]==200 and row[4]>300 and row[5]>=8: good.append(row)
          print('\nGOOD_OFFICIAL_ARABIC_SCHEDULE_PAGES=',len(good))
          for g in good: print('GOOD',g[0])
          raise SystemExit(0 if len(good)>=2 else 2)
          PY
