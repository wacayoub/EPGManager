name: MENA Arabic EPG Cloud

on:
  # GitHub cron is UTC. The local-time gate keeps only 06:00/18:00 Africa/Casablanca.
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:
  # Temporary bootstrap trigger. Remove after the first verified production run.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mena-epg.yml"
      - "tools/mena_cloud_catalog.py"
      - "tools/mena_cloud_finalize.py"

permissions:
  contents: write

concurrency:
  group: mena-arabic-epg-cloud
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC cron slot; Casablanca hour is ${hour}."
            fi
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure permanent mena-data endpoint exists
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin mena-data >/dev/null 2>&1; then
            echo "mena-data already exists."
            exit 0
          fi

          rm -rf bootstrap publish
          mkdir -p bootstrap
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.Element("tv", {"generator-info-name":"EPGManager MENA Arabic Cloud"})
          xml = ET.tostring(root, encoding="utf-8", xml_declaration=True)
          Path("bootstrap/mena-arabic.xml.gz").write_bytes(gzip.compress(xml, compresslevel=9))
          Path("bootstrap/mena-arabic.txt").write_text("EPGManager MENA Arabic Cloud bootstrap\n", encoding="utf-8")
          Path("bootstrap/manifest.json").write_text(json.dumps({
              "schema":1,
              "status":"bootstrap",
              "generated":datetime.now(timezone.utc).isoformat(),
              "channels":0,
              "programmes":0
          }, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach publish
          cd publish
          git checkout --orphan mena-data
          git rm -rf . >/dev/null 2>&1 || true
          cp ../bootstrap/mena-arabic.xml.gz .
          cp ../bootstrap/mena-arabic.txt .
          cp ../bootstrap/manifest.json .
          printf '%s\n' 'EPGManager MENA Arabic Cloud data branch.' > README.md
          git add mena-arabic.xml.gz mena-arabic.txt manifest.json README.md
          git commit -m "Bootstrap MENA Arabic EPG endpoint"
          git push origin mena-data

  build:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout EPGManager generator
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify MENA cloud scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/mena_cloud_catalog.py tools/mena_cloud_finalize.py

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build all-Arabic official-first channel catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/iptv-org-epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json

      - name: Download Last Known Good MENA feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o previous/mena-arabic.xml.gz || true

      - name: Grab Arabic programme data from selected websites
        if: steps.gate.outputs.run == 'true'
        id: grab
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=7 \
              --maxConnections=3 \
              --timeout=20000
          rc=$?
          echo "grab_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "Upstream grab returned ${rc}; per-channel LKG will protect existing coverage."
          fi
          exit 0

      - name: Merge fresh data with per-channel LKG
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s output/raw.xml || { echo "No raw XMLTV candidate generated"; exit 1; }
          python tools/mena_cloud_finalize.py \
            --candidate output/raw.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --output-dir output/final

      - name: Validate production feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('output/final/mena-arabic.xml.gz')
          root = ET.fromstring(gzip.decompress(p.read_bytes()))
          channels = root.findall('channel')
          programmes = root.findall('programme')
          manifest = json.loads(Path('output/final/manifest.json').read_text(encoding='utf-8'))
          assert len(channels) >= 25, len(channels)
          assert len(programmes) >= 100, len(programmes)
          assert manifest['channels'] == len(channels), (manifest['channels'], len(channels))
          assert manifest['programmes'] == len(programmes), (manifest['programmes'], len(programmes))
          print('PASS: %d MENA Arabic channels / %d programmes / Arabic titles %.1f%%' % (
              len(channels), len(programmes), 100.0 * manifest.get('arabic_title_ratio', 0)))
          PY

      - name: Publish atomically to mena-data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          cp ../output/final/mena-arabic.xml.gz .
          cp ../output/final/mena-arabic.txt .
          cp ../output/final/manifest.json .
          cp ../output/catalog.json catalog.json
          printf '%s\n' 'EPGManager MENA Arabic Cloud data branch. Generated from Arabic TV guide websites with official-first source selection and per-channel Last Known Good protection.' > README.md
          git add mena-arabic.xml.gz mena-arabic.txt manifest.json catalog.json README.md
          if git diff --cached --quiet; then
            echo "No MENA data changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "MENA Arabic EPG ${stamp}"
          git push origin mena-data
