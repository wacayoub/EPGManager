name: MENA Cloud EPG

on:
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mena-epg.yml"
      - "tools/mena_cloud_catalog.py"
      - "tools/mena_cloud_merge.py"
      - "tools/mena_cloud_merge_safe.py"
      - "tools/mena_cloud_merge_arabic_first.py"
      - "tools/mena_cloud_finalize.py"
      - "tools/mena_cloud_finalize_safe.py"
      - "tools/mena_cloud_finalize_strict.py"
      - "tools/mena_cloud_finalize_pruned.py"
      - "tools/mena_cloud_shards.py"
      - "tools/mena_cloud_shards_safe.py"
      - "tools/mena_cloud_shards_strict.py"
      - "tools/mena_program_audit.py"
      - "tools/mena_global_epg_audit.py"
      - "tools/virtual_epgmanager_test.py"
      - "tools/arabic_priority_test.py"
      - "tools/bein_id_audit.py"
      - "tools/bein_provider_repair.py"
      - "tools/bein_id_audit_policy.py"
      - "tools/mena_integrity_guard.py"
      - "tools/all_id_audit_alias_aware.py"
      - "tools/all_id_audit_verified_exceptions.py"
      - "tools/bein_final_regression.py"
      - "tools/osn_id_audit_policy.py"
      - "tools/osn_final_regression.py"
      - "tools/osn_bilingual_enrich.py"
      - "tools/mbc_id_audit_policy.py"
      - "tools/mbc_final_regression.py"
      - "tools/mbc_gap_repair.py"
      - "tools/canonical_receiver_cleanup.py"
      - "tools/bein_receiver_id_normalize.py"
      - "tools/global_receiver_id_normalize.py"
      - "tools/provider_namespace_polish.py"
      - "tools/canonical_publish_finalize.py"
      - "tools/receiver_release_gate.py"
      - "tools/namespace_replay_test.py"
      - "tools/natgeo_ad_arabic_enrich.py"
      - "data/natgeo_ad_arabic_metadata.json"

permissions:
  contents: write

concurrency:
  group: mena-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC slot; Casablanca hour=${hour}."
            fi
          fi

      - name: Checkout EPGManager generator
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify MENA cloud scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_catalog.py \
            tools/mena_cloud_merge.py \
            tools/mena_cloud_merge_safe.py \
            tools/mena_cloud_merge_arabic_first.py \
            tools/mena_cloud_finalize.py \
            tools/mena_cloud_finalize_safe.py \
            tools/mena_cloud_finalize_strict.py \
            tools/mena_cloud_finalize_pruned.py \
            tools/mena_cloud_shards.py \
            tools/mena_cloud_shards_safe.py \
            tools/mena_cloud_shards_strict.py \
            tools/mena_program_audit.py \
            tools/mena_global_epg_audit.py \
            tools/virtual_epgmanager_test.py \
            tools/arabic_priority_test.py \
            tools/bein_id_audit.py \
            tools/bein_provider_repair.py \
            tools/bein_id_audit_policy.py \
            tools/mena_integrity_guard.py \
            tools/all_id_audit_alias_aware.py \
            tools/all_id_audit_verified_exceptions.py \
            tools/bein_final_regression.py \
            tools/osn_id_audit_policy.py \
            tools/osn_final_regression.py \
            tools/osn_bilingual_enrich.py \
            tools/mbc_id_audit_policy.py \
            tools/mbc_final_regression.py \
            tools/mbc_gap_repair.py \
            tools/canonical_receiver_cleanup.py \
            tools/bein_receiver_id_normalize.py \
            tools/global_receiver_id_normalize.py \
            tools/provider_namespace_polish.py \
            tools/canonical_publish_finalize.py \
            tools/receiver_release_gate.py \
            tools/namespace_replay_test.py \
            tools/natgeo_ad_arabic_enrich.py

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build official-first Arabic TV catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/iptv-org-epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json

      - name: Build official OSN English-title donor catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/osn_bilingual_enrich.py build-channels \
            --catalog-manifest output/catalog.json \
            --output output/osn-en.channels.xml

      - name: Download authoritative channel-country metadata
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 30 \
            "https://iptv-org.github.io/api/channels.json" \
            -o output/channels.json; then
            echo '[]' > output/channels.json
            echo "Channel metadata unavailable; conservative fallback classifier will be used."
          fi

      - name: Download Last Known Good combined MENA feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o previous/mena-arabic.xml.gz || true
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/receiver-id-aliases.json" \
            -o previous/receiver-id-aliases.json || true

      - name: Bootstrap exact pre-normalization LKG aliases when absent
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s previous/receiver-id-aliases.json ]; then
            echo "Published receiver alias bridge is available."
            exit 0
          fi
          git fetch origin mena-data
          git worktree add previous/bootstrap ed60528727ef8a579db63eefc4f2e7fd5ea90db5
          python tools/canonical_publish_finalize.py --dir previous/bootstrap
          cp previous/bootstrap/receiver-id-aliases.json previous/receiver-id-aliases.json
          test -s previous/receiver-id-aliases.json
          echo "Bootstrapped exact raw-to-canonical LKG aliases from the retained pre-normalization snapshot."

      - name: Grab primary programme data - 2 days only
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=2 \
              --maxConnections=3 \
              --timeout=20000
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Upstream grab returned ${rc}; cloud merge + per-channel LKG will protect coverage."
          fi
          if [ ! -s "${GITHUB_WORKSPACE}/output/raw.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/raw.xml"
          fi
          exit 0

      - name: Grab official OSN English title donor - 2 days only
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set +e
          timeout --signal=TERM --kill-after=20s 600s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/osn-en.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/osn-en.xml" \
              --days=2 \
              --maxConnections=1 \
              --timeout=20000
          rc=$?
          echo "OSN English donor grab rc=${rc}"
          if [ ! -s "${GITHUB_WORKSPACE}/output/osn-en.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/osn-en.xml"
          fi
          exit 0

      - name: Merge MENA feeds with Arabic-first language arbitration
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge_arabic_first.py \
            --primary output/raw.xml \
            --catalog-manifest output/catalog.json \
            --output output/merged.xml \
            --report output/merge-report.json \
            --cache-dir output/upstream \
            --window-hours 48

      - name: Finalize combined MENA with strict LKG/provider quality gate and zero-EPG prune
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_finalize_pruned.py \
            --candidate output/merged.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --receiver-aliases previous/receiver-id-aliases.json \
            --merge-report output/merge-report.json \
            --window-hours 48 \
            --output-dir output/final

      - name: Split MENA by country and premium provider
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_shards_strict.py \
            --source-cache-dir output/upstream \
            --channel-metadata output/channels.json \
            --input output/final/mena-arabic.xml.gz \
            --catalog-manifest output/catalog.json \
            --output-dir output/final \
            --manifest output/final/shards.json

      - name: Enrich OSN with official English titles and preserve Arabic descriptions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/osn_bilingual_enrich.py enrich \
            --xml output/final/provider-osn.xml.gz \
            --donor output/osn-en.xml \
            --report-json output/final/osn-bilingual-enrichment.json \
            --report-text output/final/osn-bilingual-enrichment.txt

      - name: Enrich verified NatGeo Arabic metadata before canonical publication
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/natgeo_ad_arabic_enrich.py audit-cache \
            --cache data/natgeo_ad_arabic_metadata.json
          python tools/natgeo_ad_arabic_enrich.py enrich \
            --xml output/final/provider-adm.xml.gz \
            --output output/final/provider-adm.xml.gz \
            --cache data/natgeo_ad_arabic_metadata.json \
            --report-json output/final/natgeo-arabic-enrichment.json \
            --report-text output/final/natgeo-arabic-enrichment.txt
          for f in mena-arabic.xml.gz mena.xml.gz premium.xml.gz; do
            python tools/natgeo_ad_arabic_enrich.py enrich \
              --xml "output/final/$f" \
              --output "output/final/$f" \
              --cache data/natgeo_ad_arabic_metadata.json
          done

      - name: Canonicalize once and rebuild every publish artifact from final bytes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s previous/receiver-id-aliases.json ]; then
            cp previous/receiver-id-aliases.json output/final/receiver-id-aliases.json
          fi
          python tools/canonical_publish_finalize.py --dir output/final

      - name: Gate canonical receiver release and real coverage
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/receiver_release_gate.py \
            --dir output/final \
            --minimum-median-future-hours 30 \
            --json output/final/receiver-release-gate.json \
            --text output/final/receiver-release-gate.txt
          python tools/namespace_replay_test.py --dir output/final

      - name: Audit key programme display samples
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_program_audit.py \
            --dir output/final \
            --json output/final/program-audit.json \
            --text output/final/program-audit.txt \
            --events 5

      - name: Audit all MENA programmes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_global_epg_audit.py \
            --dir output/final \
            --manifest output/final/shards.json \
            --json output/final/global-epg-audit.json \
            --text output/final/global-epg-audit.txt \
            --sample-limit 40

      - name: Run virtual EPGManager integration test
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/virtual_epgmanager_test.py \
            --dir output/final \
            --json output/final/virtual-epgmanager.json \
            --text output/final/virtual-epgmanager.txt \
            --events 5

      - name: Run Arabic-first local-channel regression test
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/arabic_priority_test.py \
            --dir output/final \
            --json output/final/arabic-priority-test.json \
            --text output/final/arabic-priority-test.txt

      - name: Audit every beIN XMLTV ID - raw diagnostic
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/bein_id_audit.py \
            --xml output/final/provider-bein.xml.gz \
            --json output/final/bein-id-audit.json \
            --text output/final/bein-id-audit.txt

      - name: Audit beIN with production language policy
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/bein_id_audit_policy.py \
            --xml output/final/provider-bein.xml.gz \
            --json output/final/bein-id-audit-policy.json \
            --text output/final/bein-id-audit-policy.txt

      - name: Run final beIN regression gate
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/bein_final_regression.py \
            --xml output/final/provider-bein.xml.gz \
            --audit-json output/final/bein-id-audit-policy.json \
            --text output/final/bein-final-regression.txt

      - name: Audit OSN with production source policy
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/osn_id_audit_policy.py \
            --xml output/final/provider-osn.xml.gz \
            --json output/final/osn-id-audit-policy.json \
            --text output/final/osn-id-audit-policy.txt

      - name: Run final OSN regression gate
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/osn_final_regression.py \
            --xml output/final/provider-osn.xml.gz \
            --audit-json output/final/osn-id-audit-policy.json \
            --text output/final/osn-final-regression.txt

      - name: Run coherent all-ID release audit before publication
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/all_id_audit_verified_exceptions.py \
            --dir output/final \
            --manifest output/final/shards.json \
            --json output/final/all-id-audit.json \
            --text output/final/all-id-audit.txt \
            --csv output/final/all-id-audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/final/all-id-audit.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('output/final/shards.json').read_text(encoding='utf-8'))
          summary = report['summary']
          assert not summary['missing_shards'], summary['missing_shards']
          assert summary['channels'] == manifest['published_channels']
          assert int(summary.get('FAIL', 0) or 0) == 0, summary
          assert int(summary.get('NO_EPG', 0) or 0) == 0, summary
          print('ALL_ID_RELEASE PASS', summary)
          PY

      - name: Publish atomically to mena-data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          cp ../output/final/*.xml.gz .
          cp ../output/final/*.txt .
          cp ../output/final/*.json .
          cp ../output/final/*.csv .
          cp ../output/catalog.json catalog.json
          cp ../output/merge-report.json merge-report.json
          printf '%s\n' \
            'EPGManager MENA Cloud data branch. TV-only guide requested up to 48 hours; the measured future horizon is recorded and release-gated in manifest.json. Receiver-facing XML omits channel identities with zero final programmes to reduce parsing and memory cost. Event channels reappear automatically when real EPG is available. Receiver sources use one canonical ID namespace and are split exclusively by premium/provider identity first, then country, then MENA Other. Arabic programme metadata is preferred before English/international fallback for regular MENA channels. Premium OSN uses official English titles with official Arabic descriptions when exact bilingual slots are available. Morocco stays on its dedicated Morocco Cloud. mena plus premium are an exact disjoint union of mena-arabic for compatibility.' \
            > README.md
          git add *.xml.gz *.txt *.json *.csv README.md
          if git diff --cached --quiet; then
            echo "No MENA data changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "MENA Cloud authoritative country/provider shards ${stamp}"
          git pull --rebase origin mena-data
          git push origin HEAD:mena-data
