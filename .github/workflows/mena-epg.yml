name: MENA Cloud EPG

on:
  push:
    branches:
      - mena-cloud-rc29-merge
  # GitHub cron is UTC. The local-time gate handles Morocco DST/UTC changes.
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mena-cloud-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC slot; Casablanca hour=${hour}."
            fi
          fi

      - name: Checkout EPGManager generator
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify MENA cloud scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_catalog.py \
            tools/mena_cloud_merge.py \
            tools/mena_cloud_finalize.py

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build official-first Arabic TV catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/iptv-org-epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json

      - name: Download Last Known Good MENA feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o previous/mena-arabic.xml.gz || true

      - name: Grab primary programme data - 2 days only
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=2 \
              --maxConnections=3 \
              --timeout=20000
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Upstream grab returned ${rc}; cloud merge + per-channel LKG will protect coverage."
          fi
          if [ ! -s "${GITHUB_WORKSPACE}/output/raw.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/raw.xml"
          fi
          exit 0

      - name: Merge OpenEPG + EPGShare MENA feeds
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge.py \
            --primary output/raw.xml \
            --catalog-manifest output/catalog.json \
            --output output/merged.xml \
            --report output/merge-report.json \
            --cache-dir output/upstream \
            --window-hours 48

      - name: Finalize with per-channel LKG
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_finalize.py \
            --candidate output/merged.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --merge-report output/merge-report.json \
            --window-hours 48 \
            --output-dir output/final

      - name: Validate production feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path('output/final/mena-arabic.xml.gz')
          root = ET.fromstring(gzip.decompress(p.read_bytes()))
          channels = root.findall('channel')
          programmes = root.findall('programme')
          manifest = json.loads(Path('output/final/manifest.json').read_text(encoding='utf-8'))

          ids = [(c.get('id') or '').strip() for c in channels]
          assert all(ids), 'empty channel id'
          assert len(ids) == len(set(ids)), 'duplicate channel ids remain'

          event_keys = []
          for e in programmes:
            key = ((e.get('channel') or '').strip(),
                   (e.get('start') or '').strip(),
                   (e.get('stop') or '').strip())
            assert key[0] and key[1], 'invalid programme key'
            event_keys.append(key)
          assert len(event_keys) == len(set(event_keys)), 'duplicate programme slots remain'

          assert len(channels) >= 25, len(channels)
          assert len(programmes) >= 100, len(programmes)
          assert manifest['channels'] == len(channels)
          assert manifest['programmes'] == len(programmes)
          assert manifest['window_hours'] == 48

          print('PASS: %d MENA TV channels / %d programmes / AR titles %.1f%% / hybrid premium=%d' % (
              len(channels), len(programmes),
              100.0 * manifest.get('arabic_title_ratio', 0),
              manifest.get('premium_hybrid_events', 0)))
          PY

      - name: Publish atomically to mena-data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          cp ../output/final/mena-arabic.xml.gz .
          cp ../output/final/mena-arabic.txt .
          cp ../output/final/manifest.json .
          cp ../output/catalog.json catalog.json
          cp ../output/merge-report.json merge-report.json
          printf '%s\n' \
            'EPGManager MENA Cloud data branch. TV-only, rolling 48-hour guide. Official/iptv-org + OpenEPG + MENA-relevant EPGShare feeds, conservative channel de-duplication, Arabic-first metadata, and beIN/OSN English-title + Arabic-description enrichment. Morocco remains on its dedicated cloud feed. SAT.TV is not used.' \
            > README.md
          git add mena-arabic.xml.gz mena-arabic.txt manifest.json catalog.json merge-report.json README.md
          if git diff --cached --quiet; then
            echo "No MENA data changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "MENA Cloud EPG ${stamp}"
          git push origin mena-data
