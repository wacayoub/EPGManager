name: MENA Cloud EPG

on:
  # GitHub cron is UTC. The local-time gate handles Morocco DST/UTC changes.
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mena-cloud-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC slot; Casablanca hour=${hour}."
            fi
          fi

      - name: Checkout EPGManager generator
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify MENA cloud scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_catalog.py \
            tools/mena_cloud_merge.py \
            tools/mena_cloud_finalize.py

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build official-first Arabic TV catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/iptv-org-epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json

      - name: Download Last Known Good combined MENA feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o previous/mena-arabic.xml.gz || true

      - name: Grab primary programme data - 2 days only
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=2 \
              --maxConnections=3 \
              --timeout=20000
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Upstream grab returned ${rc}; cloud merge + per-channel LKG will protect coverage."
          fi
          if [ ! -s "${GITHUB_WORKSPACE}/output/raw.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/raw.xml"
          fi
          exit 0

      - name: Merge OpenEPG + EPGShare MENA feeds
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge.py \
            --primary output/raw.xml \
            --catalog-manifest output/catalog.json \
            --output output/merged.xml \
            --report output/merge-report.json \
            --cache-dir output/upstream \
            --window-hours 48

      - name: Finalize + split MENA and Premium with per-channel LKG
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_finalize.py \
            --candidate output/merged.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --merge-report output/merge-report.json \
            --window-hours 48 \
            --output-dir output/final

      - name: Validate production feeds and split invariants
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, xml.etree.ElementTree as ET
          from pathlib import Path

          def load(stem):
              p = Path('output/final/%s.xml.gz' % stem)
              root = ET.fromstring(gzip.decompress(p.read_bytes()))
              channels = root.findall('channel')
              programmes = root.findall('programme')
              ids = [(c.get('id') or '').strip() for c in channels]
              assert all(ids), '%s: empty channel id' % stem
              assert len(ids) == len(set(ids)), '%s: duplicate channel ids remain' % stem
              event_keys = []
              for e in programmes:
                  key = ((e.get('channel') or '').strip(),
                         (e.get('start') or '').strip(),
                         (e.get('stop') or '').strip())
                  assert key[0] and key[1], '%s: invalid programme key' % stem
                  event_keys.append(key)
              assert len(event_keys) == len(set(event_keys)), '%s: duplicate programme slots remain' % stem
              assert set(e.get('channel') for e in programmes).issubset(set(ids)), '%s: programme references missing channel' % stem
              return set(ids), len(programmes)

          combined_ids, combined_events = load('mena-arabic')
          mena_ids, mena_events = load('mena')
          premium_ids, premium_events = load('premium')
          manifest = json.loads(Path('output/final/manifest.json').read_text(encoding='utf-8'))

          assert len(combined_ids) >= 25, len(combined_ids)
          assert combined_events >= 100, combined_events
          assert len(mena_ids) >= 25, len(mena_ids)
          assert mena_events >= 100, mena_events
          assert len(premium_ids) >= 1, len(premium_ids)
          assert premium_events >= 2, premium_events
          assert not (mena_ids & premium_ids), 'MENA/Premium split overlap'
          assert (mena_ids | premium_ids) == combined_ids, 'MENA/Premium union != combined'
          assert manifest['channels'] == len(combined_ids)
          assert manifest['programmes'] == combined_events
          assert manifest['window_hours'] == 48
          assert manifest['splits']['mena']['channels'] == len(mena_ids)
          assert manifest['splits']['premium']['channels'] == len(premium_ids)

          print('PASS: combined=%d/%d MENA=%d/%d PREMIUM=%d/%d hybrid=%d' % (
              len(combined_ids), combined_events,
              len(mena_ids), mena_events,
              len(premium_ids), premium_events,
              manifest.get('premium_hybrid_events', 0)))
          PY

      - name: Publish atomically to mena-data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          cp ../output/final/mena-arabic.xml.gz .
          cp ../output/final/mena-arabic.txt .
          cp ../output/final/mena.xml.gz .
          cp ../output/final/mena.txt .
          cp ../output/final/premium.xml.gz .
          cp ../output/final/premium.txt .
          cp ../output/final/manifest.json .
          cp ../output/catalog.json catalog.json
          cp ../output/merge-report.json merge-report.json
          printf '%s\n' \
            'EPGManager MENA Cloud data branch. Receiver-optimized split: mena.xml.gz contains regular MENA TV, premium.xml.gz contains beIN/OSN, and mena-arabic.xml.gz remains the legacy combined compatibility feed. TV-only, rolling 48-hour guide, conservative de-duplication, Arabic-first regular metadata, and premium English-title + Arabic-description enrichment. Morocco remains on its dedicated cloud feed. SAT.TV is not used.' \
            > README.md
          git add mena-arabic.xml.gz mena-arabic.txt mena.xml.gz mena.txt premium.xml.gz premium.txt manifest.json catalog.json merge-report.json README.md
          if git diff --cached --quiet; then
            echo "No MENA data changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "MENA Cloud split EPG ${stamp}"
          git push origin mena-data
