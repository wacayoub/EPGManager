name: MENA Cloud EPG

on:
  schedule:
    - cron: "0 5,6,17,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mena-epg.yml"
      - "tools/mena_cloud_catalog.py"
      - "tools/mena_cloud_merge.py"
      - "tools/mena_cloud_merge_safe.py"
      - "tools/mena_cloud_finalize.py"
      - "tools/mena_cloud_shards.py"
      - "tools/mena_cloud_shards_safe.py"

permissions:
  contents: write

concurrency:
  group: mena-cloud-epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Local schedule gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC slot; Casablanca hour=${hour}."
            fi
          fi

      - name: Checkout EPGManager generator
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify MENA cloud scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_catalog.py \
            tools/mena_cloud_merge.py \
            tools/mena_cloud_merge_safe.py \
            tools/mena_cloud_finalize.py \
            tools/mena_cloud_shards.py \
            tools/mena_cloud_shards_safe.py

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build official-first Arabic TV catalogue
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/iptv-org-epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json

      - name: Download Last Known Good combined MENA feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 25 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o previous/mena-arabic.xml.gz || true

      - name: Grab primary programme data - 2 days only
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=2 \
              --maxConnections=3 \
              --timeout=20000
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Upstream grab returned ${rc}; cloud merge + per-channel LKG will protect coverage."
          fi
          if [ ! -s "${GITHUB_WORKSPACE}/output/raw.xml" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/raw.xml"
          fi
          exit 0

      - name: Merge OpenEPG + EPGShare MENA feeds
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge_safe.py \
            --primary output/raw.xml \
            --catalog-manifest output/catalog.json \
            --output output/merged.xml \
            --report output/merge-report.json \
            --cache-dir output/upstream \
            --window-hours 48

      - name: Finalize combined MENA with per-channel LKG
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_finalize.py \
            --candidate output/merged.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --merge-report output/merge-report.json \
            --window-hours 48 \
            --output-dir output/final

      - name: Split MENA by country and premium provider
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_shards_safe.py \
            --source-cache-dir output/upstream \
            --input output/final/mena-arabic.xml.gz \
            --catalog-manifest output/catalog.json \
            --output-dir output/final \
            --manifest output/final/shards.json

      - name: Validate production feeds and exclusive shard invariants
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, xml.etree.ElementTree as ET
          from pathlib import Path

          def load(stem):
              p = Path('output/final/%s.xml.gz' % stem)
              root = ET.fromstring(gzip.decompress(p.read_bytes()))
              ids = [(c.get('id') or '').strip() for c in root.findall('channel')]
              assert all(ids), '%s: empty channel id' % stem
              assert len(ids) == len(set(ids)), '%s: duplicate channel ids' % stem
              events = root.findall('programme')
              keys = []
              for e in events:
                  key = ((e.get('channel') or '').strip(),
                         (e.get('start') or '').strip(),
                         (e.get('stop') or '').strip())
                  assert key[0] and key[1], '%s: invalid programme key' % stem
                  keys.append(key)
              assert len(keys) == len(set(keys)), '%s: duplicate programme slots' % stem
              assert set(e.get('channel') for e in events).issubset(set(ids)), '%s: orphan programme' % stem
              return set(ids), len(events)

          combined_ids, combined_events = load('mena-arabic')
          main_manifest = json.loads(Path('output/final/manifest.json').read_text(encoding='utf-8'))
          shard_manifest = json.loads(Path('output/final/shards.json').read_text(encoding='utf-8'))
          assert main_manifest['window_hours'] == 48
          assert combined_events >= 100
          seen = set()
          for stem, expected in shard_manifest['shards'].items():
              ids, events = load(stem)
              assert len(ids) == expected['channels'], (stem, len(ids), expected['channels'])
              assert events == expected['programmes'], (stem, events, expected['programmes'])
              assert not (seen & ids), 'exclusive shard overlap: %s' % stem
              seen.update(ids)
          assert len(seen) == shard_manifest['published_channels']
          assert len(combined_ids) == shard_manifest['input_channels']
          assert len(seen) + shard_manifest['excluded_morocco_channels'] == len(combined_ids)
          assert shard_manifest['other_channels'] == shard_manifest['shards']['mena-other']['channels']
          print('PASS: combined=%d/%d exclusive_shards=%d MoroccoExcluded=%d Other=%d' % (
              len(combined_ids), combined_events, len(seen),
              shard_manifest['excluded_morocco_channels'], shard_manifest['other_channels']))
          PY

      - name: Publish atomically to mena-data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          cp ../output/final/*.xml.gz .
          cp ../output/final/*.txt .
          cp ../output/final/manifest.json .
          cp ../output/final/shards.json .
          cp ../output/catalog.json catalog.json
          cp ../output/merge-report.json merge-report.json
          printf '%s\n' \
            'EPGManager MENA Cloud data branch. TV-only rolling 48-hour guide. Receiver sources are split exclusively by premium/provider group first, then by conservatively detected country, then MENA Other. Ambiguous EPGShare country suffixes are never trusted. Morocco stays on its dedicated Morocco Cloud. Legacy mena-arabic/mena/premium files remain for compatibility.' \
            > README.md
          git add *.xml.gz *.txt manifest.json shards.json catalog.json merge-report.json README.md
          if git diff --cached --quiet; then
            echo "No MENA data changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "MENA Cloud safe country/provider shards ${stamp}"
          git push origin mena-data
