name: Fix retired MENA Other bootstrap

on:
  push:
    paths:
      - ".github/workflows/fix-mena-other-bein-routing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch legacy bootstrap handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/canonical_publish_finalize.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    base = Path(args.dir)\n    script_dir = Path(__file__).resolve().parent\n\n    if not args.skip_normalizers:\n'''
          replacement = '''    base = Path(args.dir)\n    script_dir = Path(__file__).resolve().parent\n\n    # The retained pre-normalization snapshot can still contain the historical\n    # receiver-facing MENA Other shard.  After MENA Other retirement, canonical\n    # beIN aliases inside that old shard intentionally collide with provider-bein.\n    # Drop only that historical bootstrap surface; the alias tables themselves\n    # still preserve exact raw -> canonical continuity.  Normal production output\n    # is never silently altered here and remains protected by receiver_release_gate.\n    if base.name == "bootstrap" and base.parent.name == "previous":\n        for suffix in ("xml.gz", "txt"):\n            stale = base / ("mena-other." + suffix)\n            if stale.exists():\n                stale.unlink()\n        stale_manifest = base / "shards.json"\n        if stale_manifest.exists():\n            payload = load_json(stale_manifest, {})\n            rows = payload.get("shards") or {}\n            if "mena-other" in rows:\n                rows.pop("mena-other", None)\n                payload["shards"] = rows\n                payload["other_receiver_published"] = False\n                stale_manifest.write_text(\n                    json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",\n                    encoding="utf-8",\n                )\n                print("Legacy bootstrap: retired historical mena-other shard before canonical replay")\n\n    if not args.skip_normalizers:\n'''
          if needle not in text:
              raise SystemExit('canonical bootstrap insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Validate bootstrap patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/canonical_publish_finalize.py
          grep -q "Legacy bootstrap: retired historical mena-other shard" tools/canonical_publish_finalize.py
          echo "LEGACY_BOOTSTRAP_RETIREMENT PASS"

      - name: Commit and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Routing Fix"
          git config user.email "actions@users.noreply.github.com"
          git add tools/canonical_publish_finalize.py
          git commit -m "Ignore retired MENA Other during legacy alias bootstrap"
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mena-epg.yml/dispatches" \
            -d '{"ref":"main"}'
