name: Apply Premium International packet

on:
  push:
    paths:
      - ".github/workflows/fix-mena-other-bein-routing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/patches/add_premium_international_packet.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/mena_cloud_shards.py tools/mena_cloud_shards_safe.py tools/canonical_publish_finalize.py tools/receiver_release_gate.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import mena_cloud_shards as base
          import mena_cloud_shards_safe as safe
          import receiver_release_gate as gate
          assert len(base.PREMIUM_INTERNATIONAL_IDS) == 11
          assert base.PREMIUM_INTERNATIONAL_IDS == gate.PREMIUM_INTERNATIONAL
          assert any(row[2] == 'provider-international' for row in base.PROVIDER_SHARDS)
          for cid in base.PREMIUM_INTERNATIONAL_IDS:
              assert base.provider_group(cid, cid, {}) == 'international'
              assert safe.safe_provider_group(cid, cid, {}) == 'international'
          print('PREMIUM_INTERNATIONAL_PACKET PASS ids=11')
          PY

      - name: Commit and dispatch MENA rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Routing Fix"
          git config user.email "actions@users.noreply.github.com"
          git add tools/mena_cloud_shards.py tools/mena_cloud_shards_safe.py tools/canonical_publish_finalize.py tools/receiver_release_gate.py
          git commit -m "Publish verified Premium International packet without MENA Other"
          git push origin HEAD:main
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mena-epg.yml/dispatches" -d '{"ref":"main"}'
