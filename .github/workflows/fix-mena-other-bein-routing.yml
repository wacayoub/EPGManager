name: Add Premium International packet

on:
  push:
    paths:
      - ".github/workflows/fix-mena-other-bein-routing.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route verified international MENA channels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'needle not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          intl_ids = '''PREMIUM_INTERNATIONAL_IDS = {
    "AnimalPlanetEurope.uk@SD",
    "DiscoveryChannelMiddleEastAfrica.us@SD",
    "InvestigationDiscovery.uk@SD",
    "HistoryMiddleEast.us@SD",
    "History2MiddleEast.us@SD",
    "TLCArabia.us@SD",
    "CartoonNetworkMENA.uk@SD",
    "NickelodeonArabia.ae@SD",
    "NickJrArabia.ae@SD",
    "NicktoonsArabia.ae@SD",
    "CartoonNetworkArabic.ae@SD",
}

'''

          p = 'tools/mena_cloud_shards.py'
          replace(
              p,
              '    ("starz", "STARZPLAY", "provider-starz"),\n]\n',
              '    ("starz", "STARZPLAY", "provider-starz"),\n    ("international", "Premium International", "provider-international"),\n]\n'
          )
          replace(
              p,
              '# Receiver-facing Rotana identities frozen after the provider audit. Alternate\n',
              intl_ids + '# Receiver-facing Rotana identities frozen after the provider audit. Alternate\n'
          )
          replace(
              p,
              'def provider_group(cid: str, name: str, meta: dict):\n    p = probe(cid, name, meta)\n',
              'def provider_group(cid: str, name: str, meta: dict):\n    if cid in PREMIUM_INTERNATIONAL_IDS:\n        return "international"\n    p = probe(cid, name, meta)\n'
          )

          p = 'tools/mena_cloud_shards_safe.py'
          replace(
              p,
              'def safe_provider_group(cid, name, meta):\n    p = identity_probe(cid, name, meta)\n',
              'def safe_provider_group(cid, name, meta):\n    if cid in base.PREMIUM_INTERNATIONAL_IDS:\n        return "international"\n    p = identity_probe(cid, name, meta)\n'
          )

          p = 'tools/canonical_publish_finalize.py'
          replace(
              p,
              '    "starz": "provider-starz",\n}\n',
              '    "starz": "provider-starz",\n    "international": "provider-international",\n}\n'
          )

          p = 'tools/receiver_release_gate.py'
          release_ids = '''PREMIUM_INTERNATIONAL = {
    "AnimalPlanetEurope.uk@SD",
    "DiscoveryChannelMiddleEastAfrica.us@SD",
    "InvestigationDiscovery.uk@SD",
    "HistoryMiddleEast.us@SD",
    "History2MiddleEast.us@SD",
    "TLCArabia.us@SD",
    "CartoonNetworkMENA.uk@SD",
    "NickelodeonArabia.ae@SD",
    "NickJrArabia.ae@SD",
    "NicktoonsArabia.ae@SD",
    "CartoonNetworkArabic.ae@SD",
}
'''
          replace(
              p,
              'PROVIDERS = {\n',
              release_ids + 'PROVIDERS = {\n'
          )
          replace(
              p,
              '    required_files = {"mena-arabic", "mena", "premium"} | set(PROVIDERS)\n',
              '    required_files = {"mena-arabic", "mena", "premium", "provider-international"} | set(PROVIDERS)\n'
          )
          anchor = '''    for stem, (prefix, required, optional) in PROVIDERS.items():
        if stem not in profiles:
            continue
        actual = profiles[stem]["ids"]
        missing = required - actual
        extra = actual - required - optional
        if missing:
            errors.append("%s: MISSING_CORE_IDS=%s" % (stem, sorted(missing)))
        if extra:
            errors.append("%s: UNREVIEWED_IDS=%s" % (stem, sorted(extra)))
        if any(not cid.startswith(prefix) for cid in actual):
            errors.append("%s: NAMESPACE_MISMATCH" % stem)

'''
          replacement = anchor + '''    if "provider-international" in profiles:
        actual = profiles["provider-international"]["ids"]
        missing = PREMIUM_INTERNATIONAL - actual
        extra = actual - PREMIUM_INTERNATIONAL
        if missing:
            errors.append("provider-international: MISSING_CORE_IDS=%s" % sorted(missing))
        if extra:
            errors.append("provider-international: UNREVIEWED_IDS=%s" % sorted(extra))

'''
          replace(p, anchor, replacement)
          PY

      - name: Validate packet routing
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_shards.py \
            tools/mena_cloud_shards_safe.py \
            tools/canonical_publish_finalize.py \
            tools/receiver_release_gate.py
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import mena_cloud_shards as base
          import mena_cloud_shards_safe as safe
          import receiver_release_gate as gate

          assert len(base.PREMIUM_INTERNATIONAL_IDS) == 11
          assert base.PREMIUM_INTERNATIONAL_IDS == gate.PREMIUM_INTERNATIONAL
          assert any(row[2] == 'provider-international' for row in base.PROVIDER_SHARDS)
          for cid in base.PREMIUM_INTERNATIONAL_IDS:
              assert base.provider_group(cid, cid, {}) == 'international', cid
              assert safe.safe_provider_group(cid, cid, {}) == 'international', cid
          print('PREMIUM_INTERNATIONAL_PACKET PASS ids=11')
          PY

      - name: Commit and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Routing Fix"
          git config user.email "actions@users.noreply.github.com"
          git add tools/mena_cloud_shards.py tools/mena_cloud_shards_safe.py tools/canonical_publish_finalize.py tools/receiver_release_gate.py
          git commit -m "Publish verified Premium International packet without MENA Other"
          git push origin HEAD:main
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mena-epg.yml/dispatches" \
            -d '{"ref":"main"}'
