name: MENA Merge A-B Shadow Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ab-merge-shadow.yml"
      - "tools/mena_cloud_merge_metadata_locked.py"
      - "tools/compare_all_id_reports.py"

permissions:
  contents: write

concurrency:
  group: mena-merge-ab-shadow
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout EPGManager
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: current-data
          fetch-depth: 0

      - name: Checkout iptv-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/epg
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/epg/package-lock.json

      - name: Verify scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_catalog.py \
            tools/mena_cloud_merge_arabic_first.py \
            tools/mena_cloud_merge_metadata_locked.py \
            tools/mena_cloud_finalize_strict.py \
            tools/mena_cloud_shards_strict.py \
            tools/all_id_audit.py \
            tools/compare_all_id_reports.py

      - name: Install grabber
        working-directory: vendor/epg
        run: npm ci --no-audit --no-fund

      - name: Prepare identical inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ab/input ab/cache ab/baseline/final ab/candidate/final previous
          cp current-data/mena-arabic.xml.gz previous/mena-arabic.xml.gz || true
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/epg \
            --output-channels ab/input/mena.channels.xml \
            --output-manifest ab/input/catalog.json
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 30 \
            https://iptv-org.github.io/api/channels.json -o ab/input/channels.json || echo '[]' > ab/input/channels.json

      - name: Grab one shared primary snapshot - 48h
        working-directory: vendor/epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/ab/input/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/ab/input/raw.xml" \
              --days=2 --maxConnections=3 --timeout=20000
          test -s "${GITHUB_WORKSPACE}/ab/input/raw.xml" || printf '%s\n' '<?xml version="1.0"?><tv></tv>' > "${GITHUB_WORKSPACE}/ab/input/raw.xml"
          exit 0

      - name: Baseline merge - current production logic - populate shared cache
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge_arabic_first.py \
            --primary ab/input/raw.xml \
            --catalog-manifest ab/input/catalog.json \
            --output ab/baseline/merged.xml \
            --report ab/baseline/merge-report.json \
            --cache-dir ab/cache \
            --window-hours 48

      - name: Candidate merge - identical inputs and remote cache
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge_metadata_locked.py \
            --primary ab/input/raw.xml \
            --catalog-manifest ab/input/catalog.json \
            --output ab/candidate/merged.xml \
            --report ab/candidate/merge-report.json \
            --cache-dir ab/cache \
            --window-hours 48 \
            --no-network

      - name: Finalize baseline and candidate with identical LKG
        shell: bash
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            python tools/mena_cloud_finalize_strict.py \
              --candidate ab/${side}/merged.xml \
              --catalog-manifest ab/input/catalog.json \
              --previous previous/mena-arabic.xml.gz \
              --merge-report ab/${side}/merge-report.json \
              --window-hours 48 \
              --output-dir ab/${side}/final
            python tools/mena_cloud_shards_strict.py \
              --source-cache-dir ab/cache \
              --channel-metadata ab/input/channels.json \
              --input ab/${side}/final/mena-arabic.xml.gz \
              --catalog-manifest ab/input/catalog.json \
              --output-dir ab/${side}/final \
              --manifest ab/${side}/final/shards.json
          done

      - name: Exhaustive All-ID audit on both sides
        shell: bash
        run: |
          set -euo pipefail
          for side in baseline candidate; do
            python tools/all_id_audit.py \
              --dir ab/${side}/final \
              --manifest ab/${side}/final/shards.json \
              --json ab/${side}/all-id.json \
              --text ab/${side}/all-id.txt \
              --csv ab/${side}/all-id.csv
          done

      - name: Per-ID A-B comparison
        shell: bash
        run: |
          set -euo pipefail
          python tools/compare_all_id_reports.py \
            --before ab/baseline/all-id.json \
            --after ab/candidate/all-id.json \
            --json ab/ab-compare.json \
            --text ab/ab-compare.txt
          cat ab/ab-compare.txt

      - name: Publish diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../ab/ab-compare.json mena-merge-ab-compare.json
          cp ../ab/ab-compare.txt mena-merge-ab-compare.txt
          cp ../ab/baseline/all-id.json mena-merge-ab-baseline-all-id.json
          cp ../ab/baseline/all-id.txt mena-merge-ab-baseline-all-id.txt
          cp ../ab/candidate/all-id.json mena-merge-ab-candidate-all-id.json
          cp ../ab/candidate/all-id.txt mena-merge-ab-candidate-all-id.txt
          git config user.name "EPGManager A-B Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add mena-merge-ab-*.json mena-merge-ab-*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compare production and primary-locked merge on identical inputs"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data

      - name: Acceptance gate - zero hard failures and zero verdict regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cand=json.loads(Path('ab/candidate/all-id.json').read_text(encoding='utf-8'))
          cmp=json.loads(Path('ab/ab-compare.json').read_text(encoding='utf-8'))
          s=cand['summary']
          print('CANDIDATE:', s)
          print('REGRESSIONS:', len(cmp.get('regressed', [])))
          assert s['FAIL'] == 0, s
          assert not cmp.get('regressed'), cmp.get('regressed')
          PY
