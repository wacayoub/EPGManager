name: Arryadia HD candidate collision/time-zone safety
on:
  push:
    branches:
      - feat/arryadia-fixture-advisory-safety-20261017
    paths:
      - tools/arryadia_fixture_candidates.py
      - tests/test_arryadia_fixture_candidates.py
      - .github/workflows/morocco-epg.yml
      - .github/workflows/arryadia-fixture-advisory-test.yml
  pull_request:
    paths:
      - tools/arryadia_fixture_candidates.py
      - tests/test_arryadia_fixture_candidates.py
      - .github/workflows/morocco-epg.yml
      - .github/workflows/arryadia-fixture-advisory-test.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Verify conflict quarantine, time zone quarantine, archive rejection
        run: PYTHONPATH=tools python -m unittest discover -s tests -p test_arryadia_fixture_candidates.py -v
      - name: Probe HD sources and ensure no generated XMLTV programme
        run: |
          python tools/arryadia_fixture_candidates.py --output /tmp/arryadia_fixture_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/arryadia_fixture_candidates.json").read_text())
          assert x["never_publish_directly"] is True
          assert x["source_clock_timezone"]=="UNVERIFIED"
          assert all(y["may_publish"] is False and y["site_timezone"]=="UNVERIFIED" for y in x["candidates"])
          assert set(x["channel_ids_probed"])=={"Arryadia_HD1","Arryadia_HD2","Arryadia_HD3"}
          print("ARR_FIXTURES_CAUTION_GATE: PASS",x["candidate_count"],x["collision_count"])
          PY
