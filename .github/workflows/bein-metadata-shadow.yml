name: beIN Provider Repair Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bein-metadata-shadow.yml"
      - "tools/bein_provider_repair.py"
      - "tools/mena_cloud_shards_strict.py"
      - "tools/bein_id_audit_policy.py"
      - "tools/bein_id_audit.py"
      - "tools/all_id_audit_alias_aware.py"
      - "tools/all_id_audit.py"

permissions:
  contents: read

concurrency:
  group: bein-provider-repair-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current production MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/bein_provider_repair.py \
            tools/mena_cloud_shards.py \
            tools/mena_cloud_shards_safe.py \
            tools/mena_cloud_shards_strict.py \
            tools/bein_id_audit.py \
            tools/bein_id_audit_policy.py \
            tools/all_id_audit.py \
            tools/all_id_audit_alias_aware.py

      - name: Audit current production beIN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shadow/before shadow/rebuilt shadow/audit
          cp data/shards.json shadow/before/shards.json
          python tools/bein_id_audit_policy.py \
            --xml data/provider-bein.xml.gz \
            --json shadow/before/bein-id-audit.json \
            --text shadow/before/bein-id-audit.txt

      - name: Rebuild shards from current combined production in shadow
        shell: bash
        run: |
          set -euo pipefail
          python tools/mena_cloud_shards_strict.py \
            --input data/mena-arabic.xml.gz \
            --catalog-manifest data/catalog.json \
            --output-dir shadow/rebuilt \
            --manifest shadow/rebuilt/shards.json

      - name: Audit repaired beIN
        shell: bash
        run: |
          set -euo pipefail
          python tools/bein_id_audit_policy.py \
            --xml shadow/rebuilt/provider-bein.xml.gz \
            --json shadow/rebuilt/bein-id-audit.json \
            --text shadow/rebuilt/bein-id-audit.txt

      - name: Alias-aware all-ID regression audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/all_id_audit_alias_aware.py \
            --dir shadow/rebuilt \
            --manifest shadow/rebuilt/shards.json \
            --json shadow/audit/all-id-audit.json \
            --text shadow/audit/all-id-audit.txt \
            --csv shadow/audit/all-id-audit.csv

      - name: Verify beIN correction gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, re, xml.etree.ElementTree as ET
          from pathlib import Path

          before = json.loads(Path('shadow/before/bein-id-audit.json').read_text(encoding='utf-8'))
          after = json.loads(Path('shadow/rebuilt/bein-id-audit.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('shadow/rebuilt/shards.json').read_text(encoding='utf-8'))
          allid = json.loads(Path('shadow/audit/all-id-audit.json').read_text(encoding='utf-8'))

          rich_arabic_ids = {
              'بي إن موفيز أكشن.eg', 'بي إن موفيز بريمير.eg',
              'بي إن موفيز دراما.eg', 'بي إن موفيز فاميلي.eg',
              'بي إن سيريس.eg', 'بي إن سيريس إتش دي 2.eg',
          }
          before_ids = {x['id'] for x in before['channels']}
          after_ids = {x['id'] for x in after['channels']}
          assert not (rich_arabic_ids & before_ids), rich_arabic_ids & before_ids
          assert rich_arabic_ids <= after_ids, sorted(rich_arabic_ids - after_ids)
          assert after['summary']['channels'] == 45, after['summary']
          assert int(after['summary']['counts'].get('FAIL', 0)) == 0, after['summary']
          assert int(allid['summary'].get('FAIL', 0)) == 0, allid['summary']
          assert int(allid['summary'].get('NO_EPG', 0)) == 0, allid['summary']

          shard = manifest['shards']['provider-bein']
          assert shard['channels'] == 45, shard
          assert len(shard.get('compat_aliases') or {}) >= 13, shard.get('compat_aliases')
          assert not {'bein SPORTS FTA DIGITAL.qa', 'beIN SPORTS-boxoffice-bein.com.qa'} & set(shard.get('non_recommended_ids') or [])
          repair = shard.get('repair') or {}
          assert repair.get('arabic_desc_fills', 0) >= 120, repair
          assert repair.get('long_event_repairs', 0) == 2, repair
          assert repair.get('generic_xtra_removed', 0) == 10, repair

          raw = gzip.decompress(Path('shadow/rebuilt/provider-bein.xml.gz').read_bytes())
          root = ET.fromstring(raw)
          events = root.findall('programme')
          titles = [next(((x.text or '').strip() for x in p.findall('title') if (x.text or '').strip()), '') for p in events]
          xtra = [p for p in events if (p.get('channel') or '') == 'beINSPORTSXTRA3.qa']
          assert len(xtra) == 3, len(xtra)
          assert not any('For Live And Exclusive Coverage of Premium Sporting Events' in t for t in titles)
          assert not any(re.search(r'\brpool\b', t, re.I) for t in titles)
          assert not any(re.match(r'^\s*Live\s*:\s*Liverpool\s+v(?:s)?\s+Fulham\b', t, re.I) for t in titles)
          assert any(re.match(r'^\s*Live\s*:\s*Liverpool\s+v(?:s)?\s+Tottenham\b', t, re.I) for t in titles), 'genuine Liverpool-Tottenham Live marker was lost'

          by_id = {x['id']: x for x in after['channels']}
          for cid in ['BEIN MOVIES FAMILY.eg', 'BeIn Series HD 1.eg', 'beIN Series HD 2.eg']:
              assert by_id[cid]['empty_desc'] == 0, (cid, by_id[cid]['empty_desc'])
          for cid in rich_arabic_ids:
              assert by_id[cid]['verdict'] == 'ALIAS_OK', (cid, by_id[cid]['verdict'])

          comparison = {
              'before': before['summary'],
              'after': after['summary'],
              'all_id': allid['summary'],
              'provider_bein_manifest': {
                  'channels': shard['channels'], 'programmes': shard['programmes'],
                  'compat_aliases': len(shard.get('compat_aliases') or {}),
                  'repair': repair,
              },
              'regression_gate': 'PASS',
          }
          Path('shadow/comparison.json').write_text(json.dumps(comparison, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(comparison, ensure_ascii=False, indent=2))
          PY

      - name: Upload beIN shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: bein-provider-repair-shadow
          path: shadow/
          if-no-files-found: error
