name: Refresh MENA Source ID Master

on:
  push:
    paths:
      - ".github/workflows/refresh-mena-source-id-master.yml"
      - "tools/enrich_mena_source_id_master.py"
      - "tools/render_mena_source_id_master_md.py"
      - "data/receiver-sat-index.json.gz.b64"
      - "data/receiver-sat-display-names.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mena-source-id-master-v2
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download published MENA feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/mena-arabic.xml.gz" \
            -o /tmp/mena-arabic.xml.gz

      - name: Download direct winner source feeds
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/separate-sources.json" \
            -o /tmp/separate-sources.json || printf '%s\n' '{"sources":[]}' > /tmp/separate-sources.json
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-zero-epg.json" \
            -o /tmp/source-zero-epg.json || printf '%s\n' '{"rows":[]}' > /tmp/source-zero-epg.json
          for key in osn elcinema bein; do
            curl -fL --retry 3 --retry-delay 1 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-${key}.xml.gz" \
              -o "/tmp/source-${key}.xml.gz" || rm -f "/tmp/source-${key}.xml.gz"
          done

      - name: Download Morocco Cloud monitoring inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/epg-data/morocco.txt" \
            -o /tmp/morocco.txt
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/epg-data/morocco.xml.gz" \
            -o /tmp/morocco.xml.gz

      - name: Download Sport24 monitoring inputs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-sport24.txt" \
            -o /tmp/source-sport24.txt
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-sport24.xml.gz" \
            -o /tmp/source-sport24.xml.gz

      - name: Decode receiver lamedb SAT index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          src = Path("data/receiver-sat-index.json.gz.b64")
          raw = gzip.decompress(base64.b64decode(src.read_text(encoding="utf-8").strip()))
          data = json.loads(raw.decode("utf-8"))
          assert data.get("source") == "Vu+ receiver scan lamedb5", data.get("source")
          counts = data.get("counts") or {}
          assert counts.get("7W") == 810
          assert counts.get("8W") == 296
          assert counts.get("25.5E") == 61
          assert counts.get("26E") == 677
          Path("/tmp/receiver-sat-index.json").write_bytes(raw)
          print("LAMEDB_SAT_INDEX PASS", counts, "channels=", len(data.get("channels") or {}))
          PY

      - name: Enrich master with current real EPG
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --master docs/mena-source-id-master.csv
            --xml /tmp/mena-arabic.xml.gz
          )
          [ -s /tmp/source-osn.xml.gz ] && args+=(--source-feed "osn.com=/tmp/source-osn.xml.gz")
          [ -s /tmp/source-elcinema.xml.gz ] && args+=(--source-feed "elcinema.com=/tmp/source-elcinema.xml.gz")
          if [ -s /tmp/source-bein.xml.gz ]; then
            args+=(--source-feed "bein.com=/tmp/source-bein.xml.gz")
            args+=(--source-feed "beinsports.com=/tmp/source-bein.xml.gz")
          fi
          python tools/enrich_mena_source_id_master.py "${args[@]}"

      - name: Render Markdown monitoring page
        shell: bash
        run: |
          set -euo pipefail
          python tools/render_mena_source_id_master_md.py \
            --csv docs/mena-source-id-master.csv \
            --md docs/mena-source-id-master.md \
            --duplicates-md docs/mena-source-id-duplicates.md \
            --zero-epg-md docs/mena-source-zero-epg.md \
            --zero-epg-report /tmp/source-zero-epg.json \
            --morocco-list /tmp/morocco.txt \
            --morocco-xml /tmp/morocco.xml.gz \
            --sport24-list /tmp/source-sport24.txt \
            --sport24-xml /tmp/source-sport24.xml.gz \
            --sat-index /tmp/receiver-sat-index.json \
            --sat-names data/receiver-sat-display-names.json \
            --source-registry /tmp/separate-sources.json

      - name: Verify required live columns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("docs/mena-source-id-master.csv")
          with p.open("r",encoding="utf-8-sig",newline="") as f:
              r=csv.DictReader(f)
              need={"receiver_canonical_id","now_status","now_title","now_desc","epg_snapshot_utc"}
              missing=need-set(r.fieldnames or [])
              assert not missing, missing
              rows=list(r)
          assert rows, "empty master"
          print("MASTER_LIVE_COLUMNS PASS rows=",len(rows),"now=",sum(1 for x in rows if x.get("now_status")=="NOW"))
          PY

      - name: Commit refreshed master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add docs/mena-source-id-master.csv docs/mena-source-id-master.md docs/mena-source-id-duplicates.md docs/mena-source-zero-epg.md
          if git diff --cached --quiet; then
            echo "No master changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "Refresh MENA source ID live EPG ${stamp}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retry ${attempt}/4"
            sleep 2
          done
          echo "Unable to push refreshed monitoring after retries" >&2
          exit 1
