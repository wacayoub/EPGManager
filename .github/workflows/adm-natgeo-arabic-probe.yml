name: ADM NatGeo Arabic Source Probe

on:
  push:
    paths:
      - ".github/workflows/adm-natgeo-arabic-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe NatGeo Abu Dhabi Arabic donors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, io, re, urllib.request, xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime, timezone

          SOURCES = [
              ("openepg-uae6", "https://www.open-epg.com/files/uae6.xml.gz"),
              ("epgshare-ae1", "https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz"),
              ("epgshare-sa2", "https://epgshare01.online/epgshare01/epg_ripper_SA2.xml.gz"),
              ("openepg-saudi1", "https://www.open-epg.com/files/saudiarabia1.xml.gz"),
              ("openepg-saudi2", "https://www.open-epg.com/files/saudiarabia2.xml.gz"),
              ("openepg-saudi3", "https://www.open-epg.com/files/saudiarabia3.xml.gz"),
              ("openepg-saudi4", "https://www.open-epg.com/files/saudiarabia4.xml.gz"),
              ("openepg-saudi5", "https://www.open-epg.com/files/saudiarabia5.xml.gz"),
              ("openepg-saudi6", "https://www.open-epg.com/files/saudiarabia6.xml.gz"),
              ("openepg-qatar1", "https://www.open-epg.com/files/qatar1.xml.gz"),
              ("openepg-qatar2", "https://www.open-epg.com/files/qatar2.xml.gz"),
              ("openepg-qatar3", "https://www.open-epg.com/files/qatar3.xml.gz"),
              ("openepg-qatar4", "https://www.open-epg.com/files/qatar4.xml.gz"),
              ("openepg-qatar5", "https://www.open-epg.com/files/qatar5.xml.gz"),
              ("openepg-qatar6", "https://www.open-epg.com/files/qatar6.xml.gz"),
              ("al7omed-unified", "https://raw.githubusercontent.com/al7omed/iptv-epg-all/main/docs/guide.xml.gz"),
          ]
          AR = re.compile(r"[\u0600-\u06ff]")
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent":"EPGManager-NatGeo-Probe/1.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
              if data[:2] == b"\x1f\x8b":
                  data = gzip.decompress(data)
              return ET.fromstring(data)
          def norm(s):
              s=(s or '').casefold()
              s=re.sub(r'[^a-z0-9\u0600-\u06ff]+',' ',s)
              return ' '.join(s.split())
          def is_target(cid,name):
              p=norm((cid or '')+' '+(name or ''))
              compact=p.replace(' ','')
              return any(x in p for x in ['national geographic abu dhabi','nat geo abu dhabi','ناشيونال جيوغرافيك أبوظبي','ناشيونال جيوغرافيك ابوظبي']) or 'nationalgeographicabudhabi' in compact or 'natgeoabudhabi' in compact
          def txt(p, tag):
              vals=[(n.text or '').strip() for n in p.findall(tag) if (n.text or '').strip()]
              return vals[0] if vals else ''
          def dt(raw):
              m=re.match(r'^(\d{12}|\d{14})', (raw or '').strip())
              if not m:return None
              s=m.group(1); fmt='%Y%m%d%H%M%S' if len(s)==14 else '%Y%m%d%H%M'
              try:return datetime.strptime(s,fmt).replace(tzinfo=timezone.utc)
              except:return None
          winners=[]
          for label,url in SOURCES:
              try:
                  root=get(url)
              except Exception as e:
                  print(f'SOURCE {label}: ERROR {e}')
                  continue
              names={}
              for ch in root.findall('channel'):
                  cid=(ch.get('id') or '').strip()
                  dns=[(x.text or '').strip() for x in ch.findall('display-name') if (x.text or '').strip()]
                  name=dns[0] if dns else cid
                  if is_target(cid,name): names[cid]=name
              ev=defaultdict(list)
              for p in root.findall('programme'):
                  cid=(p.get('channel') or '').strip()
                  if cid in names: ev[cid].append(p)
              if not names:
                  print(f'SOURCE {label}: NO_TARGET')
                  continue
              for cid,name in names.items():
                  rows=ev.get(cid,[])
                  titles=[txt(p,'title') for p in rows]
                  descs=[txt(p,'desc') for p in rows]
                  tr=sum(bool(AR.search(x)) for x in titles)/float(len(titles) or 1)
                  populated=[x for x in descs if x]
                  dr=sum(bool(AR.search(x)) for x in populated)/float(len(populated) or 1)
                  empty=sum(not bool(x) for x in descs)
                  starts=[dt(p.get('start')) for p in rows]; stops=[dt(p.get('stop')) for p in rows]
                  starts=[x for x in starts if x]; stops=[x for x in stops if x]
                  span=((max(stops)-min(starts)).total_seconds()/3600.0) if starts and stops else 0
                  freeze=(len(rows)>=10 and span>=24 and tr>=0.80 and dr>=0.80 and empty <= max(1,int(len(rows)*0.20)))
                  print(f'\nSOURCE={label} ID={cid} NAME={name}')
                  print(f'events={len(rows)} span={span:.1f}h title_AR={tr*100:.0f}% desc_AR={dr*100:.0f}% empty_desc={empty} FREEZE={"YES" if freeze else "NO"}')
                  for p in rows[:4]:
                      print('  TITLE:', txt(p,'title')[:160])
                      print('  DESC :', txt(p,'desc')[:240])
                  if freeze:
                      winners.append((label,cid,len(rows),span,tr,dr))
          print('\n=== NATGEO ARABIC DONOR WINNERS ===')
          if not winners:
              print('NONE')
          else:
              winners.sort(key=lambda x:(x[5],x[4],x[3],x[2]), reverse=True)
              for w in winners: print(w)
              print('BEST=', winners[0][0], winners[0][1])
          PY

      - name: Probe official ADM Arabic page for schedule hooks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          urls=[
            'https://www.admn.ae/ar/brand/4197604/national-geographic-abu-dhabi',
            'https://www.admn.ae/en/brand/4197604/national-geographic-abu-dhabi',
          ]
          for u in urls:
            print('\nOFFICIAL',u)
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
            except Exception as e:
              print('ERROR',e); continue
            print('bytes=',len(html),'arabic_chars=',len(re.findall(r'[\u0600-\u06ff]',html)))
            for pat in [r'https?://[^\"\']+', r'[^\"\']*(?:schedule|program|epg|guide|brand)[^\"\']*']:
              vals=[]
              for m in re.findall(pat,html,re.I):
                if any(k in m.casefold() for k in ['schedule','program','epg','guide','brand']):
                  vals.append(m[:300])
              for v in list(dict.fromkeys(vals))[:30]: print('HOOK',v)
          PY
