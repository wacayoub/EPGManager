name: EPG 48h - Dubai Plus

on:
  # One fixed GMT+0 daily scrape, independent of Morocco DST/Ramadan.
  schedule:
    - cron: "44 4 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: dubaiplus
      scheduled: false
    secrets: inherit
