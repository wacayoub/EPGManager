name: EPG 48h - Sport24

on:
  # Sole automatic Sport24 scrape, Morocco civil local time.
  schedule:
    - cron: "5 3 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: sport24
      scheduled: false
    secrets: inherit
