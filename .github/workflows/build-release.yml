name: Build and Publish EPGManager

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes
        required: false
        default: Automatic EPG Manager release

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore current source package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$(tr -d '\r\n' < source/current.txt)"
          test -n "$SOURCE_FILE"
          test -f "source/$SOURCE_FILE"
          rm -rf buildsrc
          mkdir -p buildsrc
          python3 -c "import base64,pathlib,re; p=pathlib.Path('source/$SOURCE_FILE'); raw=p.read_bytes(); clean=re.sub(rb'[^A-Za-z0-9+/=]',b'',raw); pathlib.Path('/tmp/epgmanager-source.zip').write_bytes(base64.b64decode(clean, validate=False))"
          unzip -tq /tmp/epgmanager-source.zip
          unzip -q /tmp/epgmanager-source.zip -d buildsrc
          test -f buildsrc/installer/build_ipk.sh
          test -f buildsrc/version.py

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import re,pathlib; s=pathlib.Path('buildsrc/version.py').read_text(encoding='utf-8'); m=re.search(r'__version__\\s*=\\s*[\\\"\\\']([^\\\"\\\']+)',s); print(m.group(1) if m else '')")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPK=enigma2-plugin-extensions-epgmanager_${VERSION}_all.ipk" >> "$GITHUB_ENV"

      - name: Build IPK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc
          chmod +x installer/build_ipk.sh
          ./installer/build_ipk.sh
          test -f "$IPK"

      - name: Calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "buildsrc/$IPK" | awk '{print $1}')"
          SIZE="$(stat -c%s "buildsrc/$IPK")"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "buildsrc/$IPK" --clobber
          else
            gh release create "$TAG" "buildsrc/$IPK" --title "EPG Manager $VERSION" --notes "$NOTES"
          fi

      - name: Generate update.json
        shell: bash
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          python3 -c "import json,os,pathlib; v=os.environ['VERSION']; i=os.environ['IPK']; d={'version':v,'build':'github-actions','url':f'https://github.com/wacayoub/EPGManager/releases/download/v{v}/{i}','sha256':os.environ['SHA256'],'size':int(os.environ['SIZE']),'notes':os.environ.get('NOTES') or 'Automatic EPG Manager release'}; pathlib.Path('update.json').write_text(json.dumps(d,indent=2)+'\\n',encoding='utf-8')"

      - name: Commit update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest for v$VERSION"
            git push
          fi
