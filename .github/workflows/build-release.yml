name: Build and Publish EPGManager

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes
        required: false
        default: Automatic EPG Manager release
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore current source package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$(tr -d '\r\n' < source/current.txt)"
          test -n "$SOURCE_FILE"
          test -f "source/$SOURCE_FILE"
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -tq "source/$SOURCE_FILE"
          unzip -q "source/$SOURCE_FILE" -d buildsrc
          ROOT="$(find buildsrc -maxdepth 3 -type f -name version.py -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"
          test -f "$ROOT/installer/build_ipk.sh"
          test -f "$ROOT/version.py"
          if [ -d "source/overlay" ]; then
            cp -a source/overlay/. "$ROOT"/
          fi
          python3 -m py_compile "$ROOT/core/external_sources.py" "$ROOT/core/source_catalog.py" "$ROOT/ui/native_sources.py" "$ROOT/ui/settings.py" "$ROOT/ui/channel_mapping.py" "$ROOT/plugin.py" "$ROOT/version.py"

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import re,pathlib,os; s=pathlib.Path(os.environ['SOURCE_ROOT'],'version.py').read_text(encoding='utf-8'); m=re.search(r'__version__\\s*=\\s*[\"\x27]([^\"\x27]+)',s); print(m.group(1) if m else '')")"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPK=enigma2-plugin-extensions-epgmanager_${VERSION}_all.ipk" >> "$GITHUB_ENV"

          # The historical source archive has its package version embedded in
          # installer/build_ipk.sh. Keep the package control metadata and the
          # output filename aligned with overlay/version.py before snapshot/build.
          python3 - "$SOURCE_ROOT/installer/build_ipk.sh" "$VERSION" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'(?m)^((?:PKG_)?VERSION\s*=\s*)["\x27]?[^"\x27\s]+["\x27]?', lambda m: m.group(1) + '"' + version + '"', text)
          text = re.sub(r'enigma2-plugin-extensions-epgmanager_[0-9]+(?:\.[0-9A-Za-z_-]+)+_all\.ipk',
                        'enigma2-plugin-extensions-epgmanager_' + version + '_all.ipk', text)
          path.write_text(text, encoding="utf-8")
          PY

          # Update any static Debian/opkg control template bundled by older
          # source archives, without touching runtime Python migration data.
          while IFS= read -r -d '' ctl; do
            sed -Ei "s/^(Version:[[:space:]]*).*/\\1$VERSION/" "$ctl"
          done < <(find "$SOURCE_ROOT/installer" "$SOURCE_ROOT" -maxdepth 4 -type f \( -name control -o -name control.template -o -name '*.control' \) -print0 2>/dev/null | sort -zu)

      - name: Snapshot patched source
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_SOURCE="source/EPGManager_source_v${VERSION}.zip"
          ROOT_DIR="$(basename "$SOURCE_ROOT")"
          rm -f "$PATCHED_SOURCE"
          (cd buildsrc && zip -qr "../$PATCHED_SOURCE" "$ROOT_DIR" -x "*/__pycache__/*" "*.pyc" "*.pyo")
          printf '%s\n' "$(basename "$PATCHED_SOURCE")" > source/current.txt
          mkdir -p data/current-plugin-inspect
          cp "$SOURCE_ROOT/core/external_sources.py" data/current-plugin-inspect/external_sources.py
          cp "$SOURCE_ROOT/core/source_catalog.py" data/current-plugin-inspect/source_catalog.py
          cp "$SOURCE_ROOT/ui/native_sources.py" data/current-plugin-inspect/native_sources.py
          cp "$SOURCE_ROOT/ui/settings.py" data/current-plugin-inspect/settings.py
          cp "$SOURCE_ROOT/ui/channel_mapping.py" data/current-plugin-inspect/channel_mapping.py
          cp "$SOURCE_ROOT/plugin.py" data/current-plugin-inspect/plugin.py
          cp "$SOURCE_ROOT/version.py" data/current-plugin-inspect/version.py

          # Keep a small text-only inspection snapshot of Settings/menu code so
          # future receiver UI cleanup can be patched without unpacking binary
          # source archives outside Actions.
          rm -rf data/current-plugin-inspect/settings
          mkdir -p data/current-plugin-inspect/settings
          find "$SOURCE_ROOT" -maxdepth 4 -type f -name '*.py' -print0 |             xargs -0 grep -IlE 'Settings|setting|refresh|schedule|auto.?import|local.?source|Source.*Update' |             head -n 30 | while IFS= read -r f; do
              rel="${f#"$SOURCE_ROOT"/}"
              safe="$(printf '%s' "$rel" | tr '/' '__')"
              cp "$f" "data/current-plugin-inspect/settings/$safe"
            done
          grep -RniE 'local.?source|source.?refresh|refresh.?source|auto.?refresh|refresh.?interval|scheduled.?refresh|update.?source'             "$SOURCE_ROOT" --include='*.py' > data/current-plugin-inspect/settings_hits.txt || true

          echo "PATCHED_SOURCE=$PATCHED_SOURCE" >> "$GITHUB_ENV"

      - name: Build IPK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          chmod +x installer/build_ipk.sh
          ./installer/build_ipk.sh
          test -f "$IPK"

      - name: Calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$SOURCE_ROOT/$IPK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$SOURCE_ROOT/$IPK")"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SOURCE_ROOT/$IPK" --clobber
          else
            gh release create "$TAG" "$SOURCE_ROOT/$IPK" --title "EPG Manager $VERSION" --notes "$NOTES"
          fi

      - name: Generate update.json
        shell: bash
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          python3 -c "import json,os,pathlib; v=os.environ['VERSION']; i=os.environ['IPK']; d={'version':v,'build':'github-actions','url':f'https://github.com/wacayoub/EPGManager/releases/download/v{v}/{i}','sha256':os.environ['SHA256'],'size':int(os.environ['SIZE']),'notes':os.environ.get('NOTES') or 'Automatic EPG Manager release'}; pathlib.Path('update.json').write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')"

      - name: Commit update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json source/current.txt "$PATCHED_SOURCE" data/current-plugin-inspect
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest for v$VERSION"
            git push
          fi
