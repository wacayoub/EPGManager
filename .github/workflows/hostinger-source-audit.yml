name: Hostinger PHP Source Audit

on:
  push:
    branches:
      - hostinger-source-audit
    paths:
      - "hostinger/**"
      - ".github/workflows/hostinger-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, simplexml, xmlwriter, openssl, zlib
          coverage: none
      - name: PHP modules
        run: |
          php -v
          php -m
      - name: Run source audit
        id: audit
        continue-on-error: true
        run: |
          php hostinger/tests/source_audit.php | tee hostinger/tests/output/source-audit.txt
      - name: Print report
        if: always()
        run: |
          cat hostinger/tests/output/source-audit.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-source-audit
          path: hostinger/tests/output/
          retention-days: 3
      - name: Fail if probes failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
