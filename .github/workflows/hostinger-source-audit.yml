name: Hostinger PHP Source Audit

on:
  push:
    branches:
      - hostinger-source-audit
    paths:
      - "hostinger/**"
      - ".github/workflows/hostinger-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, simplexml, xmlwriter, openssl, zlib, mbstring
          coverage: none
      - name: Prepare output
        run: mkdir -p hostinger/tests/output
      - name: Network source audit
        run: |
          set -o pipefail
          php hostinger/tests/source_audit.php | tee hostinger/tests/output/source-audit.txt
        continue-on-error: true
      - name: Parser-level audit
        run: |
          set -o pipefail
          php hostinger/tests/parser_audit.php | tee hostinger/tests/output/parser-audit.txt
        continue-on-error: true
      - name: Edge probes
        run: |
          set -o pipefail
          php hostinger/tests/edge_probe.php | tee hostinger/tests/output/edge-probe.txt
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-source-audit
          path: hostinger/tests/output/
          retention-days: 3
