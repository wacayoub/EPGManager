name: SAT.TV DVB-I Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sattv-dvbi-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public SAT.TV DVB-I Algeria list
        shell: bash
        run: |
          set -euo pipefail
          u="https://sattv-csr.tv/dvb-i/api/serviceList/satTVAlgeria"
          curl -fL -sS --connect-timeout 5 --max-time 12 "$u" -o /tmp/sattv.xml
          echo "bytes=$(wc -c < /tmp/sattv.xml)"
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('/tmp/sattv.xml').read_text(encoding='utf-8',errors='replace')
          print('HEAD', s[:1500].replace('\n',' '))
          urls=sorted(set(re.findall(r'https?://[^<\s"\']+',s)))
          print('EMBEDDED_URLS',len(urls))
          for x in urls[:80]: print(x[:700])
          for token in ('ContentGuideSource','ScheduleInfoEndpoint','ProgramInformation','ServiceInstance','SatelliteParameters','ContentGuide'):
              print(token,s.count(token))
          PY
