name: RC80 sealed offline package tests (no deployment)
on:
  push:
    branches: ["feature/rc80-offline-sealed-build-20261015", "fix/rc80-live-bestmatch-parity-20261016"]
    paths:
      - "tools/build_rc80_offline_blocked_ipk.py"
      - "tools/assemble_rc80_one_shot_offline.py"
      - "tools/apply_rc80_private_functional_fixes.py"
      - "tests/test_rc80_offline_blocked_ipk.py"
      - "tests/test_rc80_live_bestmatch_parity.py"
      - "source/overlay/ui/channel_mapping.py"
      - "tests/test_rc80_one_shot_end_to_end.py"
      - "tests/test_rc80_package_manifest_readonly.py"
      - "tools/audit_rc80_package_manifest_readonly.py"
      - "tools/audit_rc80_rollback_package_readonly.py"
      - ".github/workflows/rc80-sealed-offline-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile offline builder and source guards
        run: python -m py_compile tools/apply_rc80_private_functional_fixes.py tools/assemble_rc80_one_shot_offline.py tools/build_rc80_offline_blocked_ipk.py tools/audit_rc80_package_manifest_readonly.py tools/audit_rc80_rollback_package_readonly.py tests/test_rc80_offline_blocked_ipk.py
      - name: One-shot must refuse absent private rescue (no writes)
        run: |
          python - <<'PY'
          import subprocess, sys
          cmd = [sys.executable, 'tools/assemble_rc80_one_shot_offline.py',
                 '--repo', '.', '--rescue', '/tmp/epg-rc80-ABSENT-NEVER.ipk']
          p = subprocess.run(cmd, capture_output=True, text=True, check=False)
          assert p.returncode == 2, (p.returncode, p.stdout, p.stderr)
          assert '"authorized_to_install": false' in p.stdout.lower(), p.stdout
          assert '"status": "NO_GO"' in p.stdout, p.stdout
          PY
      - name: Synthetic offline staging and hard-block regression
        run: python -m unittest discover -s tests -p "test_rc80_offline_blocked_ipk.py" -v
      - name: One-shot synthetic 215-file IPK end-to-end (never installs)
        run: python -m unittest discover -s tests -p "test_rc80_one_shot_end_to_end.py" -v
      - name: All plugin regressions (non deploying)
        run: python -m unittest discover -s tests -p "test_*py" -v
