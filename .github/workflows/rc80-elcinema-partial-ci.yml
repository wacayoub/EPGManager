name: RC80 ElCinema 97 current / 32 incomplete — no deploy
on:
  push:
    branches: [fix/rc80-elcinema-partial-48h-20261017]
    paths:
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_partial_48h.py'
      - '.github/workflows/rc80-elcinema-partial-ci.yml'
  pull_request:
    paths:
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_partial_48h.py'
      - '.github/workflows/rc80-elcinema-partial-ci.yml'
permissions:
  contents: read
jobs:
  all-rc80-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete RC80 regression suite — no package, no receiver
        run: |
          python -m py_compile tools/audit_rc80_public_feed_provenance.py tests/test_rc80_elcinema_partial_48h.py
          python -m unittest discover -s tests -p 'test_*py' -q
  elcinema-live-published:
    needs: all-rc80-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect hash-pinned ElCinema real guide and per-ID status, no publication
        run: |
          python - <<'PY'
          import json,time
          from tools.audit_rc80_public_feed_provenance import fetch_one,mapping_quality_for_id
          row=fetch_one('elcinema',time.time(),verify_xmltv=True)
          current=row.get('trusted_current_epg_ids') or []
          partial=row.get('review_partial_epg_ids') or []
          blocked=row.get('partial_48h_blocked_ids') or []
          suspect=row.get('suspected_placeholder_epg_ids') or []
          meta={
              'source':row.get('source'),
              'status':row.get('status'),
              'published_sha_verified':row.get('xmltv_sha256_verified'),
              'quality_cohort_verified':row.get('quality_cohort_verified'),
              'trusted_current_ids':len(current),
              'short_horizon_review_ids':len(partial),
              'blocked_48h_failed_ids':len(blocked),
              'suspect_placeholders':len(suspect),
              'observed_empty_ids':len(row.get('xmltv_observed_zero_ids') or []),
              'partial_auto_eligible':sum(mapping_quality_for_id(cid,row)['auto_eligible'] for cid in partial),
              'no_receiver_change':True,'install_authorized':False,
          }
          print('RC80_ELCINEMA_LIVE_PER_ID',json.dumps(meta,sort_keys=True))
          assert row.get('status')=='HASHED_XMLTV_PER_ID_PARTIAL_48H',row.get('status')
          assert row.get('xmltv_sha256_verified') is True
          assert row.get('quality_cohort_verified') is True
          assert len(current)>=1
          assert len(partial)>=1
          assert len(blocked)>=len(partial)
          assert not set(current).intersection(blocked)
          assert not set(current).intersection(suspect)
          assert meta['partial_auto_eligible']==0
          PY
