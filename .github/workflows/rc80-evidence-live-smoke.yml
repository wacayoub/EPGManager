name: RC80 public XMLTV verified cache smoke (non-deploying)
on:
  push:
    branches: ["feature/plugin-only-consolidation-20261014"]
    paths:
      - "source/overlay/core/verified_epg_refresh.py"
      - "source/overlay/core/verified_epg_match.py"
      - "tools/smoke_rc80_evidence_live.py"
      - ".github/workflows/rc80-evidence-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  online-public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run no-receiver public feed proof audit
        run: python tools/smoke_rc80_evidence_live.py --sources morocco,shahid --require-bytes-verified > /tmp/rc80-live-smoke.json
      - name: Display actual feed results (a green workflow is NOT feed quality)
        if: always()
        run: |
          if [ -f /tmp/rc80-live-smoke.json ]; then cat /tmp/rc80-live-smoke.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc80-evidence-public-only
          path: /tmp/rc80-live-smoke.json
          if-no-files-found: warn
          retention-days: 2
