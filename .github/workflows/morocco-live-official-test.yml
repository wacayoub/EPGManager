name: Morocco official EPG recovery regression
on:
  push:
    branches:
      - fix/morocco-live-official-source-restoration-20261017
    paths:
      - tools/morocco_current_official.py
      - tools/morocco_cloud_final.py
      - tools/morocco_live_grids_smoke.py
      - tests/test_morocco_live_official.py
      - .github/workflows/morocco-live-official-test.yml
  pull_request:
    paths:
      - tools/morocco_current_official.py
      - tools/morocco_cloud_final.py
      - tools/morocco_live_grids_smoke.py
      - tests/test_morocco_live_official.py
      - .github/workflows/morocco-live-official-test.yml
permissions:
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml cloudscraper curl_cffi
      - run: python -m py_compile tools/morocco_current_official.py tools/morocco_cloud_final.py
      - run: PYTHONPATH=tools python -m unittest discover -s tests -p test_morocco_live_official.py -v
      - run: PYTHONPATH=tools python tools/morocco_live_grids_smoke.py
