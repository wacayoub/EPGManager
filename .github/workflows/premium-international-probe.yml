name: Premium International Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/premium-international-probe.yml"

permissions:
  contents: read

jobs:
  natgeo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Nat Geo identities across MENA XMLTV sources
        shell: bash
        run: |
          python - <<'PY'
          import gzip, re, urllib.request, xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime, timezone, timedelta

          sources = [
            ('openepg-egypt1','https://www.open-epg.com/files/egypt1.xml.gz'),
            ('openepg-egypt2','https://www.open-epg.com/files/egypt2.xml.gz'),
            ('openepg-qatar1','https://www.open-epg.com/files/qatar1.xml.gz'),
            ('openepg-qatar2','https://www.open-epg.com/files/qatar2.xml.gz'),
            ('openepg-qatar3','https://www.open-epg.com/files/qatar3.xml.gz'),
            ('openepg-qatar4','https://www.open-epg.com/files/qatar4.xml.gz'),
            ('openepg-qatar5','https://www.open-epg.com/files/qatar5.xml.gz'),
            ('openepg-qatar6','https://www.open-epg.com/files/qatar6.xml.gz'),
            ('openepg-saudi1','https://www.open-epg.com/files/saudiarabia1.xml.gz'),
            ('openepg-saudi2','https://www.open-epg.com/files/saudiarabia2.xml.gz'),
            ('openepg-saudi3','https://www.open-epg.com/files/saudiarabia3.xml.gz'),
            ('openepg-saudi4','https://www.open-epg.com/files/saudiarabia4.xml.gz'),
            ('openepg-saudi5','https://www.open-epg.com/files/saudiarabia5.xml.gz'),
            ('openepg-saudi6','https://www.open-epg.com/files/saudiarabia6.xml.gz'),
            ('openepg-uae6','https://www.open-epg.com/files/uae6.xml.gz'),
            ('epgshare-ae1','https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz'),
            ('epgshare-sa2','https://epgshare01.online/epgshare01/epg_ripper_SA2.xml.gz'),
          ]
          pat = re.compile(r'(?:national\s*geographic|nat\s*geo|ناش(?:ي|و)ونال\s*جيو)', re.I)
          ar = re.compile(r'[\u0600-\u06ff]')
          lat = re.compile(r'[A-Za-z]')

          def dt(v):
              m=re.match(r'^(\d{12}|\d{14})(?:\s*([+-]\d{4}|Z))?', v or '')
              if not m: return None
              x=datetime.strptime(m.group(1), '%Y%m%d%H%M%S' if len(m.group(1))==14 else '%Y%m%d%H%M')
              off=m.group(2)
              if off=='Z': tz=timezone.utc
              elif off:
                  s=1 if off[0]=='+' else -1
                  tz=timezone(s*timedelta(hours=int(off[1:3]),minutes=int(off[3:5])))
              else: tz=timezone.utc
              return x.replace(tzinfo=tz).astimezone(timezone.utc)

          def txt(p,tag):
              n=p.find(tag); return ((n.text or '').strip() if n is not None else '')

          for name,url in sources:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'EPGManager-NatGeo-Probe/1.0'})
                  data=urllib.request.urlopen(req,timeout=45).read()
                  if data[:2]==b'\x1f\x8b': data=gzip.decompress(data)
                  root=ET.fromstring(data)
              except Exception as exc:
                  print(f'SOURCE {name} ERROR {exc}')
                  continue
              names={}
              for c in root.findall('channel'):
                  cid=(c.get('id') or '').strip()
                  dns=[(n.text or '').strip() for n in c.findall('display-name') if (n.text or '').strip()]
                  names[cid]=' | '.join(dns[:4])
              candidates={cid for cid,n in names.items() if pat.search(cid+' '+n)}
              rows=defaultdict(list)
              for p in root.findall('programme'):
                  cid=(p.get('channel') or '').strip()
                  if cid in candidates: rows[cid].append(p)
              if not candidates: continue
              print(f'\n=== SOURCE {name} candidates={len(candidates)} ===')
              for cid in sorted(candidates,key=str.casefold):
                  ps=sorted(rows.get(cid,[]),key=lambda p:p.get('start') or '')
                  valid=[]; ti_ar=ti_lat=de_ar=de_nonempty=0
                  for p in ps:
                      a,b=dt(p.get('start')),dt(p.get('stop'))
                      if a and b and b>a: valid.append((a,b,p))
                      t=txt(p,'title'); d=txt(p,'desc')
                      ti_ar += bool(ar.search(t)); ti_lat += bool(lat.search(t))
                      if d: de_nonempty += 1; de_ar += bool(ar.search(d))
                  valid.sort(key=lambda x:x[0]); coverage=gap_total=0.; gaps=[]
                  if valid:
                      cs,ce=valid[0][0],valid[0][1]
                      for a,b,_ in valid[1:]:
                          if a<=ce: ce=max(ce,b)
                          else:
                              coverage+=(ce-cs).total_seconds()/3600
                              gap=(a-ce).total_seconds()/3600; gap_total+=gap
                              if gap>2: gaps.append(gap)
                              cs,ce=a,b
                      coverage+=(ce-cs).total_seconds()/3600
                      span=(valid[-1][1]-valid[0][0]).total_seconds()/3600
                  else: span=0
                  n=max(1,len(ps))
                  print(f'ID {cid} name={names.get(cid,"")} events={len(ps)} coverage={coverage:.1f}h span={span:.1f}h gaps>2={len(gaps)} maxgap={max(gaps or [0]):.1f}h titleLat={100*ti_lat/n:.0f}% titleAR={100*ti_ar/n:.0f}% descAR={100*de_ar/max(1,de_nonempty):.0f}% descEmpty={len(ps)-de_nonempty}')
                  for a,b,p in valid[:4]:
                      print(f'  {a.isoformat()} -> {b.isoformat()} | {txt(p,"title")} | {txt(p,"desc")[:100]}')
          PY
