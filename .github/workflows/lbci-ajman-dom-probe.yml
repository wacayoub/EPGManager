name: LBCI Ajman DOM Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/lbci_ajman_dom_probe.py"
      - ".github/workflows/lbci-ajman-dom-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --disable-pip-version-check --quiet beautifulsoup4
      - run: |
          mkdir -p output
          python tools/lbci_ajman_dom_probe.py
      - name: Publish diagnostic only
        run: |
          git fetch origin mena-data
          git worktree add current-data origin/mena-data
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/lbci-ajman-dom-probe.* .
          git config user.name "EPGManager LBCI Ajman DOM Probe"
          git config user.email "actions@users.noreply.github.com"
          git add lbci-ajman-dom-probe.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe LBCI and Ajman schedule DOM"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
