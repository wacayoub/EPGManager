name: Morocco official source DOM probe

on:
  push:
    branches:
      - fix/morocco-live-official-source-restoration-20261017
    paths:
      - tools/morocco_source_dom_probe.py
      - .github/workflows/morocco-dom-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests beautifulsoup4 lxml
      - run: python tools/morocco_source_dom_probe.py
