name: RC80 24h ElCinema WARN yellow guard — NO INSTALL
on:
  push:
    branches: [fix/rc80-elcinema-warn24h-guard-20261017]
    paths:
      - 'source/overlay/core/verified_epg_refresh.py'
      - 'source/overlay/core/verified_epg_match.py'
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_warn24h.py'
      - '.github/workflows/rc80-elcinema-warn24h-ci.yml'
  pull_request:
    paths:
      - 'source/overlay/core/verified_epg_refresh.py'
      - 'source/overlay/core/verified_epg_match.py'
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_warn24h.py'
      - '.github/workflows/rc80-elcinema-warn24h-ci.yml'
permissions:
  contents: read
jobs:
  full-offline-rc80:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile modified source and regress all RC80 features
        run: |
          python -m py_compile source/overlay/core/verified_epg_refresh.py source/overlay/core/verified_epg_match.py tools/audit_rc80_public_feed_provenance.py tests/test_rc80_elcinema_warn24h.py
          python -m unittest discover -s tests -p 'test_*py' -q
  live-elcinema:
    needs: full-offline-rc80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify real published ElCinema severity is yellow, no mapping or import
        run: |
          python - <<'PY'
          import json,time
          from tools.audit_rc80_public_feed_provenance import fetch_one,mapping_quality_for_id
          out=fetch_one('elcinema',time.time(),verify_xmltv=True)
          yellow=out.get('severe_warn_gap_ids') or []
          trusted=out.get('trusted_current_epg_ids') or []
          print('ELCINEMA_RC80_REAL_WARN_GAP',json.dumps({
            'verified_sha':out.get('xmltv_sha256_verified'),
            'source_status':out.get('status'),
            'severe_warn_gap_count':len(yellow),
            'verified_green_count':len(trusted),
            'all_severe_gap_ids_yellow':all(not mapping_quality_for_id(cid,out)['auto_eligible'] for cid in yellow),
            'install_authorized':False,'receiver_modified':False,
          },sort_keys=True))
          assert out.get('xmltv_sha256_verified') is True
          assert not set(yellow).intersection(trusted)
          assert all(not mapping_quality_for_id(cid,out)['auto_eligible'] for cid in yellow)
          PY
