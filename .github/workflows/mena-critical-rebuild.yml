name: MENA Critical Rebuild Trigger

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mena-critical-rebuild-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch full MENA Cloud rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mena-epg.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched MENA Cloud EPG because a critical beIN/integrity file changed."
