name: Alias-Aware All-ID Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alias-aware-all-id-shadow.yml"
      - "tools/all_id_audit_alias_aware.py"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: mena-data
          path: data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit current production with alias-aware policy
        run: |
          set -euo pipefail
          mkdir -p out
          python -m py_compile tools/all_id_audit_alias_aware.py
          python tools/all_id_audit_alias_aware.py \
            --dir data --manifest data/shards.json \
            --json out/alias-aware-all-id.json \
            --text out/alias-aware-all-id.txt \
            --csv out/alias-aware-all-id.csv
          python - <<'PY'
          import json
          old=json.load(open('data/all-id-audit.json', encoding='utf-8'))['summary']
          new=json.load(open('out/alias-aware-all-id.json', encoding='utf-8'))['summary']
          print('OLD', old)
          print('NEW', new)
          assert new['FAIL'] == 0, new
          PY
      - name: Publish diagnostics only
        run: |
          set -euo pipefail
          cp out/alias-aware-all-id.* data/
          cd data
          git checkout -B mena-data origin/mena-data
          git config user.name "EPGManager Alias Audit"
          git config user.email "actions@users.noreply.github.com"
          git add alias-aware-all-id.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit compatibility aliases separately"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
