name: Separate EPG Sources

on:
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/separate-source-feeds.yml"
      - "tools/source_feed_pack.py"
      - "tools/source_gap_retry.py"
      - "tools/sport24_source.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: separate-epg-sources-writer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_WINDOW_HOURS: 3
    timeout-minutes: 30
    steps:
      - name: Casablanca 06:00 gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            hour="$(TZ=Africa/Casablanca date +%H)"
            if [ "$hour" = "06" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC slot; Casablanca hour=${hour}."
            fi
          fi

      - name: Checkout EPGManager
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/iptv-org-epg/package-lock.json

      - name: Verify source scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/source_feed_pack.py tools/source_gap_retry.py tools/sport24_source.py
          python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4

      - name: Install upstream grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build ElCinema OSN and beIN channel catalogues
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source-build
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('vendor/iptv-org-epg/sites')

          # ElCinema Arabic is intentionally standalone here. The main MENA
          # pipeline still treats it only as a metadata/fallback donor.
          src = root / 'elcinema.com' / 'elcinema.com_ar.channels.xml'
          if not src.exists():
              raise SystemExit('Missing current iptv-org ElCinema Arabic catalogue')
          eroot = ET.parse(src).getroot()
          eout = ET.Element('channels')
          seen = set()
          for c in eroot.findall('channel'):
              cid = (c.get('xmltv_id') or '').strip()
              if not cid or cid in seen:
                  continue
              seen.add(cid)
              eout.append(ET.fromstring(ET.tostring(c, encoding='utf-8')))
          ET.indent(eout, space='  ')
          Path('output/source-build/elcinema.channels.xml').write_bytes(
              ET.tostring(eout, encoding='utf-8', xml_declaration=True))

          # OSN official source: prefer Arabic row per xmltv_id, then English.
          candidates = []
          for path in sorted((root / 'osn.com').glob('*.channels.xml')):
              try:
                  parsed = ET.parse(path).getroot()
              except Exception:
                  continue
              for c in parsed.findall('channel'):
                  cid = (c.get('xmltv_id') or '').strip()
                  site_id = (c.get('site_id') or '').strip()
                  if not cid or not site_id:
                      continue
                  lang = (c.get('lang') or '').strip().lower()
                  rank = 0 if lang.startswith('ar') else (1 if lang.startswith('en') else 2)
                  candidates.append((cid, rank, path.name, c))
          best = {}
          for cid, rank, path_name, c in candidates:
              key = (rank, path_name)
              if cid not in best or key < best[cid][0]:
                  best[cid] = (key, c)
          oout = ET.Element('channels')
          for cid in sorted(best, key=str.casefold):
              oout.append(ET.fromstring(ET.tostring(best[cid][1], encoding='utf-8')))
          ET.indent(oout, space='  ')
          Path('output/source-build/osn.channels.xml').write_bytes(
              ET.tostring(oout, encoding='utf-8', xml_declaration=True))
          # beIN official sources: prefer bein.com, then beinsports.com,
          # Arabic row first when duplicate identities exist.
          candidates = []
          for site_rank, site in enumerate(('bein.com', 'beinsports.com')):
              site_dir = root / site
              for path in sorted(site_dir.glob('*.channels.xml')):
                  try:
                      parsed = ET.parse(path).getroot()
                  except Exception:
                      continue
                  for ch in parsed.findall('channel'):
                      cid = (ch.get('xmltv_id') or '').strip()
                      site_id = (ch.get('site_id') or '').strip()
                      if not cid or not site_id:
                          continue
                      lang = (ch.get('lang') or '').strip().lower()
                      lang_rank = 0 if lang.startswith('ar') else (1 if lang.startswith('en') else 2)
                      candidates.append((cid, site_rank, lang_rank, path.name, ch))
          best = {}
          for cid, site_rank, lang_rank, path_name, ch in candidates:
              key = (site_rank, lang_rank, path_name)
              if cid not in best or key < best[cid][0]:
                  best[cid] = (key, ch)
          bout = ET.Element('channels')
          for cid in sorted(best, key=str.casefold):
              bout.append(ET.fromstring(ET.tostring(best[cid][1], encoding='utf-8')))
          ET.indent(bout, space='  ')
          Path('output/source-build/bein.channels.xml').write_bytes(
              ET.tostring(bout, encoding='utf-8', xml_declaration=True))

          print('ElCinema channels=', len(eout), 'OSN channels=', len(oout), 'beIN channels=', len(bout))
          PY

      - name: Grab ElCinema standalone source - 1 day
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 900s npm run grab --- \
            --channels="${GITHUB_WORKSPACE}/output/source-build/elcinema.channels.xml" \
            --output="${GITHUB_WORKSPACE}/output/source-build/elcinema.raw.xml" \
            --days=1 --maxConnections=1 --delay=1000 --timeout=20000
          rc=$?
          echo "ElCinema source grab rc=${rc}"
          echo "${rc}" > "${GITHUB_WORKSPACE}/output/source-build/elcinema.grab.rc"
          test -s "${GITHUB_WORKSPACE}/output/source-build/elcinema.raw.xml" || \
            printf '%s\n' '<?xml version="1.0"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/source-build/elcinema.raw.xml"
          exit 0

      - name: Grab OSN official standalone source - 1 day
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 900s npm run grab --- \
            --channels="${GITHUB_WORKSPACE}/output/source-build/osn.channels.xml" \
            --output="${GITHUB_WORKSPACE}/output/source-build/osn.raw.xml" \
            --days=1 --maxConnections=1 --timeout=20000
          rc=$?
          echo "OSN source grab rc=${rc}"
          echo "${rc}" > "${GITHUB_WORKSPACE}/output/source-build/osn.grab.rc"
          test -s "${GITHUB_WORKSPACE}/output/source-build/osn.raw.xml" || \
            printf '%s\n' '<?xml version="1.0"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/source-build/osn.raw.xml"
          exit 0

      - name: Grab beIN official standalone source - 1 day
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 900s npm run grab --- \
            --channels="${GITHUB_WORKSPACE}/output/source-build/bein.channels.xml" \
            --output="${GITHUB_WORKSPACE}/output/source-build/bein.raw.xml" \
            --days=1 --maxConnections=1 --timeout=20000
          rc=$?
          echo "beIN source grab rc=${rc}"
          echo "${rc}" > "${GITHUB_WORKSPACE}/output/source-build/bein.grab.rc"
          test -s "${GITHUB_WORKSPACE}/output/source-build/bein.raw.xml" || \
            printf '%s\n' '<?xml version="1.0"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/source-build/bein.raw.xml"
          exit 0

      - name: Retry zero-EPG channels only
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          retry_source() {
            key="$1"
            extra="$2"
            python tools/source_gap_retry.py build \
              --catalogue "output/source-build/${key}.channels.xml" \
              --raw "output/source-build/${key}.raw.xml" \
              --output "output/source-build/${key}.retry.channels.xml"

            gaps="$(python -c 'import sys,xml.etree.ElementTree as ET; print(len(ET.parse(sys.argv[1]).getroot().findall("channel")))' "output/source-build/${key}.retry.channels.xml")"
            echo "${key} zero-EPG first-pass channels=${gaps}"
            if [ "${gaps}" -eq 0 ]; then
              return 0
            fi

            set +e
            (
              cd vendor/iptv-org-epg
              timeout --signal=TERM --kill-after=20s 420s npm run grab --- \
                --channels="${GITHUB_WORKSPACE}/output/source-build/${key}.retry.channels.xml" \
                --output="${GITHUB_WORKSPACE}/output/source-build/${key}.retry.raw.xml" \
                --days=1 --maxConnections=1 ${extra} --timeout=20000
            )
            retry_rc=$?
            set -e
            echo "${key} focused retry rc=${retry_rc}"
            if [ "${retry_rc}" -ne 0 ] || [ ! -s "output/source-build/${key}.retry.raw.xml" ]; then
              return 0
            fi

            python tools/source_gap_retry.py merge \
              --primary "output/source-build/${key}.raw.xml" \
              --retry "output/source-build/${key}.retry.raw.xml" \
              --output "output/source-build/${key}.merged.xml"
            mv "output/source-build/${key}.merged.xml" "output/source-build/${key}.raw.xml"
          }

          retry_source elcinema "--delay=1000"
          retry_source osn ""
          retry_source bein ""

      - name: Build exact zero-EPG source report
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          rows = []
          labels = {"elcinema":"ElCinema", "osn":"OSN Official", "bein":"beIN"}
          for key in ("elcinema","osn","bein"):
              cat_path = Path(f"output/source-build/{key}.channels.xml")
              raw_path = Path(f"output/source-build/{key}.raw.xml")
              if not cat_path.exists() or not raw_path.exists():
                  continue
              cat = ET.parse(cat_path).getroot()
              raw = ET.parse(raw_path).getroot()
              with_programmes = {
                  (p.get("channel") or "").strip()
                  for p in raw.findall("programme")
                  if (p.get("channel") or "").strip()
              }
              for ch in cat.findall("channel"):
                  cid = (ch.get("xmltv_id") or ch.get("id") or "").strip()
                  if not cid or cid in with_programmes:
                      continue
                  name = (ch.get("name") or "").strip() or (ch.get("site_id") or "").strip() or cid
                  rows.append({
                      "source_key": key,
                      "source": labels[key],
                      "xmltv_id": cid,
                      "channel_name": name,
                      "reason": "0 programmes returned by upstream after retry",
                  })

          report = {
              "schema": 1,
              "generated_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "rows": rows,
              "counts": {
                  k: sum(1 for r in rows if r["source_key"] == k)
                  for k in ("elcinema","osn","bein")
              },
          }
          out = Path("output/final-sources")
          out.mkdir(parents=True, exist_ok=True)
          (out / "source-zero-epg.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report["counts"], ensure_ascii=False))
          PY

      - name: Scrape Sport24 standalone source safely
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python tools/sport24_source.py \
            --output output/source-build/sport24.raw.xml \
            --report output/source-build/sport24-scrape.json \
            --window-hours "${TEST_WINDOW_HOURS}"
          rc=$?
          echo "Sport24 scrape rc=${rc}"
          echo "${rc}" > output/source-build/sport24.grab.rc
          test -s output/source-build/sport24.raw.xml || \
            printf '%s\n' '<?xml version="1.0"?><tv></tv>' > output/source-build/sport24.raw.xml
          exit 0

      - name: Pack receiver-safe standalone feeds
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/final-sources
          python tools/source_feed_pack.py \
            --input output/source-build/elcinema.raw.xml \
            --output-gz output/final-sources/source-elcinema.xml.gz \
            --output-txt output/final-sources/source-elcinema.txt \
            --stats output/final-sources/source-elcinema.json \
            --label ElCinema --window-hours "${TEST_WINDOW_HOURS}"
          echo "ElCinema pack rc=$?"
          python tools/source_feed_pack.py \
            --input output/source-build/osn.raw.xml \
            --output-gz output/final-sources/source-osn.xml.gz \
            --output-txt output/final-sources/source-osn.txt \
            --stats output/final-sources/source-osn.json \
            --label 'OSN Official' --window-hours "${TEST_WINDOW_HOURS}"
          echo "OSN pack rc=$?"
          python tools/source_feed_pack.py \
            --input output/source-build/bein.raw.xml \
            --output-gz output/final-sources/source-bein.xml.gz \
            --output-txt output/final-sources/source-bein.txt \
            --stats output/final-sources/source-bein.json \
            --label beIN --window-hours "${TEST_WINDOW_HOURS}"
          echo "beIN pack rc=$?"
          python tools/source_feed_pack.py \
            --input output/source-build/sport24.raw.xml \
            --output-gz output/final-sources/source-sport24.xml.gz \
            --output-txt output/final-sources/source-sport24.txt \
            --stats output/final-sources/source-sport24.json \
            --label Sport24 --window-hours "${TEST_WINDOW_HOURS}"
          echo "Sport24 pack rc=$?"
          cp output/source-build/sport24-scrape.json output/final-sources/sport24-scrape.json
          exit 0

      - name: Validate and build source registry
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip, json, xml.etree.ElementTree as ET

          out = Path('output/final-sources')
          rows = []
          catalogue_counts = {}
          for key in ('elcinema','osn','bein'):
              p = Path(f'output/source-build/{key}.channels.xml')
              if p.exists():
                  try:
                      catalogue_counts[key] = len(ET.parse(p).getroot().findall('channel'))
                  except Exception:
                      catalogue_counts[key] = 0
          try:
              sport_report = json.loads(Path('output/source-build/sport24-scrape.json').read_text(encoding='utf-8'))
              catalogue_counts['sport24'] = len(sport_report.get('channels') or [])
          except Exception:
              catalogue_counts['sport24'] = 0

          for key, label in [('elcinema','ElCinema'), ('sport24','Sport24'), ('osn','OSN Official'), ('bein','beIN')]:
              stats_path = out / f'source-{key}.json'
              stats = json.loads(stats_path.read_text(encoding='utf-8')) if stats_path.exists() else {}
              gz = out / f'source-{key}.xml.gz'
              healthy = False
              if gz.exists() and gz.stat().st_size:
                  try:
                      root = ET.fromstring(gzip.decompress(gz.read_bytes()))
                      healthy = bool(root.findall('channel')) and bool(root.findall('programme'))
                  except Exception:
                      healthy = False
              active_channels = int(stats.get('channels', 0) or 0)
              total_channels = int(catalogue_counts.get(key, 0) or 0)
              coverage_pct = round((active_channels * 100.0 / total_channels), 1) if total_channels else 0.0
              rc_path = Path(f'output/source-build/{key}.grab.rc')
              try:
                  grab_rc = int(rc_path.read_text(encoding='utf-8').strip()) if rc_path.exists() else 1
              except Exception:
                  grab_rc = 1
              scrape_pct = 100.0 if grab_rc == 0 and total_channels else 0.0
              stats['catalogue_channels'] = total_channels
              stats['scrape_pct'] = scrape_pct
              stats['coverage_pct'] = coverage_pct
              stats['grab_rc'] = grab_rc
              stats_path.write_text(json.dumps(stats, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              rows.append({
                  'key': key,
                  'label': label,
                  'xml': f'source-{key}.xml.gz',
                  'channels': active_channels,
                  'catalogue_channels': total_channels,
                  'scrape_pct': scrape_pct,
                  'coverage_pct': coverage_pct,
                  'programmes': int(stats.get('programmes', 0) or 0),
                  'healthy': healthy,
                  'grab_rc': grab_rc,
                  'window_hours': int(__import__('os').environ.get('TEST_WINDOW_HOURS','3')),
              })
          registry = {
              'schema': 1,
              'policy': 'standalone sources; no source can override the MENA authoritative feed; publish/LKG is isolated per source',
              'sources': rows,
          }
          (out / 'separate-sources.json').write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(registry, ensure_ascii=False))
          PY

      - name: Publish each healthy source independently with LKG protection
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Source Cloud"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin mena-data
          rm -rf publish-sources
          git worktree add publish-sources origin/mena-data
          cd publish-sources
          git checkout -B mena-data origin/mena-data

          python - <<'PY'
          from pathlib import Path
          import json, shutil
          src = Path('../output/final-sources')
          dst = Path('.')
          registry = json.loads((src / 'separate-sources.json').read_text(encoding='utf-8'))
          published = []
          for row in registry['sources']:
              key = row['key']
              if not row['healthy']:
                  print('KEEP_LKG', key, 'channels=', row['channels'], 'programmes=', row['programmes'])
                  continue
              for ext in ('xml.gz', 'txt', 'json'):
                  name = f'source-{key}.{ext}'
                  shutil.copy2(src / name, dst / name)
              published.append(key)
              print('PUBLISH', key, row['channels'], row['programmes'])
          # Registry and diagnostics are always current; receiver XML is LKG-protected.
          shutil.copy2(src / 'separate-sources.json', dst / 'separate-sources.json')
          if (src / 'source-zero-epg.json').exists():
              shutil.copy2(src / 'source-zero-epg.json', dst / 'source-zero-epg.json')
          if (src / 'sport24-scrape.json').exists():
              shutil.copy2(src / 'sport24-scrape.json', dst / 'sport24-scrape.json')
          print('published=', published)
          PY

          cat > separate-sources.txt <<'EOF'
          ElCinema|source-elcinema.xml.gz|Arabic entertainment metadata/EPG source
          Sport24|source-sport24.xml.gz|Sports guide; publishes only when explicit trustworthy programme times are available
          OSN Official|source-osn.xml.gz|Official OSN source, Arabic preferred then English fallback
          beIN|source-bein.xml.gz|Official beIN source feed, direct and LKG-protected
          EOF

          git add -A
          if git diff --cached --quiet; then
            echo "No standalone source changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "Update separate ElCinema Sport24 OSN beIN sources ${stamp}"
          git pull --rebase origin mena-data
          git push origin HEAD:mena-data


      - name: Refresh source monitoring immediately
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run refresh-mena-source-id-master.yml --ref main
