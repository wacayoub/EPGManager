name: EPG 48h - Shahid MBC

on:
  # Sole Shahid/MBC scheduled scraper, Moroccan local civil time.
  schedule:
    - cron: "39 3 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: shahid
      scheduled: false
    secrets: inherit
