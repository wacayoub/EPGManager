name: Morocco EPG Cloud

on:
  # GitHub cron is UTC.  Morocco changes its UTC offset around Ramadan, so
  # trigger both possible UTC hours; the generator accepts only 06:00 local.
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/morocco-epg.yml"
      - "tools/morocco_epg.py"
      - "tools/morocco_cloud_runner.py"
      - "tools/morocco_cloud_runner_ar.py"
      - "tools/morocco_cloud_runner_ar2.py"
      - "tools/morocco_cloud_runner_ar2_quality.py"
      - "tools/morocco_cloud_legacy_logic.py"
      - "tools/morocco_cloud_final.py"
      - "tools/morocco_epg_parts/**"

permissions:
  contents: write

concurrency:
  group: morocco-epg-cloud
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure permanent epg-data endpoint exists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin epg-data >/dev/null 2>&1; then
            echo "epg-data already exists."
            exit 0
          fi

          echo "Creating bootstrap epg-data branch so the public URL can never be 404."
          rm -rf bootstrap publish
          mkdir -p bootstrap
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          channels = {
              "AlAoula":"Al Aoula",
              "Arrabiaa":"Attaqafia / Arrabiaa",
              "AlMaghribiya":"Al Maghribia",
              "Assadisa":"Assadissa",
              "Tamazight":"Tamazight",
              "AFLAM.ma":"Aflam TV",
              "Arryadia_HD":"Arryadia HD",
              "Arryadia_TNT":"Arryadia TNT",
              "Arryadia_HD1":"Arryadia HD1",
              "Arryadia_HD2":"Arryadia HD2",
              "Arryadia_HD3":"Arryadia HD3",
              "2M":"2M",
              "Chada TV":"Chada TV",
              "MEDI1TV_AR.ma":"Medi1 TV Arabic",
              "MEDI1TV_MAGHREB.ma":"Medi1 TV Maghreb",
          }
          root = ET.Element("tv", {"generator-info-name":"EPGManager Morocco Cloud"})
          for cid, name in channels.items():
              c = ET.SubElement(root, "channel", {"id": cid})
              ET.SubElement(c, "display-name").text = name
          ET.indent(root, space="  ")
          xml = ET.tostring(root, encoding="utf-8", xml_declaration=True)
          Path("bootstrap/morocco.xml.gz").write_bytes(gzip.compress(xml, compresslevel=9))
          Path("bootstrap/morocco.txt").write_text("EPGManager Morocco Cloud bootstrap feed\n", encoding="utf-8")
          Path("bootstrap/manifest.json").write_text(json.dumps({
              "version":"bootstrap",
              "status":"bootstrap",
              "generated":datetime.now(timezone.utc).isoformat(),
              "channels":len(channels),
              "programmes":0
          }, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git worktree add --detach publish
          cd publish
          git checkout --orphan epg-data
          git rm -rf . >/dev/null 2>&1 || true
          cp ../bootstrap/morocco.xml.gz .
          cp ../bootstrap/morocco.txt .
          cp ../bootstrap/manifest.json .
          printf '%s\n' 'EPGManager Morocco Cloud data branch.' > README.md
          git add morocco.xml.gz morocco.txt manifest.json README.md
          git commit -m "Bootstrap Morocco EPG endpoint"
          git push origin epg-data

  build:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 15 \
            requests beautifulsoup4 lxml cloudscraper curl_cffi

      - name: Verify generators
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/morocco_epg.py \
            tools/morocco_cloud_runner.py \
            tools/morocco_cloud_runner_ar.py \
            tools/morocco_cloud_runner_ar2.py \
            tools/morocco_cloud_legacy_logic.py \
            tools/morocco_cloud_final.py

      - name: Test migrated SNRT and Arryadia logic
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import morocco_cloud_legacy_logic as m

          # SNRT news retitling + terrestrial tag.
          row = {
              'title': 'الأخبار',
              'desc_short': 'نشرة باللغة الفرنسية بث أرضي',
              'raw_text': 'الفرنسية TNT',
          }
          title = m._snrt_title(row)
          assert title == 'الأخبار الفرنسية [TNT / بث أرضي]', title

          # Exact weather description is a stable operator rule.
          assert m.WEATHER_DESC == 'نشرة جوية مفصلة حول حالة الطقس في المملكة المغربية.'

          # Arryadia club names / competition / live / matchday.
          t, d, live = m.format_football_title(
              'كرة القدم مباشر',
              'WAC - RCA البطولة الإحترافية الجولة 5'
          )
          assert live is True
          assert t == 'Live: Wydad Casablanca vs Raja Casablanca - Botola Pro', t
          assert d.startswith('[Journée 5]'), d
          assert m.normalize_club('RSB') == 'RS Berkane'
          assert m.normalize_club('AS FAR') == 'AS FAR Rabat'
          print('SNRT/Arryadia historical regression: PASS')
          PY

      - name: Download Last Known Good feed
        shell: bash
        run: |
          mkdir -p previous output
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/epg-data/morocco.xml.gz" \
            -o previous/morocco.xml.gz || true

      - name: Generate Morocco XMLTV with final historical source logic
        id: generate
        shell: bash
        run: |
          set +e
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA="--scheduled"
          fi
          timeout --signal=TERM --kill-after=20s 600s \
            python tools/morocco_cloud_final.py \
              --output-dir output \
              --previous previous/morocco.xml.gz \
              --days 7 \
              ${EXTRA}
          rc=$?
          echo "generator_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "Generator deadline reached; keeping Last Known Good feed."
          elif [ "$rc" -ne 0 ]; then
            echo "Generator returned ${rc}; keeping Last Known Good feed."
          fi
          exit 0

      - name: Validate candidate and Moroccan source policies
        id: candidate
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json, os, re, xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path(os.environ['GITHUB_OUTPUT'])
          p = Path('output/morocco.xml.gz')
          ready = False
          reason = 'no candidate generated'
          if p.is_file() and p.stat().st_size > 100:
              try:
                  root = ET.fromstring(gzip.decompress(p.read_bytes()))
                  channels = {x.get('id') for x in root.findall('channel')}
                  programmes = root.findall('programme')
                  required = {'AlAoula','2M','Chada TV','MEDI1TV_AR.ma','Arryadia_HD'}
                  missing = sorted(required - channels)
                  if missing:
                      reason = 'missing stable channel IDs: ' + ', '.join(missing)
                  elif len(programmes) < 50:
                      reason = 'abnormal programme count: %d' % len(programmes)
                  else:
                      manifest_path = Path('output/manifest.json')
                      if not manifest_path.is_file():
                          reason = 'manifest missing'
                      else:
                          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
                          if manifest.get('programmes') != len(programmes):
                              reason = 'manifest/programme count mismatch'
                          else:
                              ar = re.compile(r'[\u0600-\u06ff]')
                              twom = [x for x in programmes if x.get('channel') == '2M']
                              snrt_ids = {'AlAoula','Arrabiaa','AlMaghribiya','Assadisa','Tamazight','AFLAM.ma'}
                              arr_ids = {'Arryadia_HD','Arryadia_TNT','Arryadia_HD1','Arryadia_HD2','Arryadia_HD3'}
                              snrt = [x for x in programmes if x.get('channel') in snrt_ids]
                              arr = [x for x in programmes if x.get('channel') in arr_ids]
                              bad_t = []
                              bad_d = []
                              bad_policy = []
                              bad_time = []
                              evening = 0
                              french_first = set()
                              allowed_fr = {
                                  'Info Soir': 'info_soir',
                                  'Météo': 'meteo',
                                  'Eco News': 'eco_news',
                              }
                              for x in sorted(twom, key=lambda z: z.get('start') or ''):
                                  t = x.find('title')
                                  d = x.find('desc')
                                  tt = (t.text or '') if t is not None else ''
                                  dd = (d.text or '') if d is not None else ''
                                  start = x.get('start') or ''
                                  day = start[:8]
                                  try:
                                      hour = int(start[8:10])
                                      if hour >= 18:
                                          evening += 1
                                  except Exception:
                                      hour = -1
                                  if tt in allowed_fr:
                                      key = (day, allowed_fr[tt])
                                      if t is None or t.get('lang') != 'fr':
                                          bad_policy.append('%s must be lang=fr' % tt)
                                      elif hour < 18:
                                          bad_policy.append('%s appears before evening at %s' % (tt, start))
                                      elif key in french_first:
                                          bad_policy.append('duplicate French first edition %s on %s' % (tt, day))
                                      else:
                                          french_first.add(key)
                                  elif t is None or t.get('lang') != 'ar' or not ar.search(tt):
                                      bad_t.append(tt)
                                  if d is None or d.get('lang') != 'ar' or not ar.search(dd):
                                      bad_d.append(dd)

                              for x in snrt + arr:
                                  st = x.get('start') or ''
                                  sp = x.get('stop') or ''
                                  if st and sp and sp[:14] <= st[:14]:
                                      bad_time.append((x.get('channel'), st, sp))

                              # Historical Arryadia rule: real HD1/2/3 events are LIVE;
                              # synthetic gap fillers deliberately start with 'Programmes'.
                              bad_hd_live = []
                              for x in arr:
                                  if x.get('channel') not in {'Arryadia_HD1','Arryadia_HD2','Arryadia_HD3'}:
                                      continue
                                  t = x.find('title')
                                  tt = (t.text or '') if t is not None else ''
                                  if tt and not tt.startswith('Programmes ') and not tt.upper().startswith('LIVE:'):
                                      bad_hd_live.append(tt)

                              weather_bad = []
                              for x in snrt:
                                  t = x.find('title'); d = x.find('desc')
                                  tt = (t.text or '') if t is not None else ''
                                  dd = (d.text or '') if d is not None else ''
                                  if tt == 'أحوال الطقس' and dd != 'نشرة جوية مفصلة حول حالة الطقس في المملكة المغربية.':
                                      weather_bad.append(dd)

                              if len(twom) < 20:
                                  reason = '2M programme count too small for 7-day feed: %d' % len(twom)
                              elif evening < 3:
                                  reason = '2M full-day coverage failed: only %d evening events' % evening
                              elif bad_policy:
                                  reason = '2M French-first policy failed: %s' % bad_policy[:3]
                              elif bad_t:
                                  reason = '2M Arabic title quality failed outside allowed French first editions: %d/%d bad; sample=%r' % (len(bad_t), len(twom), bad_t[:3])
                              elif bad_d:
                                  reason = '2M Arabic description quality failed: %d/%d bad; sample=%r' % (len(bad_d), len(twom), bad_d[:3])
                              elif len(snrt) < 10:
                                  reason = 'SNRT programme count too small: %d' % len(snrt)
                              elif len(arr) < 10:
                                  reason = 'Arryadia programme count too small: %d' % len(arr)
                              elif bad_time:
                                  reason = 'SNRT/Arryadia invalid stop timeline: %r' % (bad_time[:3],)
                              elif weather_bad:
                                  reason = 'SNRT weather description policy failed: %r' % weather_bad[:3]
                              elif bad_hd_live:
                                  reason = 'Arryadia HD1/2/3 LIVE policy failed: %r' % bad_hd_live[:3]
                              else:
                                  ready = True
                                  reason = 'PASS: %d channels, %d programmes; 2M=%d evening=%d French-first=%d; SNRT=%d; Arryadia=%d; historical rules OK' % (
                                      len(channels), len(programmes), len(twom), evening, len(french_first), len(snrt), len(arr))
              except Exception as exc:
                  reason = 'candidate parse failed: %s' % exc
          print(reason)
          with out.open('a', encoding='utf-8') as f:
              f.write('ready=%s\n' % ('true' if ready else 'false'))
              f.write('reason=%s\n' % reason.replace('\n',' '))
          PY

      - name: Publish validated candidate atomically
        if: steps.candidate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"

          rm -rf publish
          git fetch origin epg-data:refs/remotes/origin/epg-data
          git worktree add -B epg-data publish origin/epg-data
          cp output/morocco.xml.gz publish/morocco.xml.gz
          cp output/morocco.txt publish/morocco.txt
          cp output/manifest.json publish/manifest.json
          if [ -f output/2m_audit.json ]; then cp output/2m_audit.json publish/2m_audit.json; fi
          printf '%s\n' 'EPGManager Morocco Cloud data branch.' > publish/README.md

          cd publish
          git add morocco.xml.gz morocco.txt manifest.json README.md
          if [ -f 2m_audit.json ]; then git add 2m_audit.json; fi
          if git diff --cached --quiet; then
            echo "No EPG content change; nothing to publish."
            exit 0
          fi
          VERSION=$(python -c "import json; print(json.load(open('manifest.json')).get('version','unknown'))")
          git commit -m "Morocco EPG ${VERSION} historical SNRT Arryadia and 2M logic"
          git push origin epg-data

      - name: Keep endpoint healthy when candidate is rejected
        if: steps.candidate.outputs.ready != 'true'
        run: |
          echo "Candidate rejected: ${{ steps.candidate.outputs.reason }}"
          echo "The existing epg-data/morocco.xml.gz remains untouched."

      - name: Preserve candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morocco-candidate-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3
