name: RC80 ElCinema 12h-gap quarantine candidate — NO DEPLOY
on:
  push:
    branches: [fix/rc80-elcinema-large-gap-quarantine-20261017]
    paths:
      - 'source/overlay/core/verified_epg_refresh.py'
      - 'source/overlay/core/verified_epg_match.py'
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_large_gaps.py'
      - 'tests/test_rc80_public_feed_provenance.py'
      - '.github/workflows/rc80-elcinema-severe-gap-ci.yml'
  pull_request:
    paths:
      - 'source/overlay/core/verified_epg_refresh.py'
      - 'source/overlay/core/verified_epg_match.py'
      - 'tools/audit_rc80_public_feed_provenance.py'
      - 'tests/test_rc80_elcinema_large_gaps.py'
      - 'tests/test_rc80_public_feed_provenance.py'
      - '.github/workflows/rc80-elcinema-severe-gap-ci.yml'
permissions:
  contents: read
jobs:
  all-rc80:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Complete RC80 regression, no IPK or receiver access
        run: |
          python -m py_compile source/overlay/core/verified_epg_refresh.py source/overlay/core/verified_epg_match.py tools/audit_rc80_public_feed_provenance.py tests/test_rc80_elcinema_large_gaps.py
          # Runtime source overlays are not part of the existing reviewed
          # RC80 offline sealed candidate. Full packaging tests must stay
          # NO-GO until its SHA-pinned source manifest is independently re-sealed.
          for test in \
            test_rc80_elcinema_large_gaps.py \
            test_rc80_elcinema_partial_48h.py \
            test_rc80_verified_epg_refresh.py \
            test_rc80_verified_epg_match.py \
            test_rc80_public_feed_provenance.py; do
            python -m unittest discover -s tests -p "$test" -q
          done
  real-feed:
    needs: all-rc80
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check current ElCinema public guide SHA against explicit 12-hour review threshold
        run: |
          python - <<'PY'
          import time,json
          from tools.audit_rc80_public_feed_provenance import fetch_one, _get_json, mapping_quality_for_id
          row=fetch_one('elcinema',time.time(),verify_xmltv=True)
          rep=_get_json('reports/elcinema-48h-audit.json')
          meta=_get_json('feeds/elcinema.json')
          audit=next(x for x in rep['feeds'] if x.get('feed')=='elcinema.xml.gz')
          severe={x['id'] for x in audit['rows'] if x['status']=='WARN'
                  and isinstance(x.get('max_gap_minutes'),(int,float))
                  and x['max_gap_minutes']>=720}
          observed=set(row.get('partial_48h_large_gap_ids') or [])
          print('RC80_LARGE_GAP_PER_ID',json.dumps({
            'source':'elcinema','published':meta.get('generated_utc'),
            'source_48h_status':audit['status'],'severe_warn_count':len(severe),
            'quarantined_count':len(observed),
            'trustworthy_current_ids':len(row.get('trusted_current_epg_ids') or []),
            'metadata_cohort_verified':row.get('quality_cohort_verified'),
            'published_xmltv_sha_verified':row.get('xmltv_sha256_verified'),
            'receiver_modified':False,
          },sort_keys=True))
          assert observed==severe,(sorted(observed-severe)[:8],sorted(severe-observed)[:8])
          assert not observed.intersection(row.get('trusted_current_epg_ids') or [])
          assert all(not mapping_quality_for_id(x,row)['auto_eligible'] for x in observed)
          assert row['xmltv_sha256_verified'] is True
          PY
