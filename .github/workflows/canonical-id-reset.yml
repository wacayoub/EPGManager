name: Canonical Receiver ID Reset

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mena-data-writer
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonicalizer
        uses: actions/checkout@v4
        with:
          ref: main
          path: generator
          fetch-depth: 1

      - name: Checkout published MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: publish
          fetch-depth: 0

      - name: Rebuild one coherent canonical publication
        shell: bash
        run: |
          set -euo pipefail
          python generator/tools/canonical_publish_finalize.py --dir publish
          python generator/tools/receiver_release_gate.py \
            --dir publish \
            --minimum-median-future-hours 30 \
            --json publish/receiver-release-gate.json \
            --text publish/receiver-release-gate.txt
          python generator/tools/namespace_replay_test.py --dir publish

      - name: Publish canonical-only receiver data
        working-directory: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xml.gz *.txt *.json
          if git diff --cached --quiet; then
            echo "No canonical ID changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "Global canonical receiver IDs ${stamp}"
          git pull --rebase origin mena-data
          git push origin HEAD:mena-data
