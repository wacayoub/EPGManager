name: Trigger ADM Production Rebuild Once

on:
  push:
    paths:
      - ".github/workflows/adm-trigger-production-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make ADM event feeds optional at receiver boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/adm_id_audit_policy.py')
          text = p.read_text(encoding='utf-8')
          old = '''SECONDARY_IDS = {"ADSportsExtra.ae", "YasTVExtra.ae"}\nOPTIONAL_STANDBY_IDS = {"BaynounahTV.ae"}\nREQUIRED_IDS = CORE_IDS | SECONDARY_IDS\nALLOWED_IDS = REQUIRED_IDS | OPTIONAL_STANDBY_IDS\n'''
          new = '''# Event-only feeds may legitimately disappear when no real event guide is active.\n# Their absence is healthy and they reappear automatically when useful EPG returns.\nSECONDARY_IDS = {"ADSportsExtra.ae", "YasTVExtra.ae"}\nOPTIONAL_STANDBY_IDS = {"BaynounahTV.ae"}\nREQUIRED_IDS = CORE_IDS\nALLOWED_IDS = CORE_IDS | SECONDARY_IDS | OPTIONAL_STANDBY_IDS\n'''
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'REQUIRED_IDS = CORE_IDS\n' not in text:
              raise SystemExit('ADM optional-event policy anchor missing')
          PY
          python -m py_compile tools/adm_identity_policy.py tools/adm_id_audit_policy.py tools/adm_final_regression.py
          python tools/adm_identity_policy.py

      - name: Commit policy correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add tools/adm_id_audit_policy.py
          if ! git diff --cached --quiet; then
            git commit -m "Treat ADM Extra feeds as optional event channels"
            git push origin HEAD:main
          fi

      - name: Dispatch full MENA Cloud production workflow on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run mena-epg.yml --ref main
