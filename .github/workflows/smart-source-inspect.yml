name: Smart Source Inspect

on:
  push:
    paths:
      - ".github/workflows/smart-source-inspect.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Smart Source code in current package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="$(tr -d '\r\n' < source/current.txt)"
          rm -rf /tmp/epgsrc && mkdir -p /tmp/epgsrc
          unzip -q "source/$SOURCE_FILE" -d /tmp/epgsrc
          echo '=== SOURCE ROOT ==='
          find /tmp/epgsrc -maxdepth 4 -type f -name '*.py' | sort
          echo '=== SMART/SOURCE MATCHES ==='
          grep -RniE 'Smart Source|SmartSource|smart source|source(s)? refresh|refresh source|epgshare|openepg|mena-data|morocco.xml|provider-osn|source registry' /tmp/epgsrc --include='*.py' --include='*.json' --include='*.xml' | head -n 400 || true
          echo '=== URL MATCHES ==='
          grep -RniE 'raw.githubusercontent.com|http[s]?://' /tmp/epgsrc --include='*.py' --include='*.json' --include='*.xml' | head -n 300 || true
