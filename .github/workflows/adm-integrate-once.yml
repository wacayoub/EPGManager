name: Integrate ADM Canonical Policy Once

on:
  push:
    paths:
      - ".github/workflows/adm-integrate-once.yml"

permissions:
  contents: write

concurrency:
  group: adm-integrate-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate new ADM modules before touching production pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/adm_identity_policy.py tools/adm_id_audit_policy.py tools/adm_final_regression.py
          python tools/adm_identity_policy.py

      - name: Apply guarded identity integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit('%s: expected one integration anchor, found %d' % (path, count))
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          merge = Path('tools/mena_cloud_merge_arabic_first.py')
          mtext = merge.read_text(encoding='utf-8')
          if 'import adm_identity_policy as adm_identity' not in mtext:
              replace_once(
                  merge,
                  'import mena_cloud_merge as base\nimport mena_cloud_merge_safe as safe\nimport mena_integrity_guard as guard\n\n_original_choose_timeline = safe._choose_timeline\n',
                  'import mena_cloud_merge as base\nimport mena_cloud_merge_safe as safe\nimport mena_integrity_guard as guard\nimport adm_identity_policy as adm_identity\n\nadm_identity.install(base)\n\n_original_choose_timeline = safe._choose_timeline\n',
              )

          shards = Path('tools/mena_cloud_shards_safe.py')
          stext = shards.read_text(encoding='utf-8')
          if '"baynounah"' not in stext.split('COUNTRY_KEYWORDS', 1)[0]:
              replace_once(
                  shards,
                  '"yas tv", "majid", "national geographic abu dhabi", "al emarat")\n            or any(x.startswith(("abudhabi", "adsports", "yassports", "yastv", "majid")) for x in tokens)):',
                  '"yas tv", "majid", "national geographic abu dhabi", "al emarat", "baynounah")\n            or any(x.startswith(("abudhabi", "adsports", "yassports", "yastv", "majid", "baynounah")) for x in tokens)):',
              )
          PY

      - name: Compile patched production code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/mena_cloud_merge.py \
            tools/mena_cloud_merge_safe.py \
            tools/mena_cloud_merge_arabic_first.py \
            tools/mena_cloud_shards_safe.py \
            tools/adm_identity_policy.py \
            tools/adm_id_audit_policy.py \
            tools/adm_final_regression.py
          python tools/adm_identity_policy.py
          grep -q 'adm_identity.install(base)' tools/mena_cloud_merge_arabic_first.py
          grep -q 'baynounah' tools/mena_cloud_shards_safe.py

      - name: Commit only non-workflow production code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add tools/mena_cloud_merge_arabic_first.py tools/mena_cloud_shards_safe.py
          if git diff --cached --quiet; then
            echo "ADM identity integration already present."
            exit 0
          fi
          git commit -m "Wire canonical Abu Dhabi Media receiver identities"
          git push origin HEAD:main
