name: Metadata Lock Shadow Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metadata-lock-shadow.yml"
      - "tools/mena_cloud_merge_metadata_locked.py"
      - "tools/metadata_lock_shadow_assert.py"

permissions:
  contents: write

concurrency:
  group: metadata-lock-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout EPGManager
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: current-data
          fetch-depth: 0

      - name: Checkout iptv-org EPG
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/epg
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vendor/epg/package-lock.json

      - name: Verify shadow scripts
        run: |
          python -m py_compile \
            tools/mena_cloud_merge_metadata_locked.py \
            tools/metadata_lock_shadow_assert.py \
            tools/all_id_audit.py

      - name: Install grabber
        working-directory: vendor/epg
        run: npm ci --no-audit --no-fund

      - name: Build catalogue
        run: |
          set -euo pipefail
          mkdir -p output/final output/upstream previous
          python tools/mena_cloud_catalog.py \
            --epg-root vendor/epg \
            --output-channels output/mena.channels.xml \
            --output-manifest output/catalog.json
          cp current-data/mena-arabic.xml.gz previous/mena-arabic.xml.gz || true
          curl -fL --retry 2 --connect-timeout 5 --max-time 30 \
            https://iptv-org.github.io/api/channels.json -o output/channels.json || echo '[]' > output/channels.json

      - name: Grab primary 48h
        working-directory: vendor/epg
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 1500s \
            npm run grab --- \
              --channels="${GITHUB_WORKSPACE}/output/mena.channels.xml" \
              --output="${GITHUB_WORKSPACE}/output/raw.xml" \
              --days=2 --maxConnections=3 --timeout=20000
          test -s "${GITHUB_WORKSPACE}/output/raw.xml" || printf '%s\n' '<?xml version="1.0"?><tv></tv>' > "${GITHUB_WORKSPACE}/output/raw.xml"
          exit 0

      - name: Merge with metadata lock
        run: |
          set -euo pipefail
          python tools/mena_cloud_merge_metadata_locked.py \
            --primary output/raw.xml \
            --catalog-manifest output/catalog.json \
            --output output/merged.xml \
            --report output/merge-report.json \
            --cache-dir output/upstream \
            --window-hours 48

      - name: Finalize and shard shadow output
        run: |
          set -euo pipefail
          python tools/mena_cloud_finalize_strict.py \
            --candidate output/merged.xml \
            --catalog-manifest output/catalog.json \
            --previous previous/mena-arabic.xml.gz \
            --merge-report output/merge-report.json \
            --window-hours 48 \
            --output-dir output/final
          python tools/mena_cloud_shards_strict.py \
            --source-cache-dir output/upstream \
            --channel-metadata output/channels.json \
            --input output/final/mena-arabic.xml.gz \
            --catalog-manifest output/catalog.json \
            --output-dir output/final \
            --manifest output/final/shards.json

      - name: Assert metadata lock
        run: |
          set -euo pipefail
          python tools/metadata_lock_shadow_assert.py \
            --raw output/raw.xml \
            --merged output/merged.xml \
            --final output/final/mena-arabic.xml.gz \
            --json output/metadata-lock-shadow.json \
            --text output/metadata-lock-shadow.txt
          cat output/metadata-lock-shadow.txt

      - name: Exhaustive All-ID shadow gate
        run: |
          set -euo pipefail
          python tools/all_id_audit.py \
            --dir output/final \
            --manifest output/final/shards.json \
            --json output/metadata-lock-shadow-all-id.json \
            --text output/metadata-lock-shadow-all-id.txt \
            --csv output/metadata-lock-shadow-all-id.csv
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/metadata-lock-shadow-all-id.json').read_text(encoding='utf-8'))
          s=r['summary']
          print('SHADOW ALL-ID:', s)
          assert s['FAIL'] == 0, s
          PY

      - name: Publish diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/metadata-lock-shadow.json .
          cp ../output/metadata-lock-shadow.txt .
          cp ../output/metadata-lock-shadow-all-id.json .
          cp ../output/metadata-lock-shadow-all-id.txt .
          cp ../output/metadata-lock-shadow-all-id.csv .
          git config user.name "EPGManager Metadata Lock Shadow"
          git config user.email "actions@users.noreply.github.com"
          git add metadata-lock-shadow*.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Test metadata-locked MENA merge"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
