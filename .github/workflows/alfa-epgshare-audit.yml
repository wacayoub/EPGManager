name: Alfa EPGShare Targeted Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alfa-epgshare-audit.yml"
      - "tools/alfa_epgshare_audit.py"

permissions:
  contents: write

concurrency:
  group: alfa-epgshare-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout EPGManager
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Alfa targeted audit
        run: |
          set -euo pipefail
          mkdir -p output
          python -m py_compile tools/alfa_epgshare_audit.py
          python tools/alfa_epgshare_audit.py --json output/alfa-epgshare-audit.json --text output/alfa-epgshare-audit.txt
          cat output/alfa-epgshare-audit.txt
      - name: Publish diagnostic only
        run: |
          set -euo pipefail
          git fetch origin mena-data
          git worktree add current-data origin/mena-data
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/alfa-epgshare-audit.json .
          cp ../output/alfa-epgshare-audit.txt .
          git config user.name "EPGManager Alfa Audit"
          git config user.email "actions@users.noreply.github.com"
          git add alfa-epgshare-audit.json alfa-epgshare-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Alfa schedules in EPGShare AE1"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
