name: RC80 candidate qualification (no receiver)
on:
  push:
    branches: [codex/rc80-final-qualification-20261018, codex/rc80-interface-readability, codex/rc80-mapping-filters, codex/rc80-mapping-workflow, codex/rc80-rytec-native-import]
  pull_request:
    branches: [feature/rc80-hardware-qualification-readonly-20261016, codex/rc80-final-qualification-20261018, codex/rc80-interface-readability, codex/rc80-mapping-filters, codex/rc80-rytec-native-import, codex/rc80-utc-live-validation-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest codex.test_receiver_readonly_probe -v
      - run: python -m unittest discover -s tests -v
