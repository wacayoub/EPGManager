name: Playco EPG Route Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/playco_epg_route_discovery.py"
      - ".github/workflows/playco-epg-route-discovery.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          mkdir -p output
          python tools/playco_epg_route_discovery.py
      - name: Publish diagnostic only
        run: |
          git fetch origin mena-data
          git worktree add current-data origin/mena-data
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/playco-epg-route-discovery.* .
          git config user.name "EPGManager Playco Route Discovery"
          git config user.email "actions@users.noreply.github.com"
          git add playco-epg-route-discovery.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Discover ADM Playco EPG route"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
