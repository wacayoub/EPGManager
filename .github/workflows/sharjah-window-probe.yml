name: Sharjah Window Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sharjah_window_probe.py"
      - ".github/workflows/sharjah-window-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          mkdir -p output
          python tools/sharjah_window_probe.py
      - name: Publish diagnostic only
        run: |
          git fetch origin mena-data
          git worktree add current-data origin/mena-data
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/sharjah-window-probe.* .
          git config user.name "EPGManager Sharjah Window Probe"
          git config user.email "actions@users.noreply.github.com"
          git add sharjah-window-probe.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe Sharjah official grid windows"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
