name: Rebuild after MENA Other retirement

on:
  push:
    paths:
      - ".github/workflows/harden-mena-other-retirement.yml"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch clean MENA production rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mena-epg.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "MENA_REBUILD_DISPATCHED"
