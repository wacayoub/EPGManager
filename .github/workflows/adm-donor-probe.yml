name: ADM Donor Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/adm-donor-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download standalone donor feeds and current ADM shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donors
          for name in sport24 elcinema osn; do
            curl -fL --retry 2 --connect-timeout 5 --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-${name}.xml.gz" \
              -o "donors/${name}.xml.gz"
          done
          curl -fL --retry 2 --connect-timeout 5 --max-time 20 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/provider-adm.xml.gz" \
            -o donors/current-adm.xml.gz
      - name: Compare AD Sports 1 timelines
        shell: bash
        run: |
          python - <<'PY'
          import gzip,re,xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime,timezone

          def dt(s):
              m=re.match(r'^(\d{14})',s or '')
              return datetime.strptime(m.group(1),'%Y%m%d%H%M%S').replace(tzinfo=timezone.utc) if m else None
          ids={'osn.xml.gz':{'AbuDhabiSports1.ae@SD'},'sport24.xml.gz':{'sport24.adsports.1'},'current-adm.xml.gz':{'ADM.Abu.Dhabi.Sports.1.ae','AbuDhabiSports1.ae'}}
          for path in sorted(Path('donors').glob('*.xml.gz')):
              wanted=ids.get(path.name)
              if not wanted: continue
              root=ET.fromstring(gzip.decompress(path.read_bytes()))
              print('\n###',path.name)
              for cid in wanted:
                  rows=sorted([p for p in root.findall('programme') if p.get('channel')==cid],key=lambda p:p.get('start') or '')
                  if not rows: continue
                  for p in rows:
                      s=dt(p.get('start')); e=dt(p.get('stop'))
                      dur=(e-s).total_seconds()/3600 if s and e else -1
                      t=p.find('title'); title=(t.text or '').strip() if t is not None else ''
                      print(f'{cid} | {s.isoformat() if s else p.get("start")} -> {e.isoformat() if e else p.get("stop")} | {dur:.2f}h | {title}')
          PY
