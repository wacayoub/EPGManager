name: OSN Kids 60s real EPG policy tests

on:
  pull_request:
    paths:
      - "tools/osn_id_audit_policy.py"
      - "tests/test_osn_kids_microclip_policy.py"
      - ".github/workflows/osn-kids-microclip-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate genuine OSN Kids 60s exception and negative cases
        run: |
          python -m py_compile tools/osn_id_audit_policy.py
          python -m unittest discover -s tests -p 'test_osn_kids_microclip_policy.py' -v
