name: beIN Virtual EPG Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MENA Cloud EPG"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/bein-virtual-audit.yml"
      - "tools/bein_id_audit.py"
      - "tools/bein_id_audit_policy.py"

permissions:
  contents: write

concurrency:
  group: bein-virtual-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download currently published beIN Cloud
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bein-audit
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/provider-bein.xml.gz" \
            -o /tmp/bein-audit/provider-bein.xml.gz
          curl -fL --retry 3 --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/shards.json" \
            -o /tmp/bein-audit/shards.json

      - name: Run exhaustive policy-aware Virtual EPGManager ID-by-ID audit
        shell: bash
        run: |
          set -euo pipefail
          python tools/bein_id_audit_policy.py \
            --xml /tmp/bein-audit/provider-bein.xml.gz \
            --json /tmp/bein-audit/bein-id-audit-policy.json \
            --text /tmp/bein-audit/bein-id-audit-policy.txt
          cat /tmp/bein-audit/bein-id-audit-policy.txt

      - name: Verify actual displayed scripts without trusting XML lang tags
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, re, xml.etree.ElementTree as ET
          from collections import defaultdict
          AR = re.compile(r'[\u0600-\u06ff]')
          LAT = re.compile(r'[A-Za-z]')
          root = ET.fromstring(gzip.decompress(open('/tmp/bein-audit/provider-bein.xml.gz','rb').read()))
          names = {}
          for c in root.findall('channel'):
              cid = (c.get('id') or '').strip()
              dn = c.find('display-name')
              names[cid] = ((dn.text or '').strip() if dn is not None else cid)
          events = defaultdict(list)
          for p in root.findall('programme'):
              events[(p.get('channel') or '').strip()].append(p)
          print('REAL_SCRIPT_CHECK - XML lang attributes ignored')
          for cid in sorted(names, key=str.casefold):
              rows = events.get(cid, [])
              ta = tl = th = da = dl = mismatch = 0
              for p in rows:
                  t = p.find('title')
                  d = p.find('desc')
                  tv = ((t.text or '').strip() if t is not None else '')
                  dv = ((d.text or '').strip() if d is not None else '')
                  ar_t = len(AR.findall(tv)) >= 2
                  la_t = len(LAT.findall(tv)) >= 2
                  ar_d = len(AR.findall(dv)) >= 2
                  la_d = len(LAT.findall(dv)) >= 2
                  ta += ar_t; tl += la_t; th += ar_t and la_t
                  da += ar_d; dl += la_d
                  declared = ((t.get('lang') or '').lower() if t is not None else '')
                  if declared.startswith('ar') and la_t and not ar_t:
                      mismatch += 1
                  if declared.startswith('en') and ar_t and not la_t:
                      mismatch += 1
              n = max(1, len(rows))
              print('SCRIPT|%s|events=%d|title_AR=%.0f%%|title_Latin=%.0f%%|hybrid=%.0f%%|desc_AR=%.0f%%|lang_tag_mismatch=%d' % (
                  cid, len(rows), ta*100.0/n, tl*100.0/n, th*100.0/n, da*100.0/n, mismatch))
          PY

      - name: Publish policy-aware diagnostic to mena-data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bein-data
          git fetch origin mena-data
          git worktree add /tmp/bein-data origin/mena-data
          cd /tmp/bein-data
          git checkout -B mena-data origin/mena-data
          git config user.name "EPGManager beIN Audit"
          git config user.email "actions@users.noreply.github.com"

          # all-ID audit is triggered by the same MENA publication and can write
          # mena-data at almost the same moment. Rebase/retry rather than turning
          # a successful beIN data audit red because the branch moved.
          for attempt in 1 2 3 4 5; do
            git fetch origin mena-data
            git reset --hard origin/mena-data
            cp /tmp/bein-audit/bein-id-audit-policy.json .
            cp /tmp/bein-audit/bein-id-audit-policy.txt .
            git add bein-id-audit-policy.json bein-id-audit-policy.txt
            if git diff --cached --quiet; then
              echo "No beIN policy audit changes."
              exit 0
            fi
            git commit -m "Audit published beIN IDs with production language policy"
            if git push origin HEAD:mena-data; then
              exit 0
            fi
            echo "mena-data moved during beIN audit publish; retry ${attempt}/5"
            sleep $((attempt * 2))
          done
          echo "Unable to publish beIN diagnostic after 5 branch-race retries."
          exit 1
