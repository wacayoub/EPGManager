name: EPG 48h - Morocco

on:
  # Sole automatic Morocco source scrape: 07:07 fixed GMT+0, no DST.
  # Never re-scrape Morocco automatically on implementation commits.
  schedule:
    - cron: "7 7 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: morocco
      scheduled: false
    secrets: inherit
