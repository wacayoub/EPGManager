name: beIN EN2 alias regression (read-only)

on:
  push:
    paths:
      - "tools/bein_receiver_id_normalize.py"
      - "tools/enrich_mena_source_id_master.py"
      - "tools/test_bein_receiver_aliases.py"
      - ".github/workflows/bein-en2-alias-regression.yml"
  pull_request:
    paths:
      - "tools/bein_receiver_id_normalize.py"
      - "tools/test_bein_receiver_aliases.py"
      - ".github/workflows/bein-en2-alias-regression.yml"

permissions:
  contents: read

jobs:
  alias-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile normalizer and regression
        run: python -m py_compile tools/bein_receiver_id_normalize.py tools/test_bein_receiver_aliases.py tools/enrich_mena_source_id_master.py
      - name: Verify English 2 and Arabic 2 remain separate
        run: python tools/test_bein_receiver_aliases.py
