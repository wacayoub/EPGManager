name: ADM Donor Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/adm-donor-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download current ADM donor feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donors
          for name in sport24 osn; do
            curl -fL --retry 2 --connect-timeout 5 --max-time 20 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mena-data/source-${name}.xml.gz" \
              -o "donors/${name}.xml.gz"
          done
          curl -fL --retry 2 --connect-timeout 5 --max-time 30 \
            "https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz" \
            -o donors/epgshare-ae1.xml.gz
          for n in 1 2 3 4 5 6; do
            curl -fL --retry 2 --connect-timeout 5 --max-time 30 \
              "https://www.open-epg.com/files/saudiarabia${n}.xml.gz" \
              -o "donors/openepg-saudi${n}.xml.gz"
          done
          curl -fL --retry 2 --connect-timeout 5 --max-time 30 \
            "https://www.open-epg.com/files/uae6.xml.gz" \
            -o donors/openepg-uae6.xml.gz
      - name: Inspect ADM identities and full AD Sports 1 timelines
        shell: bash
        run: |
          python - <<'PY'
          import gzip,re,xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime,timezone
          AR=re.compile(r'[\u0600-\u06ff]')
          def dt(s):
              m=re.match(r'^(\d{14})',s or '')
              return datetime.strptime(m.group(1),'%Y%m%d%H%M%S').replace(tzinfo=timezone.utc) if m else None
          def is_ads1(cid,name):
              x=(cid+' '+name).casefold().replace('_',' ').replace('.',' ')
              return bool(re.search(r'(?:abu\s*dhabi|ad)\s*sports?\s*1(?:\b|\s)',x)) and 'premium' not in x
          for path in sorted(Path('donors').glob('*.xml.gz')):
              root=ET.fromstring(gzip.decompress(path.read_bytes()))
              names={}
              for c in root.findall('channel'):
                  cid=c.get('id') or ''
                  dns=[(n.text or '').strip() for n in c.findall('display-name') if (n.text or '').strip()]
                  names[cid]=' | '.join(dns) or cid
              print('\n###',path.name)
              matched=False
              for cid,name in names.items():
                  if not is_ads1(cid,name):
                      continue
                  matched=True
                  rows=sorted([p for p in root.findall('programme') if p.get('channel')==cid],key=lambda p:p.get('start') or '')
                  starts=[];stops=[];longs=[];invalid=0
                  for p in rows:
                      s=dt(p.get('start'));e=dt(p.get('stop'))
                      if s: starts.append(s)
                      if e: stops.append(e)
                      if not s or not e or e <= s:
                          invalid += 1
                      elif (e-s).total_seconds() > 12*3600:
                          longs.append(p)
                  span=(max(stops)-min(starts)).total_seconds()/3600 if starts and stops else 0
                  titles=[];descs=[]
                  for p in rows:
                      t=p.find('title');d=p.find('desc')
                      titles.append((t.text or '').strip() if t is not None else '')
                      descs.append((d.text or '').strip() if d is not None else '')
                  ta=sum(bool(AR.search(x)) for x in titles); da=sum(bool(AR.search(x)) for x in descs)
                  print(f'ID {cid} | {name} | events={len(rows)} span={span:.1f}h long_gt12={len(longs)} invalid={invalid} title_AR={ta}/{len(rows)} desc_AR={da}/{len(rows)}')
                  for p in rows:
                      s=dt(p.get('start'));e=dt(p.get('stop')); dur=(e-s).total_seconds()/3600 if s and e else -1
                      t=p.find('title'); title=(t.text or '').strip() if t is not None else ''
                      print(f' ROW {s.isoformat() if s else p.get("start")} -> {e.isoformat() if e else p.get("stop")} {dur:.2f}h | {title}')
              if not matched:
                  print('NO_AD_SPORTS_1_MATCH')
          PY
