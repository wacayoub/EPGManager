name: Progress Samples and OSN Rescue Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/progress-and-osn-rescue-audit.yml"
      - "tools/progress_sample_report.py"
      - "tools/osn_country_guide_rescue_audit.py"

permissions:
  contents: write

concurrency:
  group: progress-osn-rescue-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout EPGManager
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: current-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build human progress samples
        run: |
          set -euo pipefail
          mkdir -p output
          python -m py_compile tools/progress_sample_report.py tools/osn_country_guide_rescue_audit.py
          python tools/progress_sample_report.py --data-dir current-data --out output/progress-samples.txt
          cat output/progress-samples.txt

      - name: Audit OSN generated country guides
        run: |
          set -euo pipefail
          python tools/osn_country_guide_rescue_audit.py \
            --all-id-csv current-data/all-id-audit.csv \
            --json output/osn-country-guide-rescue-audit.json \
            --text output/osn-country-guide-rescue-audit.txt
          cat output/osn-country-guide-rescue-audit.txt

      - name: Publish diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          cd current-data
          git checkout -B mena-data origin/mena-data
          cp ../output/progress-samples.txt .
          cp ../output/osn-country-guide-rescue-audit.json .
          cp ../output/osn-country-guide-rescue-audit.txt .
          git config user.name "EPGManager Progress Audit"
          git config user.email "actions@users.noreply.github.com"
          git add progress-samples.txt osn-country-guide-rescue-audit.json osn-country-guide-rescue-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish EPG progress samples and OSN rescue audit"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
