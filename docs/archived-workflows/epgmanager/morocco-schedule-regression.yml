name: Morocco delayed scheduled EPG source regression

on:
  pull_request:
    paths:
      - ".github/workflows/morocco-epg.yml"
      - ".github/workflows/morocco-schedule-regression.yml"
      - "tests/test_morocco_schedule_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/morocco-epg.yml"
      - ".github/workflows/morocco-schedule-regression.yml"
      - "tests/test_morocco_schedule_policy.py"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests -p test_morocco_schedule_policy.py -v
