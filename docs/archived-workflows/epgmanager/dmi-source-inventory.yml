name: DMI Source Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dmi-source-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory all Dubai Media identities
        shell: bash
        run: |
          python - <<'PY'
          import gzip,re,urllib.request,xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime,timezone,timedelta

          NOW=datetime.now(timezone.utc); END=NOW+timedelta(hours=48)
          SOURCES={
            'saudi1':'https://www.open-epg.com/files/saudiarabia1.xml.gz',
            'saudi2':'https://www.open-epg.com/files/saudiarabia2.xml.gz',
            'saudi3':'https://www.open-epg.com/files/saudiarabia3.xml.gz',
            'saudi4':'https://www.open-epg.com/files/saudiarabia4.xml.gz',
            'saudi5':'https://www.open-epg.com/files/saudiarabia5.xml.gz',
            'saudi6':'https://www.open-epg.com/files/saudiarabia6.xml.gz',
            'uae6':'https://www.open-epg.com/files/uae6.xml.gz',
            'egypt1':'https://www.open-epg.com/files/egypt1.xml.gz',
            'egypt2':'https://www.open-epg.com/files/egypt2.xml.gz',
            'epgshare-ae1':'https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz',
            'epgshare-sa2':'https://epgshare01.online/epgshare01/epg_ripper_SA2.xml.gz',
          }
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'EPGManager-DMI-Inventory/1.0'})
            with urllib.request.urlopen(req,timeout=45) as r:return r.read()
          def dt(v):
            m=re.match(r'^(\d{12}|\d{14})(?:\s*([+-]\d{4}|Z))?',(v or '').strip())
            if not m:return None
            raw=m.group(1); x=datetime.strptime(raw,'%Y%m%d%H%M%S' if len(raw)==14 else '%Y%m%d%H%M')
            off=m.group(2)
            if off=='Z':tz=timezone.utc
            elif off:
              sign=1 if off[0]=='+' else -1;tz=timezone(sign*timedelta(hours=int(off[1:3]),minutes=int(off[3:5])))
            else:tz=timezone.utc
            return x.replace(tzinfo=tz).astimezone(timezone.utc)
          def is_dmi(cid,name):
            s=((cid or '')+' '+(name or '')).casefold()
            return any(x in s for x in ('dubai','sama dubai','noor dubai','سما دبي','دبي زمان','دبي ريسينغ','دبي الرياضية','تلفزيون دبي'))
          for sname,url in SOURCES.items():
            try:
              data=get(url)
              if data[:2]==b'\x1f\x8b':data=gzip.decompress(data)
              root=ET.fromstring(data); names={}
              for ch in root.findall('channel'):
                cid=(ch.get('id') or '').strip(); dns=ch.findall('display-name')
                name=next(((n.text or '').strip() for n in dns if (n.text or '').strip()),cid)
                if is_dmi(cid,name):names[cid]=name
              counts=defaultdict(int); future=defaultdict(int); samples=defaultdict(list)
              for p in root.findall('programme'):
                cid=(p.get('channel') or '').strip()
                if cid not in names:continue
                counts[cid]+=1
                a=dt(p.get('start'));b=dt(p.get('stop'))
                if a and b and b>NOW and a<END:
                  future[cid]+=1
                  if len(samples[cid])<2:
                    t=p.find('title');samples[cid].append((a.isoformat(),((t.text or '').strip() if t is not None else '')))
              print('\n[%s] channels=%d' % (sname,len(names)))
              for cid in sorted(names,key=str.casefold):
                print('  %s | %s | all=%d current48=%d | %s' % (cid,names[cid],counts[cid],future[cid],samples[cid]))
            except Exception as e:
              print('\n[%s] ERROR %s' % (sname,e))
          PY
