name: All ID Programme Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mena-data-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout auditor
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout current MENA data
        uses: actions/checkout@v4
        with:
          ref: mena-data
          path: audit-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify auditor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/bein_id_audit.py \
            tools/all_id_audit.py \
            tools/all_id_audit_alias_aware.py \
            tools/all_id_audit_verified_exceptions.py

      - name: Audit every published XMLTV ID and all programmes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python tools/all_id_audit_verified_exceptions.py \
            --dir audit-data \
            --manifest audit-data/shards.json \
            --json audit-output/all-id-audit.json \
            --text audit-output/all-id-audit.txt \
            --csv audit-output/all-id-audit.csv
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('audit-output/all-id-audit.json').read_text(encoding='utf-8'))
          manifest=json.loads(Path('audit-data/shards.json').read_text(encoding='utf-8'))
          s=report['summary']
          assert not s['missing_shards'], s['missing_shards']
          assert s['channels'] == manifest['published_channels'], (s['channels'], manifest['published_channels'])
          assert int(s.get('FAIL', 0) or 0) == 0, 'Production all-ID FAIL=%s' % s.get('FAIL')
          assert int(s.get('NO_EPG', 0) or 0) == 0, 'Production all-ID NO_EPG=%s' % s.get('NO_EPG')
          print('COMPLETE PRODUCTION AUDIT:', s)
          PY

      - name: Publish coherent audit reports to mena-data
        shell: bash
        run: |
          set -euo pipefail
          cp audit-output/all-id-audit.json audit-data/all-id-audit.json
          cp audit-output/all-id-audit.txt audit-data/all-id-audit.txt
          cp audit-output/all-id-audit.csv audit-data/all-id-audit.csv
          cd audit-data
          git config user.name "EPGManager Audit"
          git config user.email "actions@users.noreply.github.com"
          git add all-id-audit.json all-id-audit.txt all-id-audit.csv
          if git diff --cached --quiet; then
            echo "No audit report changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "All-ID production audit ${stamp}"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
