name: REVIEW Priority Report

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/review-priority-report.yml"
      - "tools/review_priority_report.py"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: mena-data
          path: data
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build priority report
        run: |
          set -euo pipefail
          AUDIT=data/alias-aware-all-id.json
          test -s "$AUDIT" || AUDIT=data/all-id-audit.json
          python tools/review_priority_report.py \
            --audit "$AUDIT" \
            --json out.json --text out.txt
      - name: Publish diagnostics
        run: |
          set -euo pipefail
          cp out.json data/review-priority-report.json
          cp out.txt data/review-priority-report.txt
          cd data
          git checkout -B mena-data origin/mena-data
          git config user.name "EPGManager Review Audit"
          git config user.email "actions@users.noreply.github.com"
          git add review-priority-report.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rank REVIEW cleanup priorities"
          git fetch origin mena-data
          git rebase origin/mena-data
          git push origin HEAD:mena-data
