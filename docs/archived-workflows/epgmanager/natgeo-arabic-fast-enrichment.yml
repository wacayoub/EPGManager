name: NatGeo Arabic Fast Enrichment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mena-data-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Arabic metadata cache
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/natgeo_ad_arabic_enrich.py tools/adm_id_audit_policy.py tools/adm_final_regression.py
          python tools/natgeo_ad_arabic_enrich.py audit-cache \
            --cache data/natgeo_ad_arabic_metadata.json

      - name: Checkout current MENA production data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin mena-data
          rm -rf publish
          git worktree add publish origin/mena-data
          cd publish
          git checkout -B mena-data origin/mena-data
          test -s provider-adm.xml.gz

      - name: Enrich NatGeo Arabic metadata without rebuilding schedules
        shell: bash
        run: |
          set -euo pipefail
          python tools/natgeo_ad_arabic_enrich.py enrich \
            --xml publish/provider-adm.xml.gz \
            --output publish/provider-adm.xml.gz \
            --cache data/natgeo_ad_arabic_metadata.json \
            --report-json publish/natgeo-arabic-enrichment.json \
            --report-text publish/natgeo-arabic-enrichment.txt

          for f in mena-arabic.xml.gz mena.xml.gz premium.xml.gz; do
            if [ -s "publish/$f" ]; then
              python tools/natgeo_ad_arabic_enrich.py enrich \
                --xml "publish/$f" \
                --output "publish/$f" \
                --cache data/natgeo_ad_arabic_metadata.json
            fi
          done

      - name: Rebuild and gate all artifacts after enrichment
        shell: bash
        run: |
          set -euo pipefail
          python tools/canonical_publish_finalize.py --dir publish --skip-normalizers
          python tools/receiver_release_gate.py \
            --dir publish \
            --minimum-median-future-hours 30 \
            --json publish/receiver-release-gate.json \
            --text publish/receiver-release-gate.txt
          python tools/namespace_replay_test.py --dir publish

      - name: Publish per-ID ADM REVIEW FROZEN audit
        shell: bash
        run: |
          set +e
          python tools/adm_id_audit_policy.py \
            --xml publish/provider-adm.xml.gz \
            --json publish/adm-id-audit-policy.json \
            --text publish/adm-id-audit-policy.txt
          audit_rc=$?
          python tools/adm_final_regression.py \
            --audit-json publish/adm-id-audit-policy.json \
            --text publish/adm-final-regression.txt
          regression_rc=$?
          echo "ADM advisory audit rc=${audit_rc} regression_rc=${regression_rc}"
          echo "NatGeo status is taken from the per-ID audit; unrelated ADM failures do not block Arabic metadata publication."
          exit 0

      - name: Commit fast enrichment to mena-data
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git config user.name "EPGManager Cloud"
          git config user.email "actions@users.noreply.github.com"
          git add provider-adm.xml.gz mena-arabic.xml.gz manifest.json shards.json \
            natgeo-arabic-enrichment.json natgeo-arabic-enrichment.txt \
            adm-id-audit-policy.json adm-id-audit-policy.txt adm-final-regression.txt \
            canonical-publish-finalize.json receiver-id-aliases.json \
            receiver-release-gate.json receiver-release-gate.txt
          [ ! -e mena.xml.gz ] || git add mena.xml.gz
          [ ! -e premium.xml.gz ] || git add premium.xml.gz
          if git diff --cached --quiet; then
            echo "No NatGeo Arabic production changes."
            exit 0
          fi
          stamp="$(TZ=Africa/Casablanca date '+%Y%m%d-%H%M')"
          git commit -m "NatGeo verified Arabic enrichment ${stamp}"
          git pull --rebase origin mena-data
          git push origin HEAD:mena-data
