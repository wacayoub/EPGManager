name: Disney MENA Fast Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/disney-mena-fast-probe.yml"

permissions:
  contents: read

jobs:
  disney-mena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Disney MENA identity, timeline and Arabic metadata
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          NOW=datetime.now(timezone.utc)
          END=NOW+timedelta(hours=48)
          AR=re.compile(r'[\u0600-\u06ff]')

          OFFICIAL=[
            ('disney-ar','https://tv.ar.disneyme.com/'),
            ('disney-en','https://tv.en.disneyme.com/'),
            ('disney-en-schedule','https://tv.en.disneyme.com/whats-on'),
          ]
          SOURCES={
            'openepg-saudi1':'https://www.open-epg.com/files/saudiarabia1.xml.gz',
            'openepg-saudi2':'https://www.open-epg.com/files/saudiarabia2.xml.gz',
            'openepg-saudi3':'https://www.open-epg.com/files/saudiarabia3.xml.gz',
            'openepg-saudi4':'https://www.open-epg.com/files/saudiarabia4.xml.gz',
            'openepg-saudi5':'https://www.open-epg.com/files/saudiarabia5.xml.gz',
            'openepg-saudi6':'https://www.open-epg.com/files/saudiarabia6.xml.gz',
            'epgshare-sa2':'https://epgshare01.online/epgshare01/epg_ripper_SA2.xml.gz',
          }

          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'EPGManager-Disney-MENA-Probe/1.0','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=45) as r:
              return r.status, r.geturl(), r.read()

          def dt(v):
            m=re.match(r'^(\d{12}|\d{14})(?:\s*([+-]\d{4}|Z))?',(v or '').strip())
            if not m:return None
            raw=m.group(1); x=datetime.strptime(raw,'%Y%m%d%H%M%S' if len(raw)==14 else '%Y%m%d%H%M')
            off=m.group(2)
            if off=='Z': tz=timezone.utc
            elif off:
              sign=1 if off[0]=='+' else -1
              tz=timezone(sign*timedelta(hours=int(off[1:3]),minutes=int(off[3:5])))
            else: tz=timezone.utc
            return x.replace(tzinfo=tz).astimezone(timezone.utc)

          def txt(p,tag):
            n=p.find(tag); return ((n.text or '').strip() if n is not None else '')

          def logical(name,cid):
            v=(name or cid or '').casefold()
            v=re.sub(r'\.(?:sa|ae|qa|eg)(?:@.*)?$','',v)
            v=re.sub(r'\b(?:uhd|fhd|hd|sd)\b',' ',v)
            v=re.sub(r'[^a-z0-9]+',' ',v)
            v=' '.join(v.split())
            if 'disney junior' in v:return 'disney junior'
            if 'disney channel' in v:return 'disney channel'
            return ''

          print('DISNEY MENA OFFICIAL PRESENCE')
          official_ok=True
          for label,url in OFFICIAL:
            try:
              status,final,data=get(url); text=data.decode('utf-8','ignore')
              markers={
                'disney': ('Disney' in text or 'ديزني' in text),
                'schedule': ('What' in text and 'On' in text) or ('جدول البرامج' in text),
                'junior': ('Disney Junior' in text or 'ديزني جونيور' in text),
              }
              print(f'{label}: HTTP={status} bytes={len(data)} final={final} markers={markers}')
              if status!=200 or not markers['disney']: official_ok=False
            except Exception as e:
              official_ok=False; print(f'{label}: ERROR {e}')

          allsrc={}
          print('\nDISNEY CANDIDATES BY UPSTREAM')
          for sname,url in SOURCES.items():
            try:
              status,final,data=get(url)
              if data[:2]==b'\x1f\x8b':data=gzip.decompress(data)
              root=ET.fromstring(data)
              names={}
              for ch in root.findall('channel'):
                cid=(ch.get('id') or '').strip(); dn=ch.find('display-name')
                names[cid]=((dn.text or '').strip() if dn is not None else cid)
              rows={'disney channel':[],'disney junior':[]}
              ids={'disney channel':set(),'disney junior':set()}
              for p in root.findall('programme'):
                cid=(p.get('channel') or '').strip(); key=logical(names.get(cid,cid),cid)
                if not key:continue
                a,b=dt(p.get('start')),dt(p.get('stop'))
                if not a or not b or b<=a or b<=NOW or a>=END:continue
                rows[key].append((a,b,txt(p,'title'),txt(p,'desc'),cid)); ids[key].add(cid)
              allsrc[sname]=rows
              for key in ('disney channel','disney junior'):
                rr=sorted(rows[key]); n=len(rr)
                if not n:
                  print(f'{sname} | {key}: events=0 ids={sorted(ids[key])}')
                  continue
                dur=sum((b-a).total_seconds() for a,b,*_ in rr)/3600
                gaps=sum(1 for x,y in zip(rr,rr[1:]) if (y[0]-x[1]).total_seconds()>7200)
                overlaps=sum(1 for x,y in zip(rr,rr[1:]) if y[0]<x[1])
                short=sum(1 for a,b,*_ in rr if (b-a).total_seconds()<120)
                ar_t=sum(1 for *_,title,desc,cid in rr if AR.search(title or ''))
                ar_d=sum(1 for *_,title,desc,cid in rr if AR.search(desc or ''))
                empty=sum(1 for *_,title,desc,cid in rr if not desc)
                print(f'{sname} | {key}: events={n} coverage={dur:.1f}h gaps>2h={gaps} overlaps={overlaps} short<2m={short} title_AR={100*ar_t/n:.1f}% desc_AR={100*ar_d/n:.1f}% empty_desc={empty} ids={sorted(ids[key])}')
                for r in rr[:3]:print('  ',r[0].isoformat(),'->',r[1].isoformat(),'|',r[2])
            except Exception as e:
              print(f'{sname}: ERROR {e}')

          print('\nCROSS-SOURCE TIMELINE AGREEMENT')
          freeze={}
          for key in ('disney channel','disney junior'):
            sets={s:{(a,b) for a,b,*_ in rows[key]} for s,rows in allsrc.items() if rows[key]}
            ranked=sorted(sets.items(), key=lambda kv: len(kv[1]), reverse=True)
            if not ranked:
              print(key,': NO DATA'); freeze[key]=False; continue
            base_name,base=ranked[0]
            best=[]
            for other_name,other in ranked[1:]:
              inter=len(base&other)
              pct=100*inter/max(1,min(len(base),len(other)))
              best.append((pct,other_name,inter,len(other)))
            best.sort(reverse=True)
            print(f'{key}: base={base_name} events={len(base)} comparisons={best}')
            best_pct=best[0][0] if best else 0
            freeze[key]=official_ok and len(base)>=40 and best_pct>=90

          print('\nDISNEY MENA PROBE RESULT')
          print(json.dumps({'official_ok':official_ok,'freeze_candidate':freeze},ensure_ascii=False,sort_keys=True))
          if not official_ok:
            raise SystemExit('Official Disney MENA presence check failed')
          PY
