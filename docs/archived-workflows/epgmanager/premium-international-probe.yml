name: Premium International Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/premium-international-probe.yml"

permissions:
  contents: read

jobs:
  natgeo-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare Nat Geo Arabic and Abu Dhabi exact timelines
        shell: bash
        run: |
          python - <<'PY'
          import gzip, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta

          sources={
            'qatar4':('https://www.open-epg.com/files/qatar4.xml.gz','Nat geo hd.qa'),
            'epgshare-ae1':('https://epgshare01.online/epgshare01/epg_ripper_AE1.xml.gz','Nat.Geo.Abu.Dhabi.HD.ae'),
          }
          def dt(v):
              m=re.match(r'^(\d{12}|\d{14})(?:\s*([+-]\d{4}|Z))?',v or '')
              if not m:return None
              x=datetime.strptime(m.group(1),'%Y%m%d%H%M%S' if len(m.group(1))==14 else '%Y%m%d%H%M')
              off=m.group(2)
              if off=='Z':tz=timezone.utc
              elif off:
                  s=1 if off[0]=='+' else -1; tz=timezone(s*timedelta(hours=int(off[1:3]),minutes=int(off[3:5])))
              else:tz=timezone.utc
              return x.replace(tzinfo=tz).astimezone(timezone.utc)
          def text(p,tag):
              n=p.find(tag);return ((n.text or '').strip() if n is not None else '')
          def load(url,cid):
              req=urllib.request.Request(url,headers={'User-Agent':'EPGManager-NatGeo-Compare/1.0'})
              data=urllib.request.urlopen(req,timeout=45).read()
              if data[:2]==b'\x1f\x8b':data=gzip.decompress(data)
              root=ET.fromstring(data); out={}
              for p in root.findall('programme'):
                  if (p.get('channel') or '').strip()!=cid:continue
                  a,b=dt(p.get('start')),dt(p.get('stop'))
                  if a and b and b>a:out[(a,b)]=(text(p,'title'),text(p,'desc'))
              return out
          data={k:load(*v) for k,v in sources.items()}
          a,b=data['qatar4'],data['epgshare-ae1']; exact=set(a)&set(b)
          starts_a={x[0] for x in a}; starts_b={x[0] for x in b}; start_inter=starts_a&starts_b
          print('NATGEO EXACT TIMELINE COMPARISON')
          print(f'qatar4_events={len(a)} epgshare_events={len(b)} exact_start_stop={len(exact)} qatar4_exact_pct={100*len(exact)/max(1,len(a)):.1f}% epgshare_exact_pct={100*len(exact)/max(1,len(b)):.1f}% same_start={len(start_inter)}')
          for key in sorted(exact)[:30]:
              print(f'{key[0].isoformat()}->{key[1].isoformat()} | AR={a[key][0]} | EN={b[key][0]}')
          print('\nQATAR4 NONMATCHED')
          for key in sorted(set(a)-exact)[:15]:print(f'{key[0].isoformat()}->{key[1].isoformat()} | {a[key][0]}')
          print('\nEPGSHARE NONMATCHED')
          for key in sorted(set(b)-exact)[:15]:print(f'{key[0].isoformat()}->{key[1].isoformat()} | {b[key][0]}')
          PY
