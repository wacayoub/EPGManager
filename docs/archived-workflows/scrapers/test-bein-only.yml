name: Test beIN only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bein:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scraper repository
        uses: actions/checkout@v4

      - name: Checkout iptv-org EPG adapters
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          cd vendor/iptv-org-epg
          npm ci --no-audit --no-fund

      - name: Build beIN Arabic and Hybrid English catalogues
        run: |
          python tools/build_catalogues.py
          echo "beIN main catalogue:"
          grep -c '<channel ' output/source-build/bein.channels.xml
          echo "beIN hybrid English catalogue:"
          grep -c '<channel ' output/source-build/bein_hybrid_en.channels.xml

      - name: Grab beIN MENA main guide
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 1200s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/bein.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/bein-test.raw.xml" \
            --days=2 \
            --maxConnections=1 \
            --timeout=20000 \
            --delay=500

      - name: Grab beIN English entertainment titles
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 900s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/bein_hybrid_en.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/bein-test.en.xml" \
            --days=2 \
            --maxConnections=1 \
            --timeout=20000 \
            --delay=500

      - name: Pack beIN candidate
        run: |
          mkdir -p output/final data reports
          python tools/source_feed_pack.py \
            --input output/bein-test.raw.xml \
            --output-gz output/final/bein.xml.gz \
            --output-txt output/final/bein.txt \
            --stats output/final/bein.json \
            --label bein \
            --window-hours 48

      - name: Apply approved beIN Arabic sports policy
        run: |
          python tools/bein_arabize.py \
            --input output/final/bein.xml.gz \
            --output output/final/bein.ar.xml.gz \
            --cache data/bein_test_translation_cache.json \
            --report reports/bein-test-arabize.json
          mv output/final/bein.ar.xml.gz output/final/bein.xml.gz

      - name: Apply beIN Hybrid entertainment policy
        run: |
          python tools/bein_hybrid.py \
            --input output/final/bein.xml.gz \
            --english output/bein-test.en.xml \
            --policy config/bein-language-policy.json \
            --cache data/bein_test_hybrid_cache.json \
            --output output/final/bein.hybrid.xml.gz \
            --report reports/bein-hybrid.json
          mv output/final/bein.hybrid.xml.gz output/final/bein.xml.gz

      - name: Audit beIN Hybrid language policy
        run: |
          python - <<'PY'
          import gzip, json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          AR=re.compile(r"[\u0600-\u06FF]")
          policy=json.loads(Path("config/bein-language-policy.json").read_text(encoding="utf-8"))
          hybrid=set(policy["hybrid_ids"])
          root=ET.fromstring(gzip.decompress(Path("output/final/bein.xml.gz").read_bytes()))
          channels={(c.get("id") or "").strip(): next(((d.text or "").strip() for d in c.findall("display-name") if (d.text or "").strip()), "") for c in root.findall("channel")}
          by={}
          for p in root.findall("programme"):
              by.setdefault((p.get("channel") or "").strip(),[]).append(p)
          def txt(p,tag):
              n=p.find(tag)
              return ((n.text or "").strip() if n is not None else "")
          def pct(vals,pred):
              vals=[x for x in vals if x]
              return round(100*sum(1 for x in vals if pred(x))/len(vals),1) if vals else 0.0
          rows=[]
          for cid,name in channels.items():
              progs=by.get(cid,[])
              titles=[txt(p,"title") for p in progs]
              descs=[txt(p,"desc") for p in progs]
              rows.append({
                "id":cid,"name":name,
                "profile":"hybrid" if cid in hybrid else "sports_ar",
                "programmes":len(progs),
                "title_ar_pct":pct(titles,lambda x:bool(AR.search(x))),
                "desc_ar_pct":pct(descs,lambda x:bool(AR.search(x))),
                "desc_coverage_pct":round(100*sum(1 for d in descs if d)/len(progs),1) if progs else 0.0,
                "sample_title":titles[0] if titles else "",
                "sample_desc":descs[0][:220] if descs else ""
              })
          summary={
            "feed_ids":len(rows),
            "ids_with_epg":sum(r["programmes"]>0 for r in rows),
            "hybrid_ids_requested":len(hybrid),
            "hybrid_ids_with_epg":sum(r["profile"]=="hybrid" and r["programmes"]>0 for r in rows),
            "rows":rows
          }
          Path("reports/bein-hybrid-audit.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in summary.items() if k!="rows"},ensure_ascii=False))
          focus=hybrid | {
            "beINSports1.qa@MENA","beINSports2.qa@MENA","beINSports3.qa@MENA",
            "beINSportsNews.qa@SD"
          }
          for r in rows:
              if r["id"] in focus:
                  print("[LANG]",json.dumps(r,ensure_ascii=False))
          bad_hybrid=[r for r in rows if r["profile"]=="hybrid" and r["programmes"] and r["title_ar_pct"]>0]
          bad_desc=[r for r in rows if r["programmes"] and r["desc_coverage_pct"]>0 and r["desc_ar_pct"]<100]
          if bad_hybrid:
              print("BAD_HYBRID_TITLE",json.dumps(bad_hybrid,ensure_ascii=False))
              raise SystemExit(5)
          if bad_desc:
              print("BAD_DESC_LANGUAGE",json.dumps(bad_desc,ensure_ascii=False))
              raise SystemExit(6)
          PY

      - name: Upload beIN Hybrid test
        uses: actions/upload-artifact@v4
        with:
          name: bein-hybrid-test
          path: |
            output/final/bein.xml.gz
            output/final/bein.txt
            reports/bein-hybrid.json
            reports/bein-hybrid-audit.json
            reports/bein-test-arabize.json
            output/source-build/bein.channels.xml
            output/source-build/bein_hybrid_en.channels.xml
