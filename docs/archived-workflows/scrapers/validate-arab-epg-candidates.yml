name: Validate Arab EPG candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-arab-epg-candidates.yml"
      - "tools/validate_arab_epg_candidates.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install upstream EPG grabber
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Rebuild Arab gap inventory
        run: |
          mkdir -p reports output/arab-validation/catalogues
          python tools/discover_arab_epg_gaps.py \
            --vendor vendor/iptv-org-epg \
            --feeds-dir feeds \
            --json reports/arab-epg-gaps.json \
            --md reports/arab-epg-gaps.md

      - name: Build trusted candidate catalogues
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path

          # sat.tv intentionally excluded: scraping blocked in prior tests.
          TRUSTED = {
              "shahid.mbc.net",
              "osn.com",
              "elcinema.com",
              "roya-tv.com",
              "artonline.tv",
              "rotana.net",
              "zee5.com",
          }
          gaps=json.load(open("reports/arab-epg-gaps.json",encoding="utf-8"))
          by={}
          for item in gaps.get("missing",[]):
              for c in item.get("candidates",[]):
                  site=c["site"]
                  if site not in TRUSTED:
                      continue
                  key=(site,c["xmltv_id"])
                  by[key]=c

          grouped={}
          for (_,xid),c in by.items():
              grouped.setdefault(c["site"],[]).append(c)

          out=Path("output/arab-validation/catalogues")
          out.mkdir(parents=True,exist_ok=True)
          for site,rows in grouped.items():
              root=ET.Element("channels")
              seen=set()
              for c in rows:
                  k=(c["site_id"],c["xmltv_id"],c.get("lang",""))
                  if k in seen: continue
                  seen.add(k)
                  ch=ET.SubElement(root,"channel",{
                      "site":site,
                      "site_id":c["site_id"],
                      "lang":c.get("lang") or "ar",
                      "xmltv_id":c["xmltv_id"],
                  })
                  ch.text=c.get("name") or c["xmltv_id"]
              ET.indent(root,space="  ")
              p=out/(site+".channels.xml")
              p.write_bytes(ET.tostring(root,encoding="utf-8",xml_declaration=True))
              print("CATALOGUE",site,len(root.findall("channel")),p)
          PY

      - name: Live grab trusted candidate sources
        shell: bash
        run: |
          set +e
          mkdir -p output/arab-validation
          shopt -s nullglob
          for catalogue in output/arab-validation/catalogues/*.channels.xml; do
            site="$(basename "$catalogue" .channels.xml)"
            echo "=== LIVE VALIDATION $site ==="
            cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
            timeout --signal=TERM --kill-after=20s 420s npm run grab --- \
              --channels="$GITHUB_WORKSPACE/$catalogue" \
              --output="$GITHUB_WORKSPACE/output/arab-validation/$site.xml" \
              --days=2 \
              --maxConnections=1 \
              --timeout=20000 \
              --delay=350
            rc=$?
            echo "$rc" > "$GITHUB_WORKSPACE/output/arab-validation/$site.rc"
            cd "$GITHUB_WORKSPACE"
            [ -s "output/arab-validation/$site.xml" ] || echo '<?xml version="1.0"?><tv></tv>' > "output/arab-validation/$site.xml"
          done
          exit 0

      - name: Strict validation and filtering
        run: |
          python tools/validate_arab_epg_candidates.py \
            --gaps reports/arab-epg-gaps.json \
            --raw-dir output/arab-validation \
            --json reports/arab-epg-valid.json \
            --md reports/arab-epg-valid.md
          cat reports/arab-epg-valid.md

      - name: Show rejected reasons
        run: |
          python - <<'PY'
          import json, collections
          j=json.load(open("reports/arab-epg-valid.json",encoding="utf-8"))
          reasons=collections.Counter()
          countries=collections.Counter()
          for group in j["invalid"]:
              for c in group["candidates"]:
                  reasons[c.get("reason","UNKNOWN")]+=1
                  countries[c.get("country","?")]+=1
          print("REJECT_REASONS",dict(reasons))
          print("REJECT_COUNTRIES",dict(countries))
          print("VALID_COUNT",j["valid_channels"])
          print("INVALID_COUNT",j["invalid_channels"])
          PY
