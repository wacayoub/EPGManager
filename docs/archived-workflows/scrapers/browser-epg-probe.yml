name: Browser EPG probe - low rate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-epg-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-epg-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run low-rate browser probe
        run: python tools/browser_epg_probe.py
      - name: Print summaries
        run: |
          python -c "import json; x=json.load(open('reports/browser-probe/all.json',encoding='utf-8')); [print({k:r.get(k) for k in ('name','main_status','final_url','title','visible_epg_tokens','contains_schedule_times','error')}) for r in x]"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-epg-probe
          path: reports/browser-probe/
