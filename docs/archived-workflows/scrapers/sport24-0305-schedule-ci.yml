name: Sport24 sole 03:05 Casablanca daily scraping - no duplicate workflows
on:
  push:
    branches: [schedule/sport24-casablanca-0305-single-daily-20261018]
    paths:
      - '.github/workflows/refresh-sport24.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-evening-casablanca.yml'
      - 'tools/test_epg_casablanca_workflows.py'
      - '.github/workflows/sport24-0305-schedule-ci.yml'
  pull_request:
    paths:
      - '.github/workflows/refresh-sport24.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-evening-casablanca.yml'
      - 'tools/test_epg_casablanca_workflows.py'
      - '.github/workflows/sport24-0305-schedule-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML for workflow parsing
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Shared time schedule and targeted retry regressions
        run: python -m unittest tools.test_epg_schedule_policy tools.test_epg_casablanca_workflows -v
      - name: Audit all automatic Sport24 scrape paths, preserve AlKass
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          import yaml
          base=Path(".github/workflows")
          def load(name):
              return yaml.load((base/name).read_text(encoding="utf-8"),Loader=yaml.BaseLoader)
          sport=load("refresh-sport24.yml")
          chain=load("daily-epg-chain.yml")
          evening=load("epg-evening-casablanca.yml")
          retry=load("epg-casablanca-targeted-retry.yml")
          core=load("refresh-source-core.yml")
          manual=load("daily-source-refresh.yml")
          legacy=load("daily-epg.yml")
          watchdog=load("epg-watchdog.yml")
          donors=load("elcinema-daily-donors.yml")
          assert sport["on"]["schedule"]==[
              {"cron":"5 3 * * *","timezone":"Etc/GMT"}]
          assert "workflow_dispatch" in sport["on"] and "push" not in sport["on"]
          assert sport["jobs"]["refresh"]["uses"]=="./.github/workflows/refresh-source-core.yml"
          assert sport["jobs"]["refresh"]["with"]=={"source":"sport24","scheduled":"false"}
          assert "sport24" not in chain["jobs"]
          assert set(chain["jobs"])=={"elcinema_extend","finalize"}
          assert chain["on"]["schedule"]==[
              {"cron":"15 7 * * *","timezone":"Etc/GMT"}]
          assert "schedule" not in evening["on"]
          assert "workflow_dispatch" in evening["on"]
          morocco=load("refresh-morocco.yml")
          assert morocco["on"]["schedule"]==[{"cron":"7 7 * * *","timezone":"Etc/GMT"}]
          assert evening["jobs"]["sports"]["strategy"]["matrix"]["source"]==["alkass"]
          assert "matrix.source" in str(evening["jobs"]["sports"]["with"]["source"]),repr(evening["jobs"]["sports"]["with"]["source"])
          assert evening["jobs"]["morocco"]["with"]["source"]=="morocco"
          assert "schedule" not in retry["on"] and "workflow_dispatch" in retry["on"]
          for name,obj in [
             ("daily-source-refresh.yml",manual),("daily-epg.yml",legacy),
             ("elcinema-daily-donors.yml",donors),("refresh-source-core.yml",core)]:
             assert "schedule" not in obj["on"],name
          assert watchdog["on"]["schedule"]==[
              {"cron":"15 14 * * *","timezone":"Etc/GMT"}]
          assert load("refresh-elcinema.yml")["on"]["schedule"]==[
              {"cron":"20 1 * * *","timezone":"Etc/GMT"}]
          assert load("refresh-osn.yml")["on"]["schedule"]==[
              {"cron":"40 1 * * *","timezone":"Etc/GMT"}]
          assert load("refresh-bein.yml")["on"]["schedule"]==[
              {"cron":"22 2 * * *","timezone":"Etc/GMT"}]
          assert load("refresh-shahid.yml")["on"]["schedule"]==[
              {"cron":"39 3 * * *","timezone":"Etc/GMT"}]
          for name,obj in [
              ("daily-epg-chain.yml",chain),
              ("epg-evening-casablanca.yml",evening),
              ("epg-watchdog.yml",watchdog)]:
              for job in obj["jobs"].values():
                  if not isinstance(job,dict): continue
                  assert (job.get("with") or {}).get("source")!="sport24",name
                  sources=(((job.get("strategy") or {}).get("matrix") or {}).get("source") or [])
                  assert "sport24" not in sources,name
          tz=ZoneInfo("Etc/GMT")
          for date in [(2026,10,19),(2026,12,1),(2027,2,18),(2027,4,18)]:
              local=datetime(*date,3,5,tzinfo=tz)
              rt=local.astimezone(timezone.utc).astimezone(tz)
              assert (rt.year,rt.month,rt.day,rt.hour,rt.minute)==(*date,3,5)
              print("SPORT24_LOCAL_TRIGGER",local.isoformat(),
                    "UTC",local.astimezone(timezone.utc).isoformat())
          print("SPORT24_0305_ONLY_ONE_AUTOMATIC_TRIGGER_PASS")
          print("SPORT24_0715_AND_1930_DUPLICATE_SCRAPES_DISABLED")
          print("ALKASS_1930_AND_OTHER_SOURCES_PRESERVED")
          PY
