name: Probe OSN web guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/osn-web-probe-trigger.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe OSN encrypted channel API platform profiles
        shell: bash
        run: |
          node <<'JS'
          const https=require('https');
          const crypto=require('crypto');
          const key=Buffer.from('65a04b9b5591f27c837fac433274b494403e0eec5b43698060c28e1162d4460f','hex');
          const iv=Buffer.from('b7cc0a48d6d023bc1a2a670953ec5622','hex');

          function get(url){
            return new Promise((resolve,reject)=>{
              https.get(url,{headers:{'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*'}},res=>{
                let b=''; res.on('data',d=>b+=d); res.on('end',()=>resolve({status:res.statusCode,body:b}));
              }).on('error',reject);
            });
          }
          function dec(body){
            const x=JSON.parse(body);
            if(!x || !x.encrypted) return x;
            const d=crypto.createDecipheriv('aes-256-cbc',key,iv);
            return JSON.parse(d.update(x.encrypted,'base64','utf8')+d.final('utf8'));
          }
          const platforms=[
            '', 'Android','Other','other','Others','OTHER','OtherBox','OtherBoxes','Other boxes',
            'OthersBox','OthersBoxes','Generic','GenericBox','Legacy','LegacyBox','SatelliteBox',
            'SatelliteReceiver','Decoder','DVB','DVB-S','DVB-S2','android','Web','web','Website',
            'WebSite','WebApp','Browser','iOS','IOS','SmartTV','TV','STB','SetTopBox','Box',
            'OSNBox','OSNBOX','Satellite','DTH','IPTV','OTT','Kaon','Humax','Receiver','Portal'
          ];
          (async()=>{
            for(const p of platforms){
              const q=p ? '?platform='+encodeURIComponent(p) : '';
              try{
                const r=await get('https://www.osn.com/apidata/channels'+q);
                let data=null, err='';
                try{data=dec(r.body)}catch(e){err=e.message}
                const arr=Array.isArray(data)?data:[];
                const alfa=arr.filter(x=>/alfa|alpha|musals|cinema/i.test(String(x.title||x.name||'')));
                const focus=arr.filter(x=>/alfa|alpha|cinema|gma|tfc|cine.?mo|kass|oman tv sport|oman tv mubashir/i.test(String(x.title||x.name||'')));
                console.log('PLATFORM',p||'<none>','status',r.status,'count',arr.length,'alfa',alfa.length,'blankGuid',arr.filter(x=>!String(x.guid||'').trim()).length,err?('err='+err):'');
                for(const x of focus) console.log('  FOCUS_FULL',JSON.stringify(x));
              }catch(e){console.log('PLATFORM_ERR',p||'<none>',e.message)}
            }
          })();
          JS

      - name: Probe OSN prelive channel pages
        shell: bash
        run: |
          python - <<'PY'
          import requests,re
          urls=[
            "https://prelive.osn.com/en-ae/explore/channels/cin/alfa-cinema-1",
            "https://prelive.osn.com/en-ae/explore/channels/cin/alfa-cinema-2",
            "https://prelive.osn.com/en-ae/explore/channels/ser/alfa-series-hd",
            "https://prelive.osn.com/en-ae/explore/channels/yaw/alfa-al-yawm-hd",
            "https://prelive.osn.com/en-ae/explore/channels/saf/alfa-al-safwa",
            "https://prelive.osn.com/en-ae/explore/channels/fan/alfa-fann",
            "https://prelive.osn.com/en-ae/explore/channels/mus/alfa-music-hd",
          ]
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          for u in urls:
              r=s.get(u,timeout=30,allow_redirects=True)
              txt=r.text
              print("PRELIVE",r.status_code,len(txt),r.url)
              print("  title",re.search(r"<title[^>]*>(.*?)</title>",txt,re.I|re.S).group(1)[:160] if re.search(r"<title[^>]*>(.*?)</title>",txt,re.I|re.S) else "")
              for pat in ["Alfa Cinema 1","Alfa Cinema 2","Alfa Series","Alfa Al Yawm","Alfa Al Safwa","Alfa Fann","Alfa Music","__NEXT_DATA__"]:
                  if pat.lower() in txt.lower(): print("  MATCH",pat)
              dates=sorted(set(re.findall(r"\b(?:20\d{2}-\d{2}-\d{2}|\d{1,2}(?:st|nd|rd|th)\s+[A-Z][a-z]{2})\b",txt)))
              print("  DATES",dates[-12:])
              if r.status_code == 200:
                  for rx in [
                      r'[^"\']{0,180}(?:Alfa Cinema 2|channelGuid|site_id|guid|listings|schedule|tv-schedule|apidata|__NEXT_DATA__)[^"\']{0,320}',
                      r'href=["\']([^"\']*(?:alfa|safwa|music-now)[^"\']*)["\']',
                      r'https?://[^"\'<> ]{1,300}'
                  ]:
                      seen=set()
                      for m in re.finditer(rx,txt,re.I|re.S):
                          val=m.group(1) if m.lastindex else m.group(0)
                          val=re.sub(r'\s+',' ',val).replace('\\u0026','&')
                          if val in seen: continue
                          seen.add(val)
                          print("  HTML_CAND",val[:520])
                          if len(seen)>=80: break
          PY

      - name: Probe OSN guide with real Chrome
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re, json

          url="https://www.osn.com/en-ae/watch/tv-schedule"
          with sync_playwright() as p:
              browser=p.chromium.launch(channel="chrome", headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              page=browser.new_page(locale="en-US", viewport={"width":1365,"height":900})
              seen=[]
              def on_response(r):
                  u=r.url
                  if re.search(r"api|channel|schedule|guide|epg",u,re.I):
                      seen.append((r.status,u))
              page.on("response",on_response)
              try:
                  resp=page.goto(url,wait_until="domcontentloaded",timeout=60000)
                  print("CHROME_PAGE_STATUS", resp.status if resp else None)
                  page.wait_for_timeout(7000)
                  print("CHROME_TITLE",page.title())
                  print("CHROME_URL",page.url)
                  print("CHROME_BODY",re.sub(r"\s+"," ",page.locator("body").inner_text())[:2500])
                  sels=page.locator("select")
                  print("SELECT_COUNT",sels.count())
                  for i in range(sels.count()):
                      sel=sels.nth(i)
                      print("SELECT",i,"value",sel.input_value())
                      opts=sel.locator("option")
                      for j in range(opts.count()):
                          o=opts.nth(j)
                          print(" OPTION",i,j,"text",o.inner_text(),"value",o.get_attribute("value"))
                  for i in range(sels.count()):
                      sel=sels.nth(i)
                      opts=sel.locator("option")
                      for j in range(opts.count()):
                          txt=(opts.nth(j).inner_text() or "").strip().lower()
                          if "other box" in txt:
                              val=opts.nth(j).get_attribute("value")
                              print("SELECT_OTHER",i,"value",val)
                              sel.select_option(value=val)
                              page.wait_for_timeout(6000)
                              break
                  print("NETWORK_MATCHES",len(seen))
                  for status,u in seen[-120:]:
                      print(" NET",status,u)
              except Exception as e:
                  print("CHROME_ERR",type(e).__name__,str(e))
              finally:
                  browser.close()
          PY

      - name: Inspect current OSN web guide frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests, urllib.parse

          base="https://www.osn.com"
          pages=[
              f"{base}/ar-sa/watch/tv-schedule",
              f"{base}/ar-qa/explore/channels-sitemap",
              f"{base}/en-jo/explore/channels-sitemap",
              f"{base}/ar-ae/tv-packages/alfa",
          ]
          s=requests.Session()
          s.headers.update({
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language":"ar,en;q=0.8"
          })
          scripts=set()
          for url in pages:
              r=s.get(url,timeout=25)
              print("PAGE",url,"status",r.status_code,"bytes",len(r.content))
              txt=r.text
              for m in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''',txt,re.I):
                  scripts.add(urllib.parse.urljoin(url,m))
              for pat in ["Alfa Cinema 1","Alfa Series HD","apidata","tv-schedule","channelGuid"]:
                  if pat.lower() in txt.lower():
                      print("HTML_MATCH",pat,url)
          print("SCRIPTS",len(scripts))

          needles=[
              "apidata","channelGuid","tv-schedule","schedule-timeline","channels?",
              "Alfa Cinema","Alfa Series","channelNumber","tvguide","tv-guide",
              "/api/","graphql","schedule"
          ]
          for i,url in enumerate(sorted(scripts)):
              try:
                  r=s.get(url,timeout=25)
              except Exception as e:
                  print("JS_ERR",url,type(e).__name__,str(e)[:120])
                  continue
              if r.status_code!=200:
                  continue
              txt=r.text
              hits=[n for n in needles if n.lower() in txt.lower()]
              if not hits:
                  continue
              print("JS",i,url,"bytes",len(txt),"hits",",".join(hits))
              # Print compact windows around endpoint-like strings only.
              seen=set()
              for rx in [
                  r'https?://[^"\' ]{1,240}',
                  r'/(?:api|apidata)/[^"\' ]{1,220}',
                  r'[^"\']{0,100}(?:schedule-timeline|channelGuid|tv-schedule|tvguide)[^"\']{0,180}',
              ]:
                  for m in re.finditer(rx,txt,re.I):
                      frag=m.group(0).replace("\\","/")
                      frag=re.sub(r'\s+',' ',frag)
                      if frag not in seen:
                          seen.add(frag)
                          print("  CAND",frag[:420])
                      if len(seen)>=35:
                          break
                  if len(seen)>=35:
                      break
          PY
