name: Daily ElCinema donor permanence safety tests

on:
  push:
    branches: [fix/elcinema-daily-persistent-donors-20261015]
    paths:
      - "tools/elcinema_daily_donors.py"
      - "tools/test_elcinema_daily_donors.py"
      - ".github/workflows/elcinema-daily-donors.yml"
      - ".github/workflows/elcinema-donor-bootstrap.yml"
      - ".github/workflows/daily-epg-chain.yml"
      - ".github/workflows/epg-casablanca-targeted-retry.yml"
      - ".github/workflows/test-elcinema-daily-donors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install workflow YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile and run fail-closed regression tests
        run: |
          python -m py_compile tools/elcinema_daily_donors.py tools/test_elcinema_daily_donors.py
          python -m unittest tools.test_elcinema_daily_donors tools.test_elcinema_exact_id_gap_shadow -v
      - name: Lint reusable workflow dependencies and expressions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            --output /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash
          ./actionlint -color \
            .github/workflows/elcinema-daily-donors.yml \
            .github/workflows/elcinema-donor-bootstrap.yml \
            .github/workflows/daily-epg-chain.yml \
            .github/workflows/epg-casablanca-targeted-retry.yml
      - name: Validate workflow dependencies
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          w=Path('.github/workflows')
          main=yaml.load((w/'daily-epg-chain.yml').read_text(),Loader=yaml.BaseLoader)
          retry=yaml.load((w/'epg-casablanca-targeted-retry.yml').read_text(),Loader=yaml.BaseLoader)
          don=yaml.load((w/'elcinema-daily-donors.yml').read_text(),Loader=yaml.BaseLoader)
          assert main['jobs']['elcinema_extend']['needs']=='tabie'
          assert main['jobs']['finalize']['needs']=='elcinema_extend'
          assert retry['jobs']['elcinema_extend']['needs']==['decide','retry']
          assert 'elcinema_extend' in retry['jobs']['finalize']['needs']
          assert don['concurrency']['group']=='epg-source-publish'
          assert don['permissions']['contents']=='write'
          boot=yaml.load((w/'elcinema-donor-bootstrap.yml').read_text(),Loader=yaml.BaseLoader)
          assert boot['jobs']['extend']['uses']=='./.github/workflows/elcinema-daily-donors.yml'
          assert boot['jobs']['finalize']['needs']=='extend'
          print('DAILY_DONOR_SEQUENCE_VALID')
          PY
      - name: Compare real current-day published feeds without modifications
        run: |
          python tools/elcinema_daily_donors.py > /tmp/daily-elcinema-preview.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/daily-elcinema-preview.json'))
          assert data['sources_verified_for_local_day'] is True
          assert data['source_modified'] is False
          assert data['preserved_original_programmes'] is True
          assert data['generated_or_guessed_programmes']==0
          print("SOURCE_DRY_RUN", data['original_elcinema_programmes'],
                data['total_elcinema_programmes'],
                data['donor_rows_added'], data['strict_failed_before'], data['strict_failed_after'])
          PY
      - name: Verify no live ElCinema feed changed
        run: |
          git diff --exit-code -- feeds/elcinema.xml.gz feeds/elcinema.json reports/elcinema-48h-audit.json
