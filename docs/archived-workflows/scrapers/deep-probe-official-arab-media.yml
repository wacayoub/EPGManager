name: Deep probe official Arab media

on:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/deep-probe-official-arab-media.yml"
      - "tools/official_arab_media_deep_probe.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - name: Deep probe official/local/government Arab media
        run: python tools/official_arab_media_deep_probe.py
      - name: Show deep discovery matrix
        run: cat reports/official-arab-media-deep.md

      - name: Publish discovery reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/official-reports
          cp -f reports/official-arab-media-deep.* /tmp/official-reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp -f /tmp/official-reports/* reports/
            git add reports/official-arab-media-deep.*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update official-arab-media-deep report"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
