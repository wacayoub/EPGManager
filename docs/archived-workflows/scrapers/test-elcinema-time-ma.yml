name: Test ElCinema Morocco timezone

on:
  push:
    branches: [main]
    paths:
      - "config/elcinema-quick-time-trigger.txt"
      - ".github/workflows/test-elcinema-time-ma.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elcinema-time-ma-quick
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install upstream grabber
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Build five-channel quick catalogue
        run: |
          mkdir -p output/elcinema-time reports feeds/tests
          cat > output/elcinema-time/channels.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channels>
            <channel site="elcinema.com" site_id="1127" lang="ar" xmltv_id="MBC1.ae@SD">إم بي سي</channel>
            <channel site="elcinema.com" site_id="1136" lang="ar" xmltv_id="AbuDhabiTV.ae@SD">أبو ظبي</channel>
            <channel site="elcinema.com" site_id="1169" lang="ar" xmltv_id="DubaiTV.ae@SD">دبي</channel>
            <channel site="elcinema.com" site_id="1239" lang="ar" xmltv_id="MBCMasr.eg@SD">إم بي سي مصر</channel>
            <channel site="elcinema.com" site_id="1289" lang="ar" xmltv_id="RotanaCinemaKSA.sa@SD">روتانا سينما</channel>
          </channels>
          XML

      - name: Pin test parser to Africa Casablanca
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("vendor/iptv-org-epg/sites/elcinema.com/elcinema.com.config.js")
          s=p.read_text(encoding="utf-8")
          old="return dayjs.tz(time, 'YYYY-MM-DD hh:mm A', dayjs.tz.guess())"
          new="return dayjs.tz(time, 'YYYY-MM-DD hh:mm A', 'Africa/Casablanca')"
          if old not in s:
              raise SystemExit("ElCinema parser target changed upstream")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          print("TEST timezone: Africa/Casablanca")
          PY

      - name: Quick scrape five channels
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=20s 480s npm run grab --             --channels="$GITHUB_WORKSPACE/output/elcinema-time/channels.xml"             --output="$GITHUB_WORKSPACE/output/elcinema-time/raw.xml"             --days=1             --maxConnections=1             --timeout=20000             --delay=350

      - name: Inspect raw scrape and pack twelve-hour test
        shell: bash
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse("output/elcinema-time/raw.xml").getroot()
          rows=[]
          for p in root.findall("programme"):
              t=p.find("title")
              rows.append({
                  "channel":p.get("channel"),
                  "start":p.get("start"),
                  "stop":p.get("stop"),
                  "title":((t.text or "").strip() if t is not None else "")
              })
          Path("reports/elcinema-ma-raw-sample.json").write_text(
              json.dumps({"programmes":len(rows),"rows":rows},ensure_ascii=False,indent=2)+"\\n",
              encoding="utf-8"
          )
          print(json.dumps(rows,ensure_ascii=False))
          PY

          set +e
          python tools/source_feed_pack.py \
            --input output/elcinema-time/raw.xml \
            --catalogue output/elcinema-time/channels.xml \
            --output-gz feeds/tests/elcinema-ma-time-12h.xml.gz \
            --output-txt feeds/tests/elcinema-ma-time-12h.txt \
            --stats reports/elcinema-ma-time-12h.json \
            --label elcinema-ma-time-12h \
            --window-hours 12 \
            --keep-past-hours 2
          exit 0

      - name: Compare production vs Morocco-time test
        run: |
          python - <<'PY'
          import gzip,json,re
          from datetime import datetime,timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          IDS=["MBC1.ae@SD","AbuDhabiTV.ae@SD","DubaiTV.ae@SD","MBCMasr.eg@SD","RotanaCinemaKSA.sa@SD"]

          def load(path):
              b=Path(path).read_bytes()
              if b[:2]==b"\x1f\x8b": b=gzip.decompress(b)
              return ET.fromstring(b)

          def parse(v):
              m=re.match(r"^(\d{14})\s*([+-]\d{4})",v or "")
              if not m: return None
              d=datetime.strptime(m.group(1),"%Y%m%d%H%M%S")
              off=m.group(2); sign=1 if off[0]=="+" else -1
              mins=sign*(int(off[1:3])*60+int(off[3:5]))
              from datetime import timedelta
              return d.replace(tzinfo=timezone(timedelta(minutes=mins))).astimezone(timezone.utc)

          def title(p):
              n=p.find("title")
              return re.sub(r"\s+"," ",((n.text or "") if n is not None else "")).strip()

          def norm(s):
              return re.sub(r"[^0-9A-Za-z\u0600-\u06FF]+","",s or "").casefold()

          prod=load("feeds/elcinema.xml.gz")
          test=load("output/elcinema-time/raw.xml")
          pb={cid:[] for cid in IDS}; tb={cid:[] for cid in IDS}
          for p in prod.findall("programme"):
              cid=p.get("channel")
              if cid in pb: pb[cid].append(p)
          for p in test.findall("programme"):
              cid=p.get("channel")
              if cid in tb: tb[cid].append(p)

          rows=[]
          deltas=[]
          for cid in IDS:
              by_title={}
              for p in pb[cid]:
                  by_title.setdefault(norm(title(p)),[]).append(p)
              samples=[]
              for q in tb[cid]:
                  key=norm(title(q))
                  matches=by_title.get(key,[])
                  if not matches: continue
                  tq=parse(q.get("start")); 
                  if tq is None: continue
                  best=min(matches,key=lambda p:abs((parse(p.get("start"))-tq).total_seconds()) if parse(p.get("start")) else 10**12)
                  tp=parse(best.get("start"))
                  if tp is None: continue
                  delta=round((tq-tp).total_seconds()/3600,2)
                  deltas.append(delta)
                  samples.append({
                      "title":title(q),
                      "production_start_utc":tp.isoformat(),
                      "casablanca_test_start_utc":tq.isoformat(),
                      "test_minus_production_hours":delta,
                  })
                  if len(samples)>=5: break
              rows.append({"id":cid,"matched":len(samples),"samples":samples})

          report={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "test_timezone":"Africa/Casablanca",
              "production_timezone_patch":"Africa/Cairo",
              "channels":IDS,
              "matched_events":sum(r["matched"] for r in rows),
              "observed_deltas_hours":deltas,
              "dominant_delta_hours":max(set(deltas),key=deltas.count) if deltas else None,
              "rows":rows,
          }
          Path("reports/elcinema-time-compare.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Publish isolated quick-test result
        shell: bash
        run: |
          set -e
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/elcinema-ma-raw-sample.json \
                  reports/elcinema-ma-time-12h.json \
                  reports/elcinema-time-compare.json
          [ -f feeds/tests/elcinema-ma-time-12h.xml.gz ] && git add feeds/tests/elcinema-ma-time-12h.xml.gz
          [ -f feeds/tests/elcinema-ma-time-12h.txt ] && git add feeds/tests/elcinema-ma-time-12h.txt
          if git diff --cached --quiet; then
            echo "No quick-test changes."
            exit 0
          fi
          git commit -m "Publish ElCinema Morocco timezone quick test"
          git pull --rebase origin main
          git push origin HEAD:main
