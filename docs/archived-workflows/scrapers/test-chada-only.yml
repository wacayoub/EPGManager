name: Test Chada only
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: epg-feed-publish
  cancel-in-progress: false
jobs:
  test-chada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml cloudscraper
      - run: python tools/run_chada_only.py --days 2 --output-dir output/chada-only
      - run: |
          mkdir -p feeds
          cp output/chada-only/chada.xml.gz feeds/chada.xml.gz
          cp output/chada-only/chada.json feeds/chada.json
      - run: |
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/chada.xml.gz feeds/chada.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Chada only"
            git pull --rebase origin main
            git push
          fi
