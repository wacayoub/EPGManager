name: beIN single 02:22 daily scheduled scrape regression
on:
  push:
    branches: [schedule/bein-daily-casablanca-0222-20261018]
    paths:
      - '.github/workflows/refresh-bein.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-evening-casablanca.yml'
      - '.github/workflows/epg-casablanca-targeted-retry.yml'
      - 'tools/epg_schedule_policy.py'
      - 'tools/test_epg_schedule_policy.py'
      - '.github/workflows/bein-0222-schedule-ci.yml'
  pull_request:
    paths:
      - '.github/workflows/refresh-bein.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-evening-casablanca.yml'
      - '.github/workflows/epg-casablanca-targeted-retry.yml'
      - 'tools/epg_schedule_policy.py'
      - 'tools/test_epg_schedule_policy.py'
      - '.github/workflows/bein-0222-schedule-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm no extra beIN retry even for missing feed
        run: python -m unittest tools.test_epg_schedule_policy -v
      - name: Audit all beIN auto triggers without running the scraper
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          import yaml
          def get(x):
              return yaml.load(Path('.github/workflows/'+x).read_text(), Loader=yaml.BaseLoader)
          bein=get('refresh-bein.yml')
          chain=get('daily-epg-chain.yml')
          eve=get('epg-evening-casablanca.yml')
          retry=get('epg-casablanca-targeted-retry.yml')
          manual=get('daily-source-refresh.yml')
          core=get('refresh-source-core.yml')
          policy=__import__('tools.epg_schedule_policy',fromlist=['TARGETS'])
          assert bein['on']['schedule']==[{
              'cron':'22 2 * * *','timezone':'Etc/GMT'}]
          assert bein['jobs']['refresh']['with']=={'source':'bein','scheduled':'false'}
          assert bein['jobs']['refresh']['uses']=='./.github/workflows/refresh-source-core.yml'
          assert 'workflow_dispatch' in bein['on']
          assert 'push' not in bein['on']
          assert 'bein' not in chain['jobs']
          assert set(chain['jobs'])=={'elcinema_extend','finalize'}
          assert 'morocco' not in chain['jobs'] and 'shahid' not in chain['jobs']
          assert eve['jobs']['sports']['strategy']['matrix']['source']==['alkass']
          assert 'bein' not in policy.TARGETS
          assert policy.TARGETS==('shahid',)
          assert 'osn' not in chain['jobs']
          assert 'sport24' not in chain['jobs']
          assert 'schedule' not in retry['on']
          assert get('refresh-shahid.yml')['on']['schedule']==[{'cron':'39 3 * * *','timezone':'Etc/GMT'}]
          assert 'matrix.source' in retry['jobs']['retry']['with']['source']
          assert 'schedule' not in manual['on']
          assert 'schedule' not in core['on']
          assert 'schedule' not in get('daily-epg.yml')['on']
          assert get('refresh-elcinema.yml')['on']['schedule']==[{
              'cron':'20 1 * * *','timezone':'Etc/GMT'}]
          tz=ZoneInfo('Etc/GMT')
          for date in [(2026,10,18),(2026,12,3),(2027,4,15)]:
              local=datetime(*date,2,22,tzinfo=tz)
              utc=local.astimezone(timezone.utc)
              assert (utc.hour,utc.minute)==(2,22),(date,utc)
              print('BEIN_LOCAL_TRIGGER',local.isoformat(),'UTC',utc.isoformat())
          print('BEIN_ONE_DAILY_AUTOMATIC_SCRAPER: PASS')
          print('BEIN_SECONDARY_SCRAPES_07H15_15H00_19H30: DISABLED')
          PY
