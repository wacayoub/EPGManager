name: STC sole daily 05:55 fixed GMT+0 - no 07:15 duplicate
on:
  push:
    branches: [schedule/stctv-0555-fixed-gmt0-only-20261018]
    paths:
      - '.github/workflows/refresh-stctv.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/stctv-0555-gmt0-schedule-ci.yml'
      - 'tools/test_epg_casablanca_workflows.py'
  pull_request:
    paths:
      - '.github/workflows/refresh-stctv.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/stctv-0555-gmt0-schedule-ci.yml'
      - 'tools/test_epg_casablanca_workflows.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test source schedule and chain unit tests
        run: python -m unittest tools.test_epg_schedule_policy tools.test_epg_casablanca_workflows -v
      - name: Verify single STC clock and unaffected other sources
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import yaml
          wf=Path(".github/workflows")
          def load(name):
              return yaml.load((wf/name).read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          stc=load("refresh-stctv.yml")
          chain=load("daily-epg-chain.yml")
          assert stc["on"]["schedule"]==[
              {"cron":"55 5 * * *","timezone":"Etc/GMT"}]
          assert "workflow_dispatch" in stc["on"] and "push" not in stc["on"]
          assert stc["jobs"]["refresh"]["uses"]=="./.github/workflows/refresh-source-core.yml"
          assert stc["jobs"]["refresh"]["with"]=={"source":"stctv","scheduled":"false"}
          assert chain["on"]["schedule"]==[
              {"cron":"15 7 * * *","timezone":"Etc/GMT"}]
          assert "stctv" not in chain["jobs"]
          assert chain["jobs"]["elcinema_extend"].get("needs") is None
          assert chain["jobs"]["finalize"]["needs"]=="elcinema_extend"
          assert set(chain["jobs"])=={"elcinema_extend","finalize"}
          for name,cron in [
              ("refresh-elcinema.yml","20 1 * * *"),
              ("refresh-osn.yml","40 1 * * *"),
              ("refresh-bein.yml","22 2 * * *"),
              ("refresh-sport24.yml","5 3 * * *"),
              ("refresh-shahid.yml","39 3 * * *"),
              ("refresh-aljazeera.yml","12 4 * * *"),
              ("refresh-dubaiplus.yml","44 4 * * *"),
              ("refresh-starzplay.yml","12 5 * * *")]:
              assert load(name)["on"]["schedule"]==[
                  {"cron":cron,"timezone":"Etc/GMT"}],name
          e=load("epg-evening-casablanca.yml")
          assert e["jobs"]["sports"]["strategy"]["matrix"]["source"]==["alkass"]
          assert e["jobs"]["morocco"]["with"]["source"]=="morocco"
          assert "schedule" not in load("epg-casablanca-targeted-retry.yml")["on"]
          assert "schedule" not in load("refresh-source-core.yml")["on"]
          tz=ZoneInfo("Etc/GMT")
          for (y,m,d) in [(2026,10,19),(2026,12,15),(2027,2,19),(2027,4,18)]:
              utc=datetime(y,m,d,5,55,tzinfo=tz).astimezone(timezone.utc)
              assert (utc.hour,utc.minute)==(5,55)
          print("STC_SOLE_0555_FIXED_GMT0_SCHEDULE_OK")
          print("STC_0715_DUPLICATE_ABSENT_AND_ALKASS_SEQUENCE_INTACT")
          print("ALL_OTHER_SOURCE_CLOCKS_UNCHANGED")
          PY
