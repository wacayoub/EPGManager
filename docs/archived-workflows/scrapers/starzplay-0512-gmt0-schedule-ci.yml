name: STARZPLAY sole 05:12 fixed GMT+0 schedule - no duplicate auto scrape
on:
  push:
    branches: [schedule/starzplay-fixed-gmt0-0512-one-daily-20261018]
    paths:
      - '.github/workflows/refresh-starzplay.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/starzplay-0512-gmt0-schedule-ci.yml'
      - 'tools/test_epg_casablanca_workflows.py'
  pull_request:
    paths:
      - '.github/workflows/refresh-starzplay.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/starzplay-0512-gmt0-schedule-ci.yml'
      - 'tools/test_epg_casablanca_workflows.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Test source scheduling policy, chain and GMT0 rules
        run: python -m unittest tools.test_epg_schedule_policy tools.test_epg_casablanca_workflows -v
      - name: Check sole STARZPLAY trigger, no change-based auto refresh, and chain intact
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import yaml
          wf=Path(".github/workflows")
          def load(name):
              return yaml.load((wf/name).read_text(),Loader=yaml.BaseLoader)
          play=load("refresh-starzplay.yml")
          chain=load("daily-epg-chain.yml")
          assert play["on"]["schedule"]==[
              {"cron":"12 5 * * *","timezone":"Etc/GMT"}]
          assert "workflow_dispatch" in play["on"]
          assert "push" not in play["on"]
          assert play["jobs"]["refresh"]["uses"]=="./.github/workflows/refresh-source-core.yml"
          assert play["jobs"]["refresh"]["with"]=={"source":"starzplay","scheduled":"false"}
          assert chain["on"]["schedule"]==[{"cron":"15 7 * * *","timezone":"Etc/GMT"}]
          assert "starzplay" not in chain["jobs"]
          assert chain["jobs"]["elcinema_extend"].get("needs") is None
          assert chain["jobs"]["finalize"]["needs"]=="elcinema_extend"
          assert set(chain["jobs"])=={"elcinema_extend","finalize"}
          for name,cron in [
              ("refresh-elcinema.yml","20 1 * * *"),
              ("refresh-osn.yml","40 1 * * *"),
              ("refresh-bein.yml","22 2 * * *"),
              ("refresh-sport24.yml","5 3 * * *"),
              ("refresh-shahid.yml","39 3 * * *"),
              ("refresh-aljazeera.yml","12 4 * * *"),
              ("refresh-dubaiplus.yml","44 4 * * *")]:
              assert load(name)["on"]["schedule"]==[
                  {"cron":cron,"timezone":"Etc/GMT"}],name
          assert load("epg-evening-casablanca.yml")["jobs"]["sports"]["strategy"]["matrix"]["source"]==["alkass"]
          assert "schedule" not in load("epg-casablanca-targeted-retry.yml")["on"]
          assert "schedule" not in load("daily-source-refresh.yml")["on"]
          assert "schedule" not in load("refresh-source-core.yml")["on"]
          zone=ZoneInfo("Etc/GMT")
          for date in [(2026,10,19),(2026,12,15),(2027,2,20),(2027,4,18)]:
              actual=datetime(*date,5,12,tzinfo=zone).astimezone(timezone.utc)
              assert (actual.hour,actual.minute)==(5,12),date
          print("STARZPLAY_SOLE_GMT0_0512_DAILY: PASS")
          print("STARZPLAY_CODE_PUSH_AND_0715_CHAIN_DUPLICATES: ABSENT")
          print("REST_OF_GMT0_SOURCE_SCHEDULE_AND_TUNISIA_FIRST_CHAIN: PRESERVED")
          print("NO_VU_PLUS_CHANGES")
          PY
