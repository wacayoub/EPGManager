name: Probe STARZPLAY MediaService EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-starzplay-new-api.yml"

permissions:
  contents: write

concurrency:
  group: probe-starzplay-mediaservice-epg
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe public MediaService EPG
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          bases = [
              "https://epg.aws.playco.com/api",
              "https://sp-new-api.aws.playco.com/api",
              "https://app-api.starzplay.com/api/media",
              "https://api.aws.playco.com/api",
          ]
          versions = ["v1.1", "v1.0", "v2.0"]
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
              "Client-Type": "Android",
              "Accept": "application/json",
              "Accept-Language": "ar-MA,ar;q=0.9,en;q=0.7",
              "x-geo-country": "MA",
          }

          def get(url, timeout=20):
              req=urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      b=r.read(3_000_000)
                      return r.status,r.headers.get("content-type",""),b
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("content-type","") if e.headers else "",e.read(300_000)
              except Exception as e:
                  return 0,"",str(e).encode()

          rows=[]
          payloads={}
          for base in bases:
              for version in versions:
                  url=f"{base}/{version}/epg/channel/config"
                  status,ctype,body=get(url)
                  row={
                      "base":base,"version":version,"kind":"channel_config","url":url,
                      "status":status,"content_type":ctype,"bytes":len(body),
                      "sample":body[:1800].decode("utf-8","replace"),
                  }
                  if status==200:
                      try:
                          obj=json.loads(body)
                          row["json_type"]=type(obj).__name__
                          payloads[f"{base}|{version}|channel_config"]=obj
                      except Exception as e:
                          row["json_error"]=str(e)
                  rows.append(row)
                  time.sleep(.5)

          out={
              "generated_utc":datetime.now(timezone.utc).isoformat(),
              "country":"MA",
              "headers_profile":"STARZPLAY Android public metadata profile",
              "rows":rows,
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/starzplay-mediaservice-probe.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("reports/starzplay-mediaservice-payloads.json").write_text(
              json.dumps(payloads,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-mediaservice-probe.json reports/starzplay-mediaservice-payloads.json
          git commit -m "diagnostic: probe STARZPLAY MediaService EPG" || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
