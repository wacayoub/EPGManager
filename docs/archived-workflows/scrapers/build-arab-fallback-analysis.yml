name: Build Arab fallback analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/build-arab-fallback-analysis.yml"
      - "tools/build_arab_fallback_analysis.py"
      - "config/arab-fallback-sources.json"

concurrency:
  group: arab-fallback-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Build EPGShare + OpenEPG Arab analysis packs
        run: python tools/build_arab_fallback_analysis.py

      - name: Validate analysis outputs
        run: |
          python - <<'PY'
          import csv, gzip, json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("epgshare","openepg"):
              p=Path(f"analysis/arab-fallback/{name}.xml.gz")
              if p.exists():
                  root=ET.fromstring(gzip.decompress(p.read_bytes()))
                  assert root.tag=="tv"
                  print(name,"channels",len(root.findall("channel")),"programmes",len(root.findall("programme")))

          h=json.load(open("reports/arab-fallback-health.json",encoding="utf-8"))
          print("production covered",h["production_ids_with_future_epg"])
          print("fallback rows",h["fallback_rows_total"])
          print("rescue rows",h["rescue_rows_not_currently_covered"])

          with open("reports/arab-fallback-candidates.csv",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==h["rescue_rows_not_currently_covered"]
          PY
          cat reports/arab-fallback-health.md

      - name: Stage generated analysis
        run: |
          mkdir -p /tmp/arab-fallback-publish/analysis/arab-fallback /tmp/arab-fallback-publish/reports
          cp -f analysis/arab-fallback/*.xml.gz /tmp/arab-fallback-publish/analysis/arab-fallback/ 2>/dev/null || true
          cp -f reports/arab-fallback-* /tmp/arab-fallback-publish/reports/

      - name: Publish analysis artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p analysis/arab-fallback reports
            cp -f /tmp/arab-fallback-publish/analysis/arab-fallback/*.xml.gz analysis/arab-fallback/ 2>/dev/null || true
            cp -f /tmp/arab-fallback-publish/reports/arab-fallback-* reports/
            git add analysis/arab-fallback reports/arab-fallback-*
            if git diff --cached --quiet; then
              echo "No analysis changes to publish"
              exit 0
            fi
            git commit -m "Update Arab fallback EPG analysis"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retrying ($attempt/3)"
            sleep $((attempt * 2))
          done
          exit 1
