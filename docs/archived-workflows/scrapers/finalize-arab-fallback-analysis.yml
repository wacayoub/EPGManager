name: Finalize Arab fallback analysis

on:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/finalize-arab-fallback-analysis.yml"
      - "tools/finalize_arab_fallback_analysis.py"
      - "reports/arab-fallback-all-channels.csv"
      - "reports/unmapped-arab-fallback.csv"
      - "reports/arab-fallback-health.json"
      - "reports/rotana-art-programmes.json"
  workflow_dispatch:

concurrency:
  group: finalize-arab-fallback-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Finalize duplicates, blacklist and new IDs
        run: python tools/finalize_arab_fallback_analysis.py
      - name: Show final summary
        run: |
          cat reports/arab-fallback-final-analysis.md
          echo
          echo "First 80 new IDs:"
          head -n 80 reports/new-arab-epg-ids.txt
          echo
          echo "First 80 zero-EPG blacklist rows:"
          head -n 81 reports/arab-fallback-zero-epg-blacklist.csv
      - name: Stage reports
        run: |
          mkdir -p /tmp/final-arab/reports
          cp -f reports/arab-fallback-final-analysis.* /tmp/final-arab/reports/
          cp -f reports/arab-fallback-duplicate-decisions.csv /tmp/final-arab/reports/
          cp -f reports/arab-fallback-zero-epg-blacklist.csv /tmp/final-arab/reports/
          cp -f reports/arab-fallback-source-blacklist.json /tmp/final-arab/reports/
          cp -f reports/new-arab-epg-ids.* /tmp/final-arab/reports/
          cp -f reports/arab-fallback-already-covered.csv /tmp/final-arab/reports/
          cp -f reports/arab-fallback-language-audit.csv /tmp/final-arab/reports/
      - name: Publish final analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp -f /tmp/final-arab/reports/* reports/
            git add reports/arab-fallback-final-analysis.* reports/arab-fallback-duplicate-decisions.csv reports/arab-fallback-zero-epg-blacklist.csv reports/arab-fallback-source-blacklist.json reports/new-arab-epg-ids.* reports/arab-fallback-already-covered.csv reports/arab-fallback-language-audit.csv
            if git diff --cached --quiet; then
              echo "No final analysis changes"
              exit 0
            fi
            git commit -m "Update Arab fallback duplicate and blacklist analysis"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
