name: Probe Rotana ART programmes

on:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/probe-rotana-art-programmes.yml"
      - "tools/rotana_art_schedule_probe.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - name: Probe Rotana and ART programmes
        run: python tools/rotana_art_schedule_probe.py
      - name: Show results
        run: cat reports/rotana-art-programmes.csv
      - name: Publish reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rotana-art
          cp -f reports/rotana-art-programmes.* /tmp/rotana-art/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp -f /tmp/rotana-art/* reports/
            git add reports/rotana-art-programmes.*
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Rotana ART programme samples"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
