name: OSN exact-ID genuine EPG mapping readiness (read-only)
on:
  push:
    branches: [fix/osn-verified-per-id-mapping-health-20261018]
    paths:
      - 'tools/osn_per_id_health.py'
      - 'tools/test_osn_per_id_health.py'
      - 'tools/refresh_one_source.sh'
      - '.github/workflows/osn-per-id-health-ci.yml'
  pull_request:
    paths:
      - 'tools/osn_per_id_health.py'
      - 'tools/test_osn_per_id_health.py'
      - 'tools/refresh_one_source.sh'
      - '.github/workflows/osn-per-id-health-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit regressions and source refresh shell safety
        run: |
          python -m unittest tools.test_osn_per_id_health -v
          bash -n tools/refresh_one_source.sh
      - name: Inspect exact published OSN feed, no publication or mapping changes
        run: |
          python tools/osn_per_id_health.py --output /tmp/osn-real-id-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/osn-real-id-health.json').read_text())
          m=json.loads(Path('feeds/osn.json').read_text())
          assert r['source_sha256']==m['sha256']
          assert r['catalogue_channels']==m['channels']==101
          assert r['programme_rows_unchanged']==m['programmes']
          assert r['synthetic_programmes_added']==0
          assert len(r['ids'])==101
          assert len(r['missing_ids'])==r['counts']['NO_EPG']
          assert len(set(x['xmltv_id'] for x in r['ids']))==len(r['ids'])
          assert r['counts']['NO_EPG']>=len(m['zero_epg_ids'])
          assert set(m['zero_epg_ids'])<=set(r['missing_ids'])
          assert not [x for x in r['ids'] if x['status']=='NO_EPG' and x['best_match_green_allowed']]
          assert all(x['manual_mapping_visible'] for x in r['ids'])
          # Detail REVIEW rows against the pinned published OSN feed.
          # Reporting only: never synthesize guide rows or modify mappings.
          review=[x for x in r['ids'] if x['status']=='REVIEW']
          assert len(review)==r['counts']['REVIEW']
          assert all(not x['best_match_green_allowed'] for x in review)
          assert all(x['manual_mapping_visible'] for x in review)
          for x in sorted(review,key=lambda row:row['xmltv_id'].casefold()):
              print('OSN_REVIEW_PER_ID',json.dumps({
                  'id':x['xmltv_id'],
                  'reason':x['reason'],
                  'future_programmes':x['future_programmes'],
                  'continuous_future_hours':x['continuous_future_hours'],
                  'currently_on_air':x['currently_on_air'],
                  'suspected_placeholder_future':x['suspected_placeholder_future'],
                  'green_allowed':x['best_match_green_allowed'],
                  'source_sha256':r['source_sha256'],
              },ensure_ascii=False,sort_keys=True))
          print('OSN_REAL_SOURCE_PER_ID_PASS',r['catalogue_channels'],r['counts'])
          print('OSN_ZERO_GUIDES_NOT_GREEN',len(r['missing_ids']))
          PY
