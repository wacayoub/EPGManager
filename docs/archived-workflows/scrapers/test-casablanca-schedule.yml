name: Casablanca EPG schedule safety (non-deploying)

on:
  push:
    branches: [feature/casablanca-adaptive-scrape-schedule-20261015]
    paths:
      - "tools/epg_schedule_policy.py"
      - "tools/test_epg_schedule_policy.py"
      - "tools/test_epg_casablanca_workflows.py"
      - ".github/workflows/daily-epg-chain.yml"
      - ".github/workflows/epg-watchdog.yml"
      - ".github/workflows/epg-casablanca-targeted-retry.yml"
      - ".github/workflows/epg-evening-casablanca.yml"
      - ".github/workflows/test-casablanca-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile policy and regression tests
        run: python -m py_compile tools/epg_schedule_policy.py tools/test_epg_schedule_policy.py tools/test_epg_casablanca_workflows.py
      - name: Verify dates, cron offsets, source filters, guardrails
        run: python -m unittest tools.test_epg_schedule_policy tools.test_epg_casablanca_workflows -v
      - name: Check GitHub workflow expressions with current actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            --output /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash
          ./actionlint -color \
            .github/workflows/daily-epg-chain.yml \
            .github/workflows/epg-watchdog.yml \
            .github/workflows/epg-casablanca-targeted-retry.yml \
            .github/workflows/epg-evening-casablanca.yml
      - name: Parse Casablanca scheduled workflows and manual-only retry YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ("daily-epg-chain.yml", "epg-watchdog.yml", "epg-evening-casablanca.yml", "refresh-shahid.yml", "refresh-sport24.yml"):
              p = Path(".github/workflows") / name
              d = yaml.load(p.read_text(), Loader=yaml.BaseLoader)
              assert "on" in d and "jobs" in d and d["on"]["schedule"]
              for item in d["on"]["schedule"]:
                  assert item["timezone"] == "Etc/GMT"
              print(name, "SCHEDULE_VALID")
          retry = yaml.load(Path(".github/workflows/epg-casablanca-targeted-retry.yml").read_text(), Loader=yaml.BaseLoader)
          assert "schedule" not in retry["on"]
          assert "workflow_dispatch" in retry["on"]
          print("SHAHID_1500_RETRY_MANUAL_ONLY")
          PY
