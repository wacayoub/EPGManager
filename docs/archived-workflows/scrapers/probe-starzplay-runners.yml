name: Probe STARZPLAY GitHub runner egress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-starzplay-runners.yml"

permissions:
  contents: write

concurrency:
  group: probe-starzplay-runners
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe public STARZPLAY endpoints
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from pathlib import Path

          urls = [
              "https://www.starzplay.com/ar/live?selectcountry=MA&selectcity=Casablanca",
              "https://starzplay.com/ar/live?selectcountry=MA&selectcity=Casablanca",
              "https://sp-new-api.aws.playco.com/api/epg/channel/config",
              "https://api.aws.playco.com/api/epg/channel/config",
              "https://static-api.aws.playco.com/api/epg/channel/config",
              "https://stg-static-api.aws.playco.com/api/epg/channel/config",
              "https://sp-nms-api.aws.playco.com/api/epg/channel/config",
              "https://starzplay-prod-ssl.akamaized.net/prd-peg-data/default/configs/profiles-screen.json",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
              "Accept": "application/json,text/html;q=0.9,*/*;q=0.8",
              "Accept-Language": "ar-MA,ar;q=0.9,en;q=0.7",
              "Referer": "https://www.starzplay.com/",
              "Origin": "https://www.starzplay.com",
              "x-geo-country": "MA",
          }
          rows=[]
          for url in urls:
              req=urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body=r.read(4096)
                      rows.append({
                          "url": url,
                          "status": r.status,
                          "final_url": r.geturl(),
                          "content_type": r.headers.get("content-type",""),
                          "sample_bytes": len(body),
                          "sample": body[:400].decode("utf-8","replace").replace("\n"," ")[:400],
                      })
              except urllib.error.HTTPError as e:
                  body=e.read(2048)
                  rows.append({
                      "url": url,
                      "status": e.code,
                      "final_url": getattr(e, "url", url),
                      "content_type": e.headers.get("content-type","") if e.headers else "",
                      "sample_bytes": len(body),
                      "sample": body[:300].decode("utf-8","replace").replace("\n"," ")[:300],
                  })
              except Exception as e:
                  rows.append({"url":url,"status":"ERROR","error":str(e)[:300]})
              time.sleep(2)

          out={
              "runner": os.environ.get("RUNNER_LABEL"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "rows": rows,
              "policy": "public metadata endpoints only; no auth, DRM or CAPTCHA bypass",
          }
          Path("reports").mkdir(exist_ok=True)
          name=os.environ.get("RUNNER_LABEL","runner").replace("-","_")
          path=Path("reports")/f"starzplay-runner-probe-{name}.json"
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Publish runner report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-runner-probe-*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "diagnostic: STARZPLAY egress on ${{ matrix.os }}"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
