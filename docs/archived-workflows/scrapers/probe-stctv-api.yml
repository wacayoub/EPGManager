name: Probe STC TV public metadata API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-stctv-api.yml"
      - "tools/stctv_api_probe.py"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Probe public STC TV metadata APIs
        run: python tools/stctv_api_probe.py
