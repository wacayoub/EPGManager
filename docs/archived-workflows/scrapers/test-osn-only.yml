name: Test OSN only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-osn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scraper repository
        uses: actions/checkout@v4

      - name: Checkout iptv-org EPG adapters
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install upstream grabber
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Build OSN Arabic and English catalogues
        run: |
          python tools/build_catalogues.py
          echo "Arabic catalogue rows:"
          grep -c '<channel ' output/source-build/osn.channels.xml
          echo "English catalogue rows:"
          grep -c '<channel ' output/source-build/osn_en.channels.xml

      - name: Grab OSN Arabic guide
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 1200s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/osn.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/osn-test.ar.xml" \
            --days=2 \
            --maxConnections=1 \
            --timeout=20000

      - name: Grab OSN English guide
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 1200s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/osn_en.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/osn-test.en.xml" \
            --days=2 \
            --maxConnections=1 \
            --timeout=20000

      - name: Build OSN hybrid guide
        run: |
          python tools/osn_hybrid.py \
            --arabic output/osn-test.ar.xml \
            --english output/osn-test.en.xml \
            --policy config/osn-language-policy.json \
            --mode hybrid \
            --output output/osn-test.hybrid.xml \
            --report output/osn-hybrid-report.json

      - name: Audit all OSN IDs and language policy
        run: |
          python - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          AR=re.compile(r"[\u0600-\u06FF]")
          cat=ET.parse("output/source-build/osn.channels.xml").getroot()
          raw=ET.parse("output/osn-test.hybrid.xml").getroot()
          by={}
          for p in raw.findall("programme"):
              by.setdefault((p.get("channel") or "").strip(),[]).append(p)
          policy=json.loads(Path("config/osn-language-policy.json").read_text(encoding="utf-8"))
          hybrid=set(policy["hybrid_ids"])
          arabic_native=set(policy["arabic_native_ids"])
          def txt(p,tag):
              n=p.find(tag)
              return ((n.text or "").strip() if n is not None else "")
          def pct(vals,pred):
              vals=[x for x in vals if x]
              return round(100*sum(1 for x in vals if pred(x))/len(vals),1) if vals else 0.0
          rows=[]
          for c in cat.findall("channel"):
              cid=(c.get("xmltv_id") or c.get("id") or "").strip()
              name=(c.text or "").strip()
              progs=by.get(cid,[])
              titles=[txt(p,"title") for p in progs]
              descs=[txt(p,"desc") for p in progs]
              profile="hybrid" if cid in hybrid else "arabic_native"
              rows.append({
                  "id":cid,"name":name,"profile":profile,"programmes":len(progs),
                  "title_ar_pct":pct(titles,lambda x: bool(AR.search(x))),
                  "desc_ar_pct":pct(descs,lambda x: bool(AR.search(x))),
                  "desc_coverage_pct":round(100*sum(1 for x in descs if x)/len(progs),1) if progs else 0.0
              })
          summary={
              "catalogue_ids":len(rows),
              "ids_with_epg":sum(r["programmes"]>0 for r in rows),
              "zero_epg":sum(r["programmes"]==0 for r in rows),
              "hybrid_ids":sum(r["profile"]=="hybrid" for r in rows),
              "arabic_native_ids":sum(r["profile"]=="arabic_native" for r in rows),
              "rows":rows,
          }
          Path("output/osn-test-report.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({k:v for k,v in summary.items() if k!="rows"},ensure_ascii=False))
          focus={
              "OSNComedy.ae@SD","CNNInternational.us@MENA","BloombergTV.us@MiddleEast",
              "NickelodeonArabia.ae@SD","OSNMoviesPremiere.ae@SD",
              "OSNYahala.ae@SD","OSNYahalaAflam.ae@SD","OSNYahalaBilArabi.ae@SD",
              "AlarabiyaPortrait.ae@SD","AbuDhabiTV.ae@SD"
          }
          for r in rows:
              if r["id"] in focus:
                  print("[LANG]",json.dumps(r,ensure_ascii=False))
          PY

      - name: Upload OSN hybrid test report
        uses: actions/upload-artifact@v4
        with:
          name: osn-hybrid-80-id-test
          path: |
            output/osn-test-report.json
            output/osn-hybrid-report.json
            output/osn-test.hybrid.xml
            output/source-build/osn.channels.xml
            output/source-build/osn_en.channels.xml
