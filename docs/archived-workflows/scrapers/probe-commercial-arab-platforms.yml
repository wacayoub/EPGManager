name: Probe commercial Arab EPG platforms

on:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/probe-commercial-arab-platforms.yml"
      - "tools/commercial_arab_platform_probe.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - name: Probe Shahid GOBX MBCNOW STARZPLAY STC TV
        run: python tools/commercial_arab_platform_probe.py
      - name: Show results
        run: cat reports/commercial-arab-platforms.md
      - name: Publish reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commercial-reports
          cp -f reports/commercial-arab-platforms.* /tmp/commercial-reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp -f /tmp/commercial-reports/* reports/
            git add reports/commercial-arab-platforms.*
            if git diff --cached --quiet; then
              echo "No report changes"
              exit 0
            fi
            git commit -m "Update commercial Arab platform discovery"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
