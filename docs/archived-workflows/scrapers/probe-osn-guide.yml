name: Probe OSN official guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/osn-probe-trigger.txt"

permissions:
  contents: write

concurrency:
  group: osn-guide-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Inspect official OSN guide frontend
        run: python tools/osn_frontend_probe.py

      - name: Publish probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OSN Guide Probe"
          git config user.email "actions@users.noreply.github.com"
          git add reports/osn-frontend-probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "OSN official guide frontend probe"
          for n in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 2))
          done
          exit 1
