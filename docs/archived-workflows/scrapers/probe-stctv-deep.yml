name: Deep probe STC TV metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-stctv-deep.yml"
      - "tools/stctv_deep_probe.py"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - name: Inspect STC TV public metadata bundle
        run: python tools/stctv_deep_probe.py
