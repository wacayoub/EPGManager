name: Probe STARZPLAY remote config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-starzplay-remote-config.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and sanitize public remote config
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path
          urls=[
            "https://mena-cdn-lb.aws.playco.com/prd-peg-data/default/configs/remote-configs.json",
            "https://starzplay-prod-ssl.akamaized.net/prd-peg-data/default/configs/remote-configs.json",
          ]
          headers={"User-Agent":"Mozilla/5.0 (Linux; Android 16)","Accept":"application/json"}
          rows=[]
          keep_re=re.compile(r'(api|url|base|epg|nms|version|media|live|channel)',re.I)
          secret_re=re.compile(r'(secret|token|password|auth|key|license|drm|widevine|pin)',re.I)

          def sanitize(v, path=""):
            if isinstance(v, dict):
              out={}
              for k,x in v.items():
                kp=f"{path}.{k}" if path else str(k)
                if secret_re.search(str(k)):
                  continue
                sv=sanitize(x,kp)
                if sv is not None and (keep_re.search(str(k)) or isinstance(sv,(dict,list))):
                  if isinstance(sv,dict) and not sv: continue
                  if isinstance(sv,list) and not sv: continue
                  out[k]=sv
              return out
            if isinstance(v,list):
              arr=[sanitize(x,path) for x in v]
              return [x for x in arr if x not in (None,{},[])]
            if isinstance(v,(str,int,float,bool)) and keep_re.search(path):
              return v
            return None

          for url in urls:
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(3_000_000)
                row={"url":url,"status":r.status,"content_type":r.headers.get("content-type",""),"bytes":len(body)}
                try:
                  data=json.loads(body)
                  row["filtered"]=sanitize(data)
                except Exception as e:
                  row["parse_error"]=str(e)
                  row["sample"]=body[:500].decode("utf-8","replace")
            except urllib.error.HTTPError as e:
              row={"url":url,"status":e.code,"sample":e.read(500).decode("utf-8","replace")}
            except Exception as e:
              row={"url":url,"status":"ERROR","error":str(e)}
            rows.append(row)
          Path("reports").mkdir(exist_ok=True)
          p=Path("reports/starzplay-remote-config.json")
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(p.read_text())
          PY

      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-remote-config.json
          git commit -m "diagnostic: inspect STARZPLAY remote config" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
