name: Probe STARZPLAY mobile public EPG endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-starzplay-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starzplay-mobile-endpoint-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests

      - name: Test official public hosts
        shell: bash
        run: |
          python - <<'PY'
          import json,requests
          from pathlib import Path
          urls=[
            'https://www.starzplay.com/ar/live?selectcountry=MA&selectcity=Casablanca',
            'https://www.starzplay.com/en/live?selectcountry=MA&selectcity=Casablanca',
            'https://starzplay.com/ar/live?selectcountry=MA&selectcity=Casablanca',
            'https://starzplay.com/en/live?selectcountry=MA&selectcity=Casablanca',
            'https://m.starzplay.com/',
          ]
          uas={
            'desktop':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'android':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36',
          }
          rows=[]
          for u in urls:
              for mode,ua in uas.items():
                  try:
                      r=requests.get(u,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8','Accept-Language':'ar,en;q=0.8'},timeout=15,allow_redirects=True)
                      rows.append({'url':u,'ua':mode,'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'server':r.headers.get('server','')})
                  except Exception as e:
                      rows.append({'url':u,'ua':mode,'status':'ERROR','error':str(e)[:250]})
          Path('reports').mkdir(exist_ok=True)
          Path('reports/starzplay-alt-hosts.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - name: Download latest public STARZPLAY package
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/starzplay reports
          curl -fL --retry 1 --connect-timeout 20 --max-time 180             'https://d.apkpure.net/b/XAPK/com.parsifal.starz?version=latest'             -o /tmp/starzplay/starzplay.xapk
          rc=$?
          if [ "$rc" -eq 0 ] && [ -s /tmp/starzplay/starzplay.xapk ]; then
            unzip -q /tmp/starzplay/starzplay.xapk -d /tmp/starzplay/xapk || true
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract public metadata endpoint candidates
        if: steps.apk.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from urllib.parse import urlparse
          root=Path('/tmp/starzplay/xapk')
          apks=sorted(root.rglob('*.apk'))
          url_re=re.compile(r'https?://[^\s"\'<>\\]{5,600}',re.I)
          hint=re.compile(r'(starz|api|epg|guide|schedule|program|programme|channel|live|content|graphql)',re.I)
          sensitive=re.compile(r'(token=|authorization|bearer|password|secret|license|widevine|drm|payment)',re.I)
          urls=[]; lines=[]
          scan_files=[]
          unpack_root=Path('/tmp/apk-deep')
          unpack_root.mkdir(parents=True,exist_ok=True)
          for idx,apk in enumerate(apks):
              dest=unpack_root/str(idx)
              dest.mkdir(parents=True,exist_ok=True)
              subprocess.run(['unzip','-q','-o',str(apk),'-d',str(dest)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              scan_files.extend([p for p in dest.rglob('*') if p.is_file() and (p.suffix in {'.dex','.xml','.json','.arsc','.properties','.txt'} or p.name in {'AndroidManifest.xml'})])
          scan_files.extend(apks)
          route_re=re.compile(r'(?:"|\'|^)(/[A-Za-z0-9_./?={}&%:+-]{3,250})(?:"|\'|$)')
          routes=[]
          for scan in scan_files:
              p=subprocess.run(['strings','-a','-n','4',str(scan)],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,errors='ignore')
              for line in p.stdout.splitlines():
                  if hint.search(line) and not sensitive.search(line):
                      s=line.strip()
                      if 4 < len(s) <= 700: lines.append(s)
                  for u in url_re.findall(line):
                      u=u.rstrip(').,;]')
                      if hint.search(u) and not sensitive.search(u): urls.append(u)
                  for route in route_re.findall(line):
                      if hint.search(route) and not sensitive.search(route) and len(route) < 260:
                          routes.append(route)
          def uniq(xs):
              out=[];seen=set()
              for x in xs:
                  if x not in seen:
                      seen.add(x);out.append(x)
              return out
          urls=uniq(urls)[:700];lines=uniq(lines)[:1400];routes=uniq(routes)[:1200]
          hosts=[]
          for u in urls:
              try:
                  h=urlparse(u).hostname
                  if h: hosts.append(h)
              except Exception: pass
          report={'apk_count':len(apks),'candidate_hosts':uniq(hosts),'candidate_urls':urls,'candidate_routes':routes,'keyword_strings':lines,'policy':'public app static analysis only; credentials/auth/DRM data excluded'}
          Path('reports/starzplay-mobile-endpoints.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'apk_count':len(apks),'hosts':report['candidate_hosts'],'url_count':len(urls),'route_count':len(routes),'keyword_count':len(lines)},ensure_ascii=False,indent=2))
          PY

      - name: Probe only unauthenticated public metadata candidates
        if: steps.apk.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from urllib.parse import urlparse
          data=json.loads(Path('reports/starzplay-mobile-endpoints.json').read_text())
          hints=re.compile(r'(epg|guide|schedule|program|programme|channel|listing|live)',re.I)
          sensitive=re.compile(r'(login|signin|oauth|token|account|payment|license|drm|widevine)',re.I)
          urls=[];seen=set()
          for u in data.get('candidate_urls',[]):
              try:p=urlparse(u)
              except Exception:continue
              if p.scheme not in ('http','https') or not p.hostname:continue
              if not hints.search(u) or sensitive.search(u):continue
              if u in seen:continue
              seen.add(u);urls.append(u)
              if len(urls)>=20:break
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Accept':'application/json,text/plain,*/*','Accept-Language':'ar,en;q=0.8'})
          rows=[]
          for u in urls:
              try:
                  r=s.get(u,timeout=15,allow_redirects=True)
                  ct=r.headers.get('content-type','')
                  sample=re.sub(r'\s+',' ',r.text[:1000]).strip() if ('json' in ct or 'text' in ct) else ''
                  rows.append({'url':u,'status':r.status_code,'final_url':r.url,'content_type':ct,'bytes':len(r.content),'sample':sample})
              except Exception as e:
                  rows.append({'url':u,'status':'ERROR','error':str(e)[:250]})
          Path('reports/starzplay-mobile-public-probe.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

      - name: Publish sanitized diagnostic reports
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-alt-hosts.json 2>/dev/null || true
          git add reports/starzplay-mobile-endpoints.json 2>/dev/null || true
          git add reports/starzplay-mobile-public-probe.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "diagnostic: probe STARZPLAY mobile public EPG endpoints"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
