name: Test beIN Kids verified slots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-bein-kids-verified.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install grabber
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund
      - name: Patch beIN midnight date anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("vendor/iptv-org-epg/sites/bein.com/bein.com.config.js")
          text=p.read_text(encoding="utf-8")
          old="    date = dayjs(date.valueOf()).subtract(1, 'day')"
          new="\n".join([
              "    const firstTimeMatch = items.length",
              "      ? (cheerio.load(items[0])('.time').text().match(/^(\\d{2}):/) || null)",
              "      : null",
              "    date = dayjs(date.valueOf())",
              "    if (firstTimeMatch && Number(firstTimeMatch[1]) >= 18) {",
              "      date = date.subtract(1, 'day')",
              "    }",
          ])
          if old not in text:
              raise SystemExit("date anchor target missing")
          p.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
      - name: Build explicit verified Kids catalogue
        shell: bash
        run: |
          mkdir -p output
          cat > output/bein-kids.channels.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channels>
            <channel site="bein.com" site_id="entertainment#16" lang="ar" xmltv_id="BeJunior.qa@SD">beJunior</channel>
            <channel site="bein.com" site_id="entertainment#32" lang="ar" xmltv_id="JeemTV.qa@SD">Jeem TV</channel>
            <channel site="bein.com" site_id="entertainment#33" lang="ar" xmltv_id="Baraem.qa@SD">Baraem</channel>
          </channels>
          XML
      - name: Grab one day
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          npm run grab --             --channels="$GITHUB_WORKSPACE/output/bein-kids.channels.xml"             --output="$GITHUB_WORKSPACE/output/bein-kids.raw.xml"             --days=1 --maxConnections=1 --timeout=20000
      - name: Print Kids programmes
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, json
          root=ET.parse("output/bein-kids.raw.xml").getroot()
          for cid in ("BeJunior.qa@SD","JeemTV.qa@SD","Baraem.qa@SD"):
              rows=[]
              for p in root.findall("programme"):
                  if p.get("channel") != cid: continue
                  title=next(((x.text or "").strip() for x in p.findall("title") if (x.text or "").strip()),"")
                  rows.append({"start":p.get("start"),"stop":p.get("stop"),"title":title})
              print("KIDS",cid,"COUNT",len(rows))
              print(json.dumps(rows[:8],ensure_ascii=False))
              print("LAST",json.dumps(rows[-4:],ensure_ascii=False))
          PY
