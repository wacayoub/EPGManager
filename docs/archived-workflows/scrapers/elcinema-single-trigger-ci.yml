name: ElCinema single automatic daily scraper regression
on:
  push:
    branches:
      - fix/elcinema-single-daily-auto-trigger-20261018
  pull_request:
    paths:
      - tools/epg_schedule_policy.py
      - tools/test_epg_schedule_policy.py
      - .github/workflows/epg-casablanca-targeted-retry.yml
      - .github/workflows/elcinema-single-trigger-ci.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify no retry of ElCinema, even when stale
        run: python -m unittest tools.test_epg_schedule_policy -v
      - name: Verify one daily scraper cron and no afternoon re-scrape
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          def config(name):
              return yaml.load(Path('.github/workflows/'+name).read_text(),Loader=yaml.BaseLoader)
          el=config('refresh-elcinema.yml')
          seq=config('daily-epg-chain.yml')
          retry=config('epg-casablanca-targeted-retry.yml')
          manual=config('daily-source-refresh.yml')
          legacy=config('daily-epg.yml')
          ext=config('elcinema-daily-donors.yml')
          assert el['on']['schedule']==[{'cron':'20 1 * * *','timezone':'Etc/GMT'}]
          assert 'push' not in el['on']
          assert el['jobs']['refresh']['with']['source']=='elcinema'
          assert el['jobs']['refresh']['with']['scheduled']=='false'
          assert 'elcinema' not in seq['jobs']
          assert 'aljazeera' not in seq['jobs']
          assert 'schedule' not in retry['on']
          assert 'workflow_dispatch' in retry['on']
          assert 'sport24' not in seq['jobs']
          assert set(seq['jobs'])=={'elcinema_extend','finalize'}
          assert 'elcinema_extend' not in retry['jobs']
          assert retry['jobs']['finalize']['needs']==['decide','retry']
          assert 'schedule' not in manual['on']
          assert 'schedule' not in legacy['on']
          assert 'schedule' not in ext['on']
          assert seq['jobs']['elcinema_extend']['uses']=='./.github/workflows/elcinema-daily-donors.yml'
          # Prevent reintroduction of a second auto ElCinema scrape at 15:00.
          from tools.epg_schedule_policy import TARGETS
          assert not {'elcinema','osn','bein'}.intersection(TARGETS)
          assert set(TARGETS)=={'shahid'}
          print('ELCINEMA_AUTOMATIC_SCRAPES_PER_DAY: 1')
          print('ELCINEMA_SCHEDULE: 01:20 Etc/GMT')
          print('ELCINEMA_15H_RETRY: DISABLED')
          print('ELCINEMA_07H15: donor postprocess only, no scrape')
          PY
