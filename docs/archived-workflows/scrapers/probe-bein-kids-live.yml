name: Probe beIN Kids live slots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-bein-kids-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml
      - name: Probe official beIN AR and EN entertainment guide
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, re, requests
          from bs4 import BeautifulSoup

          today=dt.datetime.utcnow().date()
          for day_offset in range(3):
              date=(today+dt.timedelta(days=day_offset)).isoformat()
              for lang,postid in (("ar","25344"),("en","25356")):
                  url=f"https://www.bein.com/{lang}/epg-ajax-template/"
                  params={
                      "action":"epg_fetch","category":"entertainment","cdate":date,
                      "language":lang.upper(),"loadindex":"0","mins":"00","offset":"0",
                      "postid":postid,"serviceidentity":"bein.net",
                  }
                  r=requests.get(url,params=params,headers={"User-Agent":"Mozilla/5.0 EPGManager/beIN-probe"},timeout=30)
                  print("HTTP",date,lang,r.status_code,len(r.content))
                  r.raise_for_status()
                  soup=BeautifulSoup(r.text,"lxml")
                  matches={"beinjunior":[],"jeemtv":[],"baraemtv":[]}
                  for div in soup.select('[id^="channels_"]'):
                      m=re.match(r"channels_(\d+)$",div.get("id") or "")
                      if not m: continue
                      sid=int(m.group(1))
                      a=div.find("a",href=True)
                      href=(a.get("href") or "") if a else ""
                      slug=href.rstrip("/").split("/")[-1].casefold()
                      if slug not in matches: continue
                      titles=[]
                      for li in div.select(".slider > ul:first-child > li")[:4]:
                          t=li.select_one(".title")
                          if t:
                              titles.append(t.get_text(" ",strip=True))
                      matches[slug].append({"slot":sid,"titles":titles})
                  for slug,rows in matches.items():
                      print("KIDMAP",date,lang,slug,json.dumps(rows,ensure_ascii=False))
                      if rows:
                          print("KIDWIN",date,lang,slug,json.dumps(rows[-1],ensure_ascii=False))
          PY