name: Tabie QMC genuinely live ID recovery from expired old EPG only
on:
  push:
    branches: [fix/tabie-expired-lkg-genuine-three-active-ids-recovery-20261018]
    paths:
      - 'tools/publish_lkg.py'
      - 'tools/test_tabie_expired_lkg_recovery.py'
      - '.github/workflows/tabie-real-active-recovery-ci.yml'
  pull_request:
    paths:
      - 'tools/publish_lkg.py'
      - 'tools/test_tabie_expired_lkg_recovery.py'
      - '.github/workflows/tabie-real-active-recovery-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: No network or external packages necessary
        run: python -m py_compile tools/publish_lkg.py tools/test_tabie_expired_lkg_recovery.py
      - name: Genuine 3 active QMC IDs vs expired old 9 plus negative cases
        run: python -m unittest tools.test_tabie_expired_lkg_recovery -v
      - name: Read-only actual rejected source problem evidence
        run: |
          python - <<'PY'
          import gzip,json,hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=json.loads(Path("reports/tabie-publish-lkg.json").read_text())["sources"]["tabie"]
          assert p["decision"] in ("KEEP_LKG","PUBLISH")
          actual=json.loads(Path("feeds/tabie.json").read_text())
          raw=Path("feeds/tabie.xml.gz").read_bytes()
          xml=ET.fromstring(gzip.decompress(raw))
          assert hashlib.sha256(raw).hexdigest()==actual['sha256']
          assert len(xml.findall('channel'))==actual['channels']
          assert len(xml.findall('programme'))==actual['programmes']
          ids={c.get('id') for c in xml.findall('channel')}
          assert 3<=len(ids)<=9
          assert all(e.get('channel') in ids for e in xml.findall('programme'))
          print("TABIE_CURRENT_PUBLICATION_VERIFIED",actual["generated_utc"],len(ids))
          print("TABIE_NEW_POLICY_STRICT_3_NEAR_FUTURE_ID_RECOVERY_ONLY")
          print("NO_RECEIVER_CHANGES_OR_FAKE_PROGRAMMES")
          PY
