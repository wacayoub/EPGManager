name: TEST STC public EPG targets 2h

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-stctv-targets-2h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: STC target EPG 2h
        run: |
          mkdir -p reports output
          python tools/stctv_target_epg_test.py \
            --hours 2 \
            --delay 1.5 \
            --max-channels 25 \
            --report reports/stctv-targets-2h.json
          python tools/stctv_source.py \
            --output output/stctv.2h.xml \
            --report reports/stctv-source-2h.json \
            --window-hours 2 \
            --delay 1.5 \
            --max-channels 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stctv-targets-2h
          path: |
            reports/stctv-targets-2h.json
            reports/stctv-source-2h.json
            output/stctv.2h.xml
