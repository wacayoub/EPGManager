name: Debug SNRT catalogue DOM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-snrt-assadisa.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect catalogue cards
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup,Tag
          for url,wanted in [
              ("https://www.snrt.ma/index.php/ar/athaqafia",["الباحث","إيكولوجيكا","حوار في الثقافة"]),
              ("https://www.snrt.ma/ar/al-aoula",["عالم زينب ونفنوف","حكايات و عبر"]),
          ]:
              r=requests.get(url,timeout=25,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"ar,fr;q=.9"})
              soup=BeautifulSoup(r.text,"lxml")
              print("\nURL",url,"HTTP",r.status_code,"bytes",len(r.text))
              for title in wanted:
                  node=soup.find(string=lambda x:x and title in " ".join(x.split()))
                  print("\nTITLE",title,"FOUND",bool(node))
                  cur=getattr(node,"parent",None)
                  for level in range(6):
                      if cur is None:break
                      txt=cur.get_text(" | ",strip=True)
                      print("ANC",level,"name=",cur.name,"class=",cur.get("class"),"text=",txt[:3000])
                      cur=cur.parent
          PY
