name: Deep public EPG route discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deep-public-epg-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-public-epg-routes
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download public app packages
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/apps/gobx /tmp/apps/starz
          curl -fL --retry 1 --connect-timeout 20 --max-time 180             'https://d.apkpure.net/b/XAPK/net.mbc.gobx?version=latest'             -o /tmp/apps/gobx/app.xapk || true
          curl -fL --retry 1 --connect-timeout 20 --max-time 180             'https://d.apkpure.net/b/XAPK/com.parsifal.starz?version=latest'             -o /tmp/apps/starz/app.xapk || true
          [ -s /tmp/apps/gobx/app.xapk ] && unzip -q /tmp/apps/gobx/app.xapk -d /tmp/apps/gobx/xapk || true
          [ -s /tmp/apps/starz/app.xapk ] && unzip -q /tmp/apps/starz/app.xapk -d /tmp/apps/starz/xapk || true
          find /tmp/apps -name '*.apk' -printf '%p %s bytes\n'

      - name: Install JADX
        shell: bash
        run: |
          curl -fL --retry 2             'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'             -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version

      - name: Decompile public packages
        shell: bash
        run: |
          set +e
          GOBX_APK="$(find /tmp/apps/gobx/xapk -name 'net.mbc.gobx.apk' -o -name '*.apk' | head -1)"
          STARZ_APK="$(find /tmp/apps/starz/xapk -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -n "$GOBX_APK" ]; then
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2               -d /tmp/decompiled/gobx "$GOBX_APK" >/tmp/gobx-jadx.log 2>&1 || true
          fi
          if [ -n "$STARZ_APK" ]; then
            /tmp/jadx/bin/jadx --no-res --no-imports --threads-count 2               -d /tmp/decompiled/starz "$STARZ_APK" >/tmp/starz-jadx.log 2>&1 || true
          fi
          tail -20 /tmp/gobx-jadx.log 2>/dev/null || true
          tail -20 /tmp/starz-jadx.log 2>/dev/null || true

      - name: Extract exact app EPG API definitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          sensitive=re.compile(r'(authorization|bearer|password|secret|access.?token|refresh.?token|license|widevine|drm|payment|credit.?card)',re.I)

          def sanitized_excerpt(lines, lo, hi):
              out=[]
              for raw in lines[lo:hi]:
                  if sensitive.search(raw):
                      out.append('[REDACTED SENSITIVE HEADER LINE]')
                  else:
                      out.append(raw)
              return '\n'.join(out)

          result={'gobx':{'files':[]},'starzplay':{'files':[]}}

          gobx=Path('/tmp/decompiled/gobx')
          if gobx.exists():
              exact_names={'ApiInterface.java','APIDetails.java','APIServiceLayer.java','BuildConstants.java','ChannelGuideViewModel.java','TVGuideViewModel.java','Endpoint.java','Endpoints.java'}
              endpoint_decl=re.compile(r'getChannelGuideProgramme|getChannelGuide|getLiveChannel|getTvGuideFilter|getSeriesTvGuide|getNowShowingEvents|programmeApi|callNowShowingAPI',re.I)
              retrofit_decl=re.compile(r'(?:@|retrofit2\.http\.)(?:GET|POST|Query|Path|Header|Headers)\b',re.I)
              for p in (gobx/'sources'/'net'/'mbc'/'gobx').rglob('*.java'):
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  relevant=(p.name in exact_names or endpoint_decl.search(txt) or re.search(r'gracenote-fe-api',txt,re.I))
                  if not relevant: continue
                  lines=txt.splitlines()
                  keep=[]
                  for i,line in enumerate(lines):
                      if endpoint_decl.search(line) or re.search(r'gracenote-fe-api|BASE_URL',line,re.I) or retrofit_decl.search(line):
                          lo=max(0,i-10); hi=min(len(lines),i+12)
                          ex=sanitized_excerpt(lines,lo,hi)
                          keep.append({'line':i+1,'excerpt':ex[:10000]})
                  if keep:
                      result['gobx']['files'].append({'file':str(p.relative_to(gobx)),'matches':keep[:40]})
                  if len(result['gobx']['files'])>=60: break

          starz=Path('/tmp/decompiled/starz')
          if starz.exists():
              needles=re.compile(r'/epg/category/config/|/epg/category/events/|/epg/channel/start/|sp-new-api\.aws\.playco\.com|epg/category|epg/channel',re.I)
              for p in (starz/'sources').rglob('*.java'):
                  if p.name=='R.java': continue
                  txt=p.read_text(encoding='utf-8',errors='ignore')
                  if not needles.search(txt): continue
                  lines=txt.splitlines(); keep=[]
                  for i,line in enumerate(lines):
                      if needles.search(line):
                          lo=max(0,i-12); hi=min(len(lines),i+13)
                          ex='\n'.join(lines[lo:hi])
                          if not sensitive.search(ex): keep.append({'line':i+1,'excerpt':ex[:10000]})
                  if keep:
                      result['starzplay']['files'].append({'file':str(p.relative_to(starz)),'matches':keep[:30]})
                  if len(result['starzplay']['files'])>=30: break

          Path('reports').mkdir(exist_ok=True)
          Path('reports/deep-public-epg-routes.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2)[:50000])
          PY

      - name: Publish discovery report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/deep-public-epg-routes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: deep public EPG route discovery"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
