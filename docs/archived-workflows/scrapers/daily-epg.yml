name: Manual full EPG refresh (legacy)

on:
  # GitHub cron is UTC. 06:07 UTC = 07:07 Casablanca while Morocco is UTC+1.
  # Two slots make the existing Casablanca gate DST/Ramadan-safe: only the slot
  # that lands during local hour 06 is allowed to run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-feed-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Casablanca 06:00 gate
        id: gate
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Africa/Casablanca date +%H)"
          if [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping UTC duplicate slot; Casablanca hour=$hour"
          fi

      - name: Checkout scraper repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true'
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Verify Python scripts
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile tools/build_catalogues.py
          python -m py_compile tools/osn_hybrid.py
          python -m py_compile tools/starzplay_source.py
          python -m py_compile tools/dubaiplus_source.py
          python -m py_compile tools/dubaiplus_api_source.py
          python -m py_compile tools/stctv_source.py
          python -m py_compile tools/starzplay_hybrid.py
          python -m py_compile tools/elcinema_hybrid.py
          python -m py_compile tools/source_feed_pack.py
          python -m py_compile tools/source_gap_retry.py
          python -m py_compile tools/catalogue_feed_audit.py
          python -m py_compile tools/bein_arabize.py
          python -m py_compile tools/bein_ai_refine.py
          python -m py_compile tools/bein_hybrid.py
          python -m py_compile tools/sport24_source.py
          python -m py_compile tools/morocco_epg.py
          python -m py_compile tools/rotana_source.py
          python -m py_compile tools/build_derived_feeds.py
          python -m py_compile tools/monitor_feeds.py
          python -m py_compile tools/publish_lkg.py
          python -m py_compile tools/validate_48h.py

      - name: Build source catalogues
        if: steps.gate.outputs.run == 'true'
        run: python tools/build_catalogues.py

      - name: Grab ElCinema OSN beIN and Shahid
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build
          for key in elcinema osn bein shahid; do
            cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
            extra=""
            if [ "$key" = "elcinema" ]; then
              extra="--delay=1000"
            fi
            timeout --signal=TERM --kill-after=30s 900s npm run grab --               --channels="$GITHUB_WORKSPACE/output/source-build/$key.channels.xml"               --output="$GITHUB_WORKSPACE/output/source-build/$key.raw.xml"               --days=3               --maxConnections=1               --timeout=20000               $extra
            rc=$?
            echo "$rc" > "$GITHUB_WORKSPACE/output/source-build/$key.grab.rc"
            if [ ! -s "$GITHUB_WORKSPACE/output/source-build/$key.raw.xml" ]; then
              echo '<?xml version="1.0"?><tv></tv>' > "$GITHUB_WORKSPACE/output/source-build/$key.raw.xml"
            fi
          done
          exit 0

      - name: Build ElCinema hybrid English catalogue
        if: steps.gate.outputs.run == 'true'
        run: |
          python tools/elcinema_hybrid.py catalogue \
            --fallback-catalogue output/source-build/elcinema_fallback.channels.xml \
            --policy config/elcinema-language-policy.json \
            --output output/source-build/elcinema_hybrid_en.channels.xml

      - name: Grab OSN English guide
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 900s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/osn_en.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/source-build/osn.en.raw.xml" \
            --days=3 \
            --maxConnections=1 \
            --timeout=20000
          rc=$?
          echo "$rc" > "$GITHUB_WORKSPACE/output/source-build/osn.en.grab.rc"
          if [ ! -s "$GITHUB_WORKSPACE/output/source-build/osn.en.raw.xml" ]; then
            echo '<?xml version="1.0"?><tv></tv>' > "$GITHUB_WORKSPACE/output/source-build/osn.en.raw.xml"
          fi
          exit 0

      - name: Grab beIN English entertainment titles
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 600s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/bein_hybrid_en.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/source-build/bein.hybrid.en.raw.xml" \
            --days=3 \
            --maxConnections=1 \
            --timeout=20000 \
            --delay=500
          rc=$?
          echo "$rc" > "$GITHUB_WORKSPACE/output/source-build/bein.hybrid.en.grab.rc"
          if [ ! -s "$GITHUB_WORKSPACE/output/source-build/bein.hybrid.en.raw.xml" ]; then
            echo '<?xml version="1.0"?><tv></tv>' > "$GITHUB_WORKSPACE/output/source-build/bein.hybrid.en.raw.xml"
          fi
          exit 0

      - name: Build OSN hybrid EN-title AR-description
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p reports
          if [ -s output/source-build/osn.raw.xml ] && [ -s output/source-build/osn.en.raw.xml ]; then
            python tools/osn_hybrid.py \
              --arabic output/source-build/osn.raw.xml \
              --english output/source-build/osn.en.raw.xml \
              --policy config/osn-language-policy.json \
              --mode hybrid \
              --output output/source-build/osn.hybrid.raw.xml \
              --report reports/osn-hybrid.json
            rc=$?
            if [ "$rc" -eq 0 ] && [ -s output/source-build/osn.hybrid.raw.xml ]; then
              mv output/source-build/osn.hybrid.raw.xml output/source-build/osn.raw.xml
              echo "OSN hybrid guide enabled."
            else
              echo "OSN hybrid build failed rc=$rc; keeping Arabic-only OSN candidate."
              rm -f output/source-build/osn.hybrid.raw.xml
            fi
          else
            echo "OSN English/Arabic raw guide missing; keeping Arabic-only OSN candidate."
          fi
          exit 0

      - name: Scrape STARZPLAY Arabic and English public guide
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build reports
          for lang in ar en; do
            python tools/starzplay_source.py \
              --lang "$lang" \
              --output "output/source-build/starzplay.$lang.raw.xml" \
              --report "reports/starzplay-$lang-scrape.json" \
              --id-index feeds/mena.txt \
              --hours 72
            echo "$?" > "output/source-build/starzplay.$lang.grab.rc"
          done
          if grep -q '<programme ' output/source-build/starzplay.ar.raw.xml 2>/dev/null; then
            cp output/source-build/starzplay.ar.raw.xml output/source-build/starzplay.raw.xml
          else
            echo '<?xml version="1.0"?><tv></tv>' > output/source-build/starzplay.raw.xml
          fi
          exit 0

      - name: Build STARZPLAY hybrid EN-title AR-description
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          if grep -q '<programme ' output/source-build/starzplay.ar.raw.xml 2>/dev/null && \
             grep -q '<programme ' output/source-build/starzplay.en.raw.xml 2>/dev/null; then
            python tools/starzplay_hybrid.py \
              --arabic output/source-build/starzplay.ar.raw.xml \
              --english output/source-build/starzplay.en.raw.xml \
              --policy config/starzplay-language-policy.json \
              --output output/source-build/starzplay.hybrid.raw.xml \
              --report reports/starzplay-hybrid.json
            rc=$?
            if [ "$rc" -eq 0 ] && [ -s output/source-build/starzplay.hybrid.raw.xml ]; then
              mv output/source-build/starzplay.hybrid.raw.xml output/source-build/starzplay.raw.xml
              echo "STARZPLAY hybrid guide enabled."
            else
              echo "STARZPLAY hybrid failed rc=$rc; keeping Arabic candidate."
              rm -f output/source-build/starzplay.hybrid.raw.xml
            fi
          else
            echo "STARZPLAY bilingual inputs unavailable; keeping Arabic candidate/LKG."
          fi
          exit 0

      - name: Retry ElCinema zero-EPG channels in English
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          python tools/source_gap_retry.py build \
            --catalogue output/source-build/elcinema.channels.xml \
            --fallback-catalogue output/source-build/elcinema_fallback.channels.xml \
            --raw output/source-build/elcinema.raw.xml \
            --output output/source-build/elcinema.retry.channels.xml

          if grep -q '<channel ' output/source-build/elcinema.retry.channels.xml; then
            cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
            timeout --signal=TERM --kill-after=30s 600s npm run grab -- \
              --channels="$GITHUB_WORKSPACE/output/source-build/elcinema.retry.channels.xml" \
              --output="$GITHUB_WORKSPACE/output/source-build/elcinema.retry.raw.xml" \
              --days=3 \
              --maxConnections=1 \
              --timeout=20000 \
              --delay=1000
            cd "$GITHUB_WORKSPACE"
            if [ -s output/source-build/elcinema.retry.raw.xml ]; then
              python tools/source_gap_retry.py merge \
                --primary output/source-build/elcinema.raw.xml \
                --retry output/source-build/elcinema.retry.raw.xml \
                --output output/source-build/elcinema.merged.xml
              mv output/source-build/elcinema.merged.xml output/source-build/elcinema.raw.xml
            fi
          else
            echo "ElCinema: no zero-EPG channels to retry."
          fi
          exit 0

      - name: Grab ElCinema English titles for hybrid IDs
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/vendor/iptv-org-epg"
          timeout --signal=TERM --kill-after=30s 600s npm run grab -- \
            --channels="$GITHUB_WORKSPACE/output/source-build/elcinema_hybrid_en.channels.xml" \
            --output="$GITHUB_WORKSPACE/output/source-build/elcinema.hybrid.en.raw.xml" \
            --days=3 \
            --maxConnections=1 \
            --timeout=20000 \
            --delay=1000
          rc=$?
          echo "$rc" > "$GITHUB_WORKSPACE/output/source-build/elcinema.hybrid.en.grab.rc"
          if [ ! -s "$GITHUB_WORKSPACE/output/source-build/elcinema.hybrid.en.raw.xml" ]; then
            echo '<?xml version="1.0"?><tv></tv>' > "$GITHUB_WORKSPACE/output/source-build/elcinema.hybrid.en.raw.xml"
          fi
          exit 0

      - name: Build ElCinema hybrid EN-title AR-description
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p data reports
          if [ -s output/source-build/elcinema.raw.xml ] && [ -s output/source-build/elcinema.hybrid.en.raw.xml ]; then
            python tools/elcinema_hybrid.py merge \
              --arabic output/source-build/elcinema.raw.xml \
              --english output/source-build/elcinema.hybrid.en.raw.xml \
              --policy config/elcinema-language-policy.json \
              --cache data/elcinema_translation_cache.json \
              --output output/source-build/elcinema.hybrid.raw.xml \
              --report reports/elcinema-hybrid.json
            rc=$?
            if [ "$rc" -eq 0 ] && [ -s output/source-build/elcinema.hybrid.raw.xml ]; then
              mv output/source-build/elcinema.hybrid.raw.xml output/source-build/elcinema.raw.xml
              echo "ElCinema hybrid guide enabled."
            else
              echo "ElCinema hybrid build failed rc=$rc; keeping pre-hybrid candidate."
              rm -f output/source-build/elcinema.hybrid.raw.xml
            fi
          else
            echo "ElCinema hybrid inputs missing; keeping pre-hybrid candidate."
          fi
          exit 0

      - name: Scrape Rotana official
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build reports
          python tools/rotana_source.py \
            --output output/source-build/rotana.raw.xml \
            --report reports/rotana-scrape.json \
            --window-hours 72
          rc=$?
          echo "$rc" > output/source-build/rotana.grab.rc
          if [ ! -s output/source-build/rotana.raw.xml ]; then
            echo '<?xml version="1.0"?><tv></tv>' > output/source-build/rotana.raw.xml
          fi
          exit 0

      - name: Scrape Sport24
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build
          python tools/sport24_source.py             --output output/source-build/sport24.raw.xml             --report output/source-build/sport24-scrape.json             --window-hours 48
          rc=$?
          echo "$rc" > output/source-build/sport24.grab.rc
          if [ ! -s output/source-build/sport24.raw.xml ]; then
            echo '<?xml version="1.0"?><tv></tv>' > output/source-build/sport24.raw.xml
          fi
          exit 0

      - name: Scrape Morocco
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/morocco output/source-build
          if [ -s feeds/morocco.xml.gz ]; then
            python tools/morocco_epg.py               --output-dir output/morocco               --days 3               --previous feeds/morocco.xml.gz
          else
            python tools/morocco_epg.py               --output-dir output/morocco               --days 3
          fi
          echo "$?" > output/source-build/morocco.grab.rc
          exit 0

      - name: Scrape Dubai+ official hybrid
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build reports
          python tools/dubaiplus_api_source.py \
            --output output/source-build/dubaiplus.raw.xml \
            --report reports/dubaiplus-scrape.json \
            --hours 48
          rc=$?
          echo "$rc" > output/source-build/dubaiplus.grab.rc
          if [ ! -s output/source-build/dubaiplus.raw.xml ]; then
            echo '<?xml version="1.0"?><tv></tv>' > output/source-build/dubaiplus.raw.xml
          fi
          exit 0

      # STC scraping intentionally disabled: keep the last-known-good published STC feed.
      # Re-enable only for a dedicated/manual STC refresh, because the full catalogue scrape is slow.

      - name: Pack candidate feeds and preserve complete ID catalogues
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p output/final
          for key in elcinema osn bein shahid rotana sport24 starzplay dubaiplus; do
            catalogue_args=()
            if [ -s "output/source-build/$key.channels.xml" ]; then
              catalogue_args=(--catalogue "output/source-build/$key.channels.xml")
            fi
            python tools/source_feed_pack.py \
              --input "output/source-build/$key.raw.xml" \
              "${catalogue_args[@]}" \
              --output-gz "output/final/$key.xml.gz" \
              --output-txt "output/final/$key.txt" \
              --stats "output/final/$key.json" \
              --label "$key" \
              --window-hours 48
            echo "$?" > "output/final/$key.pack.rc"
          done
          if [ -s output/morocco/morocco.xml.gz ]; then
            python tools/source_feed_pack.py \
              --input output/morocco/morocco.xml.gz \
              --output-gz output/final/morocco.xml.gz \
              --output-txt output/final/morocco.txt \
              --stats output/final/morocco.json \
              --label morocco \
              --window-hours 48
            echo "$?" > output/final/morocco.pack.rc
          else
            echo "Morocco candidate missing; previous LKG will be preserved."
          fi
          exit 0

      - name: Arabize beIN MENA titles and descriptions
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p data reports
          if [ -s output/final/bein.xml.gz ]; then
            python tools/bein_arabize.py \
              --input output/final/bein.xml.gz \
              --output output/final/bein.ar.xml.gz \
              --cache data/bein_translation_cache.json \
              --report reports/bein-translation.json
            rc=$?
            if [ "$rc" -eq 0 ] && [ -s output/final/bein.ar.xml.gz ]; then
              mv output/final/bein.ar.xml.gz output/final/bein.xml.gz
            else
              echo "beIN Arabize failed rc=$rc; keeping original candidate."
              rm -f output/final/bein.ar.xml.gz
            fi
          else
            echo "beIN candidate missing; LKG will be preserved."
          fi
          exit 0

      - name: AI quality pass for beIN Arabic
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/bein_ai_refine.py \
            --input output/final/bein.xml.gz \
            --output output/final/bein.ai.xml.gz \
            --cache data/bein_ai_cache.json \
            --report reports/bein-ai-refine.json
          if [ -s output/final/bein.ai.xml.gz ]; then
            mv output/final/bein.ai.xml.gz output/final/bein.xml.gz
          fi

      - name: Final beIN Hybrid language pass
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p data reports
          if [ -s output/final/bein.xml.gz ] && [ -s output/source-build/bein.hybrid.en.raw.xml ]; then
            python tools/bein_hybrid.py \
              --input output/final/bein.xml.gz \
              --english output/source-build/bein.hybrid.en.raw.xml \
              --policy config/bein-language-policy.json \
              --cache data/bein_hybrid_translation_cache.json \
              --output output/final/bein.hybrid.xml.gz \
              --report reports/bein-hybrid.json
            rc=$?
            if [ "$rc" -eq 0 ] && [ -s output/final/bein.hybrid.xml.gz ]; then
              mv output/final/bein.hybrid.xml.gz output/final/bein.xml.gz
              echo "beIN Hybrid guide enabled."
            else
              echo "beIN Hybrid failed rc=$rc; keeping Arabic-sports candidate."
              rm -f output/final/bein.hybrid.xml.gz
            fi
          else
            echo "beIN Hybrid inputs missing; keeping Arabic-sports candidate."
          fi
          exit 0

      - name: Strict 48-hour coverage audit
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p reports
          candidates=()
          for key in morocco bein shahid elcinema osn rotana sport24 starzplay dubaiplus; do
            [ -s "output/final/$key.xml.gz" ] && candidates+=("output/final/$key.xml.gz")
          done
          if [ "${#candidates[@]}" -gt 0 ]; then
            python tools/validate_48h.py "${candidates[@]}" \
              --hours 48 \
              --max-gap-minutes 90 \
              --report reports/direct-48h-audit.json
            echo "Strict audit rc=$? (diagnostic only; per-source LKG decides publication)."
          else
            echo '{"generated_utc":null,"feeds":[],"status":"NO_CANDIDATES"}' > reports/direct-48h-audit.json
            echo "No candidates available for strict audit."
          fi
          exit 0

      - name: Publish healthy feeds with LKG protection
        if: steps.gate.outputs.run == 'true'
        run: python tools/publish_lkg.py

      - name: Build canonical MENA feed
        if: steps.gate.outputs.run == 'true'
        run: python tools/build_derived_feeds.py

      - name: Audit provider catalogue versus published IDs
        if: steps.gate.outputs.run == 'true'
        run: python tools/catalogue_feed_audit.py

      - name: Build monitoring report
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          mkdir -p reports
          shopt -s nullglob
          feeds=(feeds/*.xml.gz)
          if [ "${#feeds[@]}" -eq 0 ]; then
            echo "No published feeds yet."
            exit 1
          fi
          python tools/monitor_feeds.py "${feeds[@]}" \
            --json reports/latest.json \
            --md reports/latest.md \
            --html reports/epg-source-id-monitoring.html \
            --csv reports/epg-source-id-monitoring.csv \
            --reports-dir reports

      - name: Commit feeds and reports
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds reports
          for optional in data/bein_translation_cache.json data/bein_ai_cache.json data/bein_hybrid_translation_cache.json data/elcinema_translation_cache.json; do
            if [ -f "$optional" ]; then
              git add "$optional"
            fi
          done
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Daily EPG refresh $(TZ=Africa/Casablanca date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
