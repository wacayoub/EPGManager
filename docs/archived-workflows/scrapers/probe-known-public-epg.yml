name: Probe known public EPG routes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-known-public-epg.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-known-public-epg
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests
      - name: Probe low-rate public metadata roots
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          targets=[
            ('starzplay','https://sp-new-api.aws.playco.com/api/epg/channel/config'),
            ('starzplay','https://api.aws.playco.com/api/epg/channel/config'),
            ('starzplay','https://sp-new-api.aws.playco.com/api/epg/category/config/'),
            ('gobx','https://fe-api.prod.gobx.com/api/'),
            ('gobx','https://fe-api.prod.gobx.com/api/v2/gracenote-fe-api/'),
            ('gobx','https://fe-api.prod.gobx.com/api/outlets/'),
          ]
          s=requests.Session()
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'ar,en;q=0.8',
            'x-geo-country':'MA',
          })
          sensitive=re.compile(r'(token|authorization|bearer|password|secret|license|drm|widevine|payment)',re.I)
          rows=[]
          for source,url in targets:
              try:
                  r=s.get(url,timeout=15,allow_redirects=True)
                  ct=r.headers.get('content-type','')
                  sample=''
                  if 'json' in ct or 'text' in ct:
                      txt=re.sub(r'\s+',' ',r.text[:5000]).strip()
                      if not sensitive.search(txt):
                          sample=txt[:2000]
                  rows.append({'source':source,'url':url,'status':r.status_code,'final_url':r.url,'content_type':ct,'bytes':len(r.content),'sample':sample})
              except Exception as e:
                  rows.append({'source':source,'url':url,'status':'ERROR','error':str(e)[:300]})
          Path('reports').mkdir(exist_ok=True)
          Path('reports/known-public-epg-probe.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/known-public-epg-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: probe known public EPG routes"
          git pull --rebase origin main
          git push origin HEAD:main
