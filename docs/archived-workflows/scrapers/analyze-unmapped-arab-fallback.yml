name: Analyze unmapped Arab fallback

on:
  push:
    branches: [main]
    paths:
      - "config/full-refresh-trigger.txt"
      - ".github/workflows/analyze-unmapped-arab-fallback.yml"
      - "tools/analyze_unmapped_arab_fallback.py"
      - "reports/arab-fallback-all-channels.csv"
      - "feeds/**"
  workflow_dispatch:

concurrency:
  group: analyze-unmapped-arab-fallback
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Analyze all active fallback channels not mapped in production
        run: python tools/analyze_unmapped_arab_fallback.py

      - name: Show summary
        run: |
          cat reports/unmapped-arab-fallback.md
          echo
          echo "Review collisions:"
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("reports/unmapped-arab-fallback-review.csv")
          rows=list(csv.DictReader(p.open(encoding="utf-8"))) if p.exists() else []
          print("collision rows",len(rows))
          for r in rows[:60]:
              print(r["name"],"=>",r["existing_ids"],"|",r["provider"],r["source"],r["future_programmes"],r["desc_pct"])
          PY

      - name: Stage analysis reports
        run: |
          mkdir -p /tmp/unmapped-analysis/reports
          cp -f reports/unmapped-arab-fallback.* /tmp/unmapped-analysis/reports/
          cp -f reports/unmapped-arab-fallback-review.csv /tmp/unmapped-analysis/reports/

      - name: Publish reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp -f /tmp/unmapped-analysis/reports/* reports/
            git add reports/unmapped-arab-fallback*
            if git diff --cached --quiet; then
              echo "No unmapped analysis changes"
              exit 0
            fi
            git commit -m "Update unmapped Arab fallback analysis"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
