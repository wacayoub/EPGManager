name: Export Vu+ 1h test feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-vuplus-1h.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-vuplus-1h
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 1-hour Vu+ test export from published feeds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          import copy, gzip, hashlib, json, re
          import xml.etree.ElementTree as ET

          FEEDS=Path("feeds")
          OUT=FEEDS/"tests"
          OUT.mkdir(parents=True,exist_ok=True)

          # Fast test pack: no scraping. STC is intentionally excluded.
          PRIORITY=["morocco","bein","dubaiplus","shahid","rotana","sport24","osn","elcinema"]
          DT=re.compile(r"^(\d{12}|\d{14})(?:\s*([+-]\d{4}|Z))?")

          def parse_dt(v):
              m=DT.match((v or "").strip())
              if not m: return None
              s=m.group(1)
              d=datetime.strptime(s,"%Y%m%d%H%M%S" if len(s)==14 else "%Y%m%d%H%M")
              o=m.group(2)
              if not o or o=="Z": return d.replace(tzinfo=timezone.utc)
              sign=1 if o[0]=="+" else -1
              mins=sign*(int(o[1:3])*60+int(o[3:5]))
              return d.replace(tzinfo=timezone(timedelta(minutes=mins))).astimezone(timezone.utc)

          now=datetime.now(timezone.utc).replace(microsecond=0)
          end=now+timedelta(hours=1)

          channels={}
          owners={}
          programmes=defaultdict(list)
          source_rows=[]

          for key in PRIORITY:
              p=FEEDS/f"{key}.xml.gz"
              if not p.exists() or not p.stat().st_size:
                  source_rows.append({"source":key,"status":"MISSING"})
                  continue
              root=ET.fromstring(gzip.decompress(p.read_bytes()))
              source_channels={}
              for c in root.findall("channel"):
                  cid=(c.get("id") or "").strip()
                  if cid:
                      source_channels[cid]=c

              selected=defaultdict(list)
              for prog in root.findall("programme"):
                  cid=(prog.get("channel") or "").strip()
                  if cid not in source_channels: continue
                  st=parse_dt(prog.get("start")); sp=parse_dt(prog.get("stop"))
                  if not st or not sp or sp<=st: continue
                  if st < end and sp > now:
                      q=copy.deepcopy(prog)
                      q.set("start",st.strftime("%Y%m%d%H%M%S +0000"))
                      q.set("stop",sp.strftime("%Y%m%d%H%M%S +0000"))
                      selected[cid].append(q)

              kept=0
              active=0
              for cid,c in source_channels.items():
                  if cid in channels: continue
                  channels[cid]=copy.deepcopy(c)
                  owners[cid]=key
                  kept+=1
                  if selected.get(cid):
                      active+=1
                      programmes[cid].extend(selected[cid])

              source_rows.append({
                  "source":key,
                  "status":"OK",
                  "source_ids":len(source_channels),
                  "ids_kept_after_priority":kept,
                  "active_ids_in_1h":active,
                  "zero_epg_in_1h":kept-active,
                  "programmes_in_1h":sum(len(v) for v in selected.values()),
              })

          tv=ET.Element("tv",{
              "generator-info-name":"EPGManager Vu+ 1h quick test",
              "generator-info-url":"https://github.com/wacayoub/EPGManager",
          })
          for cid in sorted(channels,key=str.casefold):
              tv.append(channels[cid])

          total_programmes=0
          for cid in sorted(programmes,key=str.casefold):
              seen=set()
              for p in sorted(programmes[cid],key=lambda x:(x.get("start") or "",x.get("stop") or "")):
                  title="|".join((t.text or "").strip() for t in p.findall("title"))
                  k=(p.get("start") or "",p.get("stop") or "",title)
                  if k in seen: continue
                  seen.add(k)
                  tv.append(p)
                  total_programmes+=1

          ET.indent(tv,space="  ")
          raw=ET.tostring(tv,encoding="utf-8",xml_declaration=True)
          gz=gzip.compress(raw,compresslevel=9,mtime=0)

          xml_path=OUT/"vuplus-1h.xml.gz"
          txt_path=OUT/"vuplus-1h.txt"
          json_path=OUT/"vuplus-1h.json"
          xml_path.write_bytes(gz)
          txt_path.write_text(
              "\n".join(
                  f"{cid}|{next(((d.text or '').strip() for d in channels[cid].findall('display-name') if (d.text or '').strip()),cid)}"
                  for cid in sorted(channels,key=str.casefold)
              )+"\n",
              encoding="utf-8"
          )
          report={
              "generated_utc":now.isoformat(),
              "window_start_utc":now.isoformat(),
              "window_end_utc":end.isoformat(),
              "window_hours":1,
              "mode":"published-feeds-only-no-scrape",
              "stctv":"excluded",
              "sources":source_rows,
              "merged_ids":len(channels),
              "merged_active_ids":sum(1 for cid in channels if programmes.get(cid)),
              "merged_zero_epg_ids":sum(1 for cid in channels if not programmes.get(cid)),
              "merged_programmes":total_programmes,
              "size_bytes":len(gz),
              "sha256":hashlib.sha256(gz).hexdigest(),
          }
          json_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not channels or not total_programmes:
              raise SystemExit("1h export is empty")
          PY

      - name: Validate 1-hour export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,json,xml.etree.ElementTree as ET
          p=Path("feeds/tests/vuplus-1h.xml.gz")
          root=ET.fromstring(gzip.decompress(p.read_bytes()))
          ids={(c.get("id") or "").strip() for c in root.findall("channel") if (c.get("id") or "").strip()}
          pr=root.findall("programme")
          assert ids and pr
          assert all((x.get("channel") or "").strip() in ids for x in pr)
          r=json.loads(Path("feeds/tests/vuplus-1h.json").read_text())
          assert r["window_hours"]==1
          assert r["stctv"]=="excluded"
          print("VU+ 1H EXPORT OK",len(ids),"IDs",len(pr),"programmes")
          PY

      - name: Commit 1-hour export
        shell: bash
        run: |
          set -e
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/tests/vuplus-1h.xml.gz feeds/tests/vuplus-1h.txt feeds/tests/vuplus-1h.json
          if git diff --cached --quiet; then
            echo "No 1h export changes."
          else
            git commit -m "Export 1h EPG pack for Vu+ quick test"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
