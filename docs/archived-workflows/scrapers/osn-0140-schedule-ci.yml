name: OSN sole 01:40 Casablanca daily scrape - no duplicate automatic sources
on:
  push:
    branches: [schedule/osn-casablanca-0140-single-daily-20261018]
    paths:
      - '.github/workflows/refresh-osn.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-casablanca-targeted-retry.yml'
      - '.github/workflows/epg-watchdog.yml'
      - 'tools/epg_schedule_policy.py'
      - 'tools/test_epg_schedule_policy.py'
      - 'tools/test_epg_casablanca_workflows.py'
      - '.github/workflows/osn-0140-schedule-ci.yml'
  pull_request:
    paths:
      - '.github/workflows/refresh-osn.yml'
      - '.github/workflows/daily-epg-chain.yml'
      - '.github/workflows/epg-casablanca-targeted-retry.yml'
      - '.github/workflows/epg-watchdog.yml'
      - 'tools/epg_schedule_policy.py'
      - 'tools/test_epg_schedule_policy.py'
      - 'tools/test_epg_casablanca_workflows.py'
      - '.github/workflows/osn-0140-schedule-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Check local schedule policy regressions
        run: python -m unittest tools.test_epg_schedule_policy tools.test_epg_casablanca_workflows -v
      - name: Audit every known automatic OSN refresh route and local timezone
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          import yaml
          from tools.epg_schedule_policy import TARGETS,MAX_RETRIES
          w=Path('.github/workflows')
          def read(name):
              return yaml.load((w/name).read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          osn=read('refresh-osn.yml')
          chain=read('daily-epg-chain.yml')
          retry=read('epg-casablanca-targeted-retry.yml')
          evening=read('epg-evening-casablanca.yml')
          watchdog=read('epg-watchdog.yml')
          manual=read('daily-source-refresh.yml')
          core=read('refresh-source-core.yml')
          legacy=read('daily-epg.yml')
          donors=read('elcinema-daily-donors.yml')
          assert osn['on']['schedule']==[
              {'cron':'40 1 * * *', 'timezone':'Etc/GMT'}]
          assert 'workflow_dispatch' in osn['on']
          assert 'push' not in osn['on'], 'Remove former extra OSN push trigger'
          assert osn['jobs']['refresh']['uses']=='./.github/workflows/refresh-source-core.yml'
          assert osn['jobs']['refresh']['with']=={'source':'osn','scheduled':'false'}
          assert chain['on']['schedule']==[
              {'cron':'15 7 * * *','timezone':'Etc/GMT'}]
          assert 'osn' not in chain['jobs'], 'No second 07:15 OSN scrape'
          assert 'aljazeera' not in chain['jobs']
          assert 'dubaiplus' not in chain['jobs']
          assert 'starzplay' not in chain['jobs']
          assert 'tunisiatv' not in chain['jobs']
          assert 'stctv' not in chain['jobs']
          assert 'alkass' not in chain['jobs']
          assert set(TARGETS)=={'shahid'} and MAX_RETRIES==1
          assert 'schedule' not in retry['on']
          assert 'workflow_dispatch' in retry['on']
          assert 'shahid' not in chain['jobs']
          assert 'sport24' not in chain['jobs']
          assert set(chain['jobs'])=={'elcinema_extend','finalize'}
          assert 'matrix.source' in retry['jobs']['retry']['with']['source']
          assert 'osn' not in evening['jobs']['sports']['strategy']['matrix']['source']
          assert evening['jobs']['sports']['strategy']['matrix']['source']==['alkass']
          for name,doc in [('daily-source-refresh',manual),('refresh-source-core',core),
                           ('daily-epg',legacy),('elcinema-daily-donors',donors)]:
              assert 'schedule' not in doc['on'], name
          assert watchdog['jobs']['verify']['steps']
          assert read('refresh-elcinema.yml')['on']['schedule']==[
              {'cron':'20 1 * * *','timezone':'Etc/GMT'}]
          assert read('refresh-bein.yml')['on']['schedule']==[
              {'cron':'22 2 * * *','timezone':'Etc/GMT'}]
          tz=ZoneInfo('Etc/GMT')
          for date in [(2026,10,19),(2027,2,20),(2027,4,20),(2027,7,15)]:
              local=datetime(*date,1,40,tzinfo=tz)
              roundtrip=local.astimezone(timezone.utc).astimezone(tz)
              assert (roundtrip.year,roundtrip.month,roundtrip.day,
                      roundtrip.hour,roundtrip.minute)==(*date,1,40)
              print('OSN_0140_LOCAL',local.isoformat(), 'UTC',local.astimezone(timezone.utc).isoformat())
          print('OSN_ONE_DAILY_SCHEDULE_0140_CASABLANCA: PASS')
          print('OSN_SECONDARY_AUTOMATIC_0715_1500_PUSH: DISABLED')
          print('ELCINEMA_0120_AND_BEIN_0222_UNCHANGED')
          PY
