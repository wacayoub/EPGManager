name: Inspect STARZPLAY NMS client builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-starzplay-nms-client.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool unzip

      - name: Decode public STARZPLAY Android package
        shell: bash
        run: |
          set -e
          rm -rf /tmp/starzclient
          mkdir -p /tmp/starzclient/xapk /tmp/starzclient/decoded reports
          curl -fL --retry 1 --connect-timeout 20 --max-time 180 \
            'https://d.apkpure.net/b/XAPK/com.parsifal.starz?version=latest' \
            -o /tmp/starzclient/starzplay.xapk
          unzip -q /tmp/starzclient/starzplay.xapk -d /tmp/starzclient/xapk
          i=0
          for apk in /tmp/starzclient/xapk/*.apk; do
            [ -f "$apk" ] || continue
            i=$((i+1))
            apktool d -f "$apk" -o "/tmp/starzclient/decoded/apk$i" >/dev/null 2>&1 || true
          done

      - name: Extract sanitized NMS client implementation
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          sensitive = re.compile(
              r'(authorization|bearer|password|secret|token|license|widevine|drm|payment|pinLoginKey|api[_-]?key)',
              re.I
          )
          interesting = re.compile(
              r'(Loe/a;|class public .*Loe/a|\.method .*<init>|retrofit|baseUrl|HttpUrl|'
              r'v2\.0|v2\.1|version|interceptor|header|addHeader|User-Agent|x-geo|SPX-|/api)',
              re.I
          )
          blocks = []
          for root in Path('/tmp/starzclient/decoded').glob('apk*'):
              candidates = list(root.rglob('oe/a.smali')) + list(root.rglob('he/p.smali')) + list(root.rglob('he/g.smali')) + list(root.rglob('com/starzplay/sdk/rest/peg/a.smali')) + list(root.rglob('com/starzplay/sdk/utils/r0.smali')) + list(root.rglob('re/b.smali'))
              candidates += [p for p in root.rglob('*.smali') if p.name != 'a.smali' and 'oe' in p.parts[-2:]]
              seen=set()
              for p in candidates:
                  if p in seen or not p.is_file():
                      continue
                  seen.add(p)
                  try:
                      lines=p.read_text(encoding='utf-8',errors='ignore').splitlines()
                  except Exception:
                      continue
                  hits=[i for i,l in enumerate(lines) if interesting.search(l)]
                  if not hits:
                      continue
                  ranges=[]
                  for i in hits:
                      a=max(0,i-45); b=min(len(lines),i+100)
                      if ranges and a <= ranges[-1][1] + 10:
                          ranges[-1]=(ranges[-1][0], max(ranges[-1][1], b))
                      else:
                          ranges.append((a,b))
                  for a,b in ranges:
                      out=[]
                      for n in range(a,b):
                          line=lines[n]
                          if sensitive.search(line):
                              line='[REDACTED_SENSITIVE_LINE]'
                          line=re.sub(r'"[A-Za-z0-9+/=_-]{80,}"','"[REDACTED_LONG_CONSTANT]"',line)
                          out.append(f'{n+1}: {line}')
                      blocks.append(f'FILE {p.relative_to(root)}\n'+'\n'.join(out))
          text='\n\n===== BLOCK =====\n\n'.join(blocks[:120])+'\n'
          Path('reports/starzplay-nms-client-builder.txt').write_text(text,encoding='utf-8')
          print(text[:50000])
          PY

      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-nms-client-builder.txt
          git commit -m "diagnostic: inspect STARZPLAY NMS client builder" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
