name: Translate current beIN descriptions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-feed-publish
  cancel-in-progress: false

jobs:
  arabize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Translate existing feed only
        run: |
          mkdir -p output/final reports data
          python tools/bein_arabize.py \
            --input feeds/bein.xml.gz \
            --output output/final/bein.ar.xml.gz \
            --cache data/bein_translation_cache.json \
            --report reports/bein-translation.json
      - name: Repack translated feed
        run: |
          python tools/source_feed_pack.py \
            --input output/final/bein.ar.xml.gz \
            --output-gz output/final/bein.xml.gz \
            --output-txt output/final/bein.txt \
            --stats output/final/bein.json \
            --label bein \
            --window-hours 48
      - name: Verify examples
        run: |
          python - <<'PY'
          import gzip, xml.etree.ElementTree as ET, json
          root=ET.fromstring(gzip.decompress(open("output/final/bein.xml.gz","rb").read()))
          targets=["beINSports1.qa@MENA","beINSports2.qa@MENA","beINSports3.qa@MENA","beINSportsNews.qa@SD"]
          for cid in targets:
              rows=[]
              for p in root.findall("programme"):
                  if p.get("channel") != cid:
                      continue
                  title=next(((x.text or "").strip() for x in p.findall("title") if (x.text or "").strip()),"")
                  desc=next(((x.text or "").strip() for x in p.findall("desc") if (x.text or "").strip()),"")
                  rows.append({"start":p.get("start"),"title":title,"desc":desc})
                  if len(rows)>=2: break
              print("AR_BEIN_EXAMPLE",cid,json.dumps(rows,ensure_ascii=False))
          PY
      - name: Publish translated feed
        shell: bash
        run: |
          set -e

          # Preserve generated artifacts before syncing to the latest main.
          rm -rf /tmp/bein-publish
          mkdir -p /tmp/bein-publish/feeds /tmp/bein-publish/reports /tmp/bein-publish/data
          cp output/final/bein.xml.gz /tmp/bein-publish/feeds/bein.xml.gz
          cp output/final/bein.json /tmp/bein-publish/feeds/bein.json
          cp output/final/bein.txt /tmp/bein-publish/feeds/bein.txt
          for f in reports/bein-translation.json reports/bein-ai-refine.json; do
            [ -f "$f" ] && cp "$f" /tmp/bein-publish/reports/
          done
          for f in data/bein_translation_cache.json data/bein_ai_cache.json; do
            [ -f "$f" ] && cp "$f" /tmp/bein-publish/data/
          done

          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"

          # Rebuild the publication commit on top of the freshest main.
          # This avoids rebase conflicts in generated feed/json files.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p feeds reports data
            cp /tmp/bein-publish/feeds/bein.xml.gz feeds/bein.xml.gz
            cp /tmp/bein-publish/feeds/bein.json feeds/bein.json
            cp /tmp/bein-publish/feeds/bein.txt feeds/bein.txt
            cp /tmp/bein-publish/reports/* reports/ 2>/dev/null || true
            cp /tmp/bein-publish/data/* data/ 2>/dev/null || true

            git add feeds/bein.xml.gz feeds/bein.json feeds/bein.txt reports/bein-translation.json reports/bein-ai-refine.json data/bein_translation_cache.json data/bein_ai_cache.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "No beIN publication changes."
              exit 0
            fi

            git commit -m "Arabize current beIN MENA feed"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying on latest main (attempt $attempt/3)."
          done

          echo "Unable to publish beIN feed after 3 safe retries."
          exit 1
