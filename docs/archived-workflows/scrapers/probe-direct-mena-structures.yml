name: Probe direct MENA source structures

on:
  push:
    branches: [main]
    paths:
      - "tools/direct_mena_structure_probe.py"
      - ".github/workflows/probe-direct-mena-structures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - run: python tools/direct_mena_structure_probe.py
      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          cp reports/direct-mena-structure.json /tmp/direct-mena-structure.json
          git config user.name "EPG Probe Bot"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/direct-mena-structure.json reports/direct-mena-structure.json
            git add reports/direct-mena-structure.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update direct MENA structure report"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*2))
          done
          exit 1
