name: Inspect current Morocco samples

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-morocco-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare current with pre-fix Morocco descriptions
        shell: bash
        run: |
          git show d992334ad2f8ab23cafab8b92b32d08df66dc1f4:feeds/morocco.xml.gz > /tmp/morocco-before.xml.gz
          python - <<'PY'
          import gzip,json,xml.etree.ElementTree as ET
          from pathlib import Path

          def read(path):
              return ET.fromstring(gzip.decompress(Path(path).read_bytes()))

          current=read("feeds/morocco.xml.gz")
          before=read("/tmp/morocco-before.xml.gz")
          wanted=["AlAoula","Arrabiaa","AlMaghribiya","Assadisa","Tamazight","2M","Arryadia_HD"]

          def sample(root,cid,n=8):
              rows=[]
              for p in root.findall("programme"):
                  if p.get("channel")!=cid:continue
                  t=p.find("title");d=p.find("desc")
                  rows.append({
                      "start":p.get("start"),
                      "title":(t.text or "").strip() if t is not None else "",
                      "desc":(d.text or "").strip()[:400] if d is not None else "",
                  })
                  if len(rows)>=n:break
              return rows

          out={cid:{"before":sample(before,cid),"current":sample(current,cid)} for cid in wanted}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
