name: Scrape Morocco unified

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morocco-unified-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml cloudscraper

      - name: Scrape unified Morocco EPG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/morocco
          args=(--output-dir output/morocco --days 3)
          if [ -s feeds/morocco.xml.gz ]; then
            args+=(--previous feeds/morocco.xml.gz)
          fi
          python tools/morocco_epg.py "${args[@]}"

      - name: Validate Morocco core channels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p=Path("output/morocco/morocco.xml.gz")
          assert p.exists() and p.stat().st_size>0, "morocco.xml.gz missing"
          root=ET.fromstring(gzip.decompress(p.read_bytes()))
          channels={c.get("id") for c in root.findall("channel")}
          counts={}
          for pr in root.findall("programme"):
              cid=pr.get("channel")
              counts[cid]=counts.get(cid,0)+1

          required={
              "2M":6,
              "AlAoula":1,
              "Arrabiaa":1,
              "AlMaghribiya":1,
              "Assadisa":1,
              "Tamazight":1,
          }
          for cid,minp in required.items():
              assert cid in channels, f"required Morocco channel missing: {cid}"
              assert counts.get(cid,0)>=minp, f"{cid}: only {counts.get(cid,0)} programmes"

          assert counts.get("Arryadia_HD",0)+counts.get("Arryadia_TNT",0)>=6,               "Arryadia real schedule missing"

          print("Morocco channels:",len(channels))
          print("Morocco programmes:",sum(counts.values()))
          for cid in sorted(counts):
              print(cid, counts[cid])
          PY

      - name: Strict Morocco 48-hour coverage audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python tools/validate_48h.py             output/morocco/morocco.xml.gz             --hours 48             --max-gap-minutes 90             --report reports/morocco-48h-audit.json

      - name: Validate published-cohort quality against staged Morocco XMLTV
        run: |
          python tools/audit_source_quality.py --input output/morocco/morocco.xml.gz --source morocco --report reports/morocco-quality.json

      - name: Stage unified feed and corresponding reports
        run: |
          mkdir -p /tmp/morocco-unified
          cp output/morocco/morocco.xml.gz /tmp/morocco-unified/
          cp output/morocco/manifest.json /tmp/morocco-unified/morocco.json
          cp output/morocco/morocco.txt /tmp/morocco-unified/
          cp reports/morocco-48h-audit.json /tmp/morocco-unified/
          cp reports/morocco-quality.json /tmp/morocco-unified/

      - name: Publish unified Morocco feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p feeds
            cp -f /tmp/morocco-unified/morocco.xml.gz feeds/morocco.xml.gz
            cp -f /tmp/morocco-unified/morocco.json feeds/morocco.json
            cp -f /tmp/morocco-unified/morocco.txt feeds/morocco.txt
            mkdir -p reports
            cp -f /tmp/morocco-unified/morocco-48h-audit.json reports/morocco-48h-audit.json
            cp -f /tmp/morocco-unified/morocco-quality.json reports/morocco-quality.json

            # Legacy Morocco fragments are removed only after the unified feed passed validation.
            rm -f feeds/2m.xml.gz feeds/2m.json feeds/2m.txt
            rm -f feeds/chada.xml.gz feeds/chada.json feeds/chada.txt

            git add -A feeds
            git add reports/morocco-48h-audit.json reports/morocco-quality.json
            if git diff --cached --quiet; then
              echo "No Morocco feed changes"
              exit 0
            fi
            git commit -m "Publish unified Morocco EPG"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*2))
          done
          exit 1
